name: foodex_driver_app
description: FOODEX Driver bootstrap foundation.
publish_to: "none"
version: 1.0.65+65
environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  foodex_visualization:
    path: ../../packages/foodex_visualization
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  image_picker: ^1.1.2
