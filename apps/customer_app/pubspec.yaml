name: foodex_customer_app
description: FOODEX Customer bootstrap foundation.
publish_to: "none"
version: 1.0.61+61

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  google_fonts: ^8.2.1
  firebase_core: ^3.15.2
  firebase_messaging: ^15.2.10
  flutter_local_notifications: ^18.0.1
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^11.2.0
  local_auth: ^2.3.0
  share_plus: ^13.3.0
  mobile_scanner: ^5.2.3
  geolocator: ^14.1.1
  flutter_map: ^8.2.1
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/splash_full.png
    - assets/branding/foodex-economical-group.webp
    - assets/branding/login_reference/
    - assets/store_selector/
    - assets/customer_ui_v3/asset_contract.json
