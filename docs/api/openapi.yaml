openapi: 3.1.0
info:
  title: FOODEX API
  version: 0.2.0
  description: Implementation baseline for FOODEX v1 mobile and web clients.
  license:
    name: Proprietary
servers:
  - url: /api/v1
security: []
tags:
  - name: Authentication
    description: Login, logout, profile and authenticated identity boundaries.
  - name: Stores
    description: Public and authorized store discovery.
  - name: Catalog
    description: Store-scoped categories, products and offers.
  - name: Cart
    description: Guest or authenticated shopping cart operations.
  - name: Checkout
    description: Authenticated, idempotent order creation boundary.
  - name: Orders
    description: Authenticated customer order access.
  - name: B2B
    description: Approved wholesale customer operations; public self-registration is forbidden.
  - name: Drivers
    description: Driver-role-scoped assignment operations.
  - name: Notifications
    description: Authenticated notification access.
  - name: Localization
    description: Arabic and English runtime translation bundles.
  - name: Version
    description: Platform and mobile application version policy.

paths:
  /version:
    get:
      tags: [Version]
      summary: Get platform API version
      operationId: getPlatformVersion
      responses:
        "200":
          description: Platform/API version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiVersion"

  /app-version:
    get:
      tags: [Version]
      summary: Get mobile application version policy
      operationId: getAppVersionPolicy
      parameters:
        - in: query
          name: platform
          required: true
          schema:
            type: string
            enum: [android, ios]
        - in: query
          name: app
          required: true
          schema:
            type: string
            enum: [customer, driver]
        - in: query
          name: current_version
          required: true
          schema:
            type: string
            maxLength: 64
      responses:
        "200":
          description: Mobile version policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppVersionPolicy"
        "400":
          $ref: "#/components/responses/BadRequest"

  /translations/{locale}:
    get:
      tags: [Localization]
      summary: Get the runtime translation bundle for a supported locale
      operationId: getTranslationBundle
      parameters:
        - in: path
          name: locale
          required: true
          schema:
            type: string
            enum: [ar, en]
      responses:
        "200":
          description: Translation key/value bundle with text direction
          content:
            application/json:
              schema:
                type: object
                required: [locale, direction, translations]
                properties:
                  locale:
                    type: string
                    enum: [ar, en]
                  direction:
                    type: string
                    enum: [rtl, ltr]
                  translations:
                    type: object
                    additionalProperties:
                      type: string
        "404":
          $ref: "#/components/responses/NotFound"

  /auth/login:
    post:
      tags: [Authentication]
      summary: Authenticate a FOODEX user
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated session/token response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/logout:
    post:
      tags: [Authentication]
      summary: Log out the authenticated user
      operationId: logout
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Logged out
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /profile:
    get:
      tags: [Authentication]
      summary: Get the authenticated customer profile
      operationId: getProfile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Authenticated identity and customer profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserIdentity"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /stores:
    get:
      tags: [Stores]
      summary: List active stores visible to the current client
      operationId: listStores
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Store collection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreCollection"

  /stores/{store}/categories:
    get:
      tags: [Catalog]
      summary: List categories for a store
      operationId: listStoreCategories
      parameters:
        - $ref: "#/components/parameters/StoreId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Category collection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryCollection"
        "404":
          $ref: "#/components/responses/NotFound"

  /stores/{store}/products:
    get:
      tags: [Catalog]
      summary: List active products for a store
      operationId: listStoreProducts
      parameters:
        - $ref: "#/components/parameters/StoreId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
        - in: query
          name: category
          schema:
            type: integer
            minimum: 1
        - in: query
          name: q
          schema:
            type: string
            maxLength: 120
        - in: query
          name: min_price
          schema:
            type: number
            minimum: 0
        - in: query
          name: max_price
          schema:
            type: number
            minimum: 0
        - in: query
          name: sort
          schema:
            type: string
            enum: [name, price]
        - in: query
          name: direction
          schema:
            type: string
            enum: [asc, desc]
      responses:
        "200":
          description: Product collection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductCollection"
        "404":
          $ref: "#/components/responses/NotFound"

  /stores/{store}/offers:
    get:
      tags: [Catalog]
      summary: List active offers for a store
      operationId: listStoreOffers
      parameters:
        - $ref: "#/components/parameters/StoreId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Store offer collection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfferCollection"
        "404":
          $ref: "#/components/responses/NotFound"

  /products/{product}:
    get:
      tags: [Catalog]
      summary: Get product details
      operationId: showProduct
      parameters:
        - $ref: "#/components/parameters/ProductId"
        - in: query
          name: store
          required: true
          description: Store context used for active availability and B2C pricing.
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Product detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          $ref: "#/components/responses/NotFound"

  /cart:
    get:
      tags: [Cart]
      summary: Get or initialize the current guest cart
      operationId: showCart
      parameters:
        - $ref: "#/components/parameters/GuestToken"
        - in: query
          name: store
          required: false
          description: Required only when initializing a guest cart without X-Guest-Token.
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Current guest cart. The response also returns X-Guest-Token.
          headers:
            X-Guest-Token:
              description: Opaque guest cart identity for subsequent cart requests.
              schema:
                type: string
                minLength: 16
                maxLength: 200
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
        "422":
          $ref: "#/components/responses/ValidationError"

  /cart/items:
    post:
      tags: [Cart]
      summary: Add an item to the current cart
      operationId: addCartItem
      parameters:
        - $ref: "#/components/parameters/GuestToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddCartItemRequest"
      responses:
        "201":
          description: Cart item created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
        "422":
          $ref: "#/components/responses/ValidationError"

  /cart/items/{item}:
    patch:
      tags: [Cart]
      summary: Update a cart item
      operationId: updateCartItem
      parameters:
        - $ref: "#/components/parameters/CartItemId"
        - $ref: "#/components/parameters/GuestToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCartItemRequest"
      responses:
        "200":
          description: Cart item updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [Cart]
      summary: Remove a cart item
      operationId: deleteCartItem
      parameters:
        - $ref: "#/components/parameters/CartItemId"
        - $ref: "#/components/parameters/GuestToken"
      responses:
        "204":
          description: Cart item removed
        "404":
          $ref: "#/components/responses/NotFound"

  /checkout:
    post:
      tags: [Checkout]
      summary: Create an order from the authenticated cart
      operationId: checkout
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutRequest"
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /orders:
    get:
      tags: [Orders]
      summary: List authenticated customer orders
      operationId: listOrders
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Authenticated order collection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderCollection"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /orders/{order}:
    get:
      tags: [Orders]
      summary: Get an authorized order
      operationId: showOrder
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrderId"
      responses:
        "200":
          description: Authorized order detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/reports/dashboard:
    get:
      tags: [Stores]
      summary: Get platform or authorized store dashboard aggregates
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: store_id
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Stable dashboard aggregate contract for platform or store scope
        "403":
          description: Missing reports.view permission or store scope
        "422":
          description: Store-scoped caller did not provide store_id

  /admin/inventory:
    get:
      tags: [Stores]
      summary: List inventory visible to the authorized store scope
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Scoped inventory collection
        "403":
          description: Missing inventory.manage permission

  /admin/inventory/{inventory}/adjust:
    post:
      tags: [Stores]
      summary: Adjust inventory within the authorized store scope
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: inventory
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Inventory adjusted and audited
        "403":
          description: Missing inventory.manage permission
        "404":
          description: Inventory is outside the caller store scope or does not exist
        "422":
          description: Invalid adjustment or would reduce stock below reserved quantity

  /admin/b2b/accounts:
    get:
      tags: [B2B]
      summary: List B2B accounts for authorized management users
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Paginated B2B accounts
        "403":
          description: Missing b2b.accounts.manage permission
    post:
      tags: [B2B]
      summary: Create a dashboard-managed pending B2B account
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Pending B2B account created
        "403":
          description: Missing b2b.accounts.manage permission
        "422":
          description: Validation error
  /admin/b2b/accounts/{account}/status:
    patch:
      tags: [B2B]
      summary: Approve, deny or suspend a B2B account
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: account
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: B2B account lifecycle state updated
        "403":
          description: Missing b2b.accounts.manage permission
        "422":
          description: Validation error
  /admin/b2b/prices:
    get:
      tags: [B2B]
      summary: List B2B account price rules
      security:
        - bearerAuth: []
      responses:
        "200":
          description: B2B price rules
        "403":
          description: Missing b2b.pricing.manage permission
    put:
      tags: [B2B]
      summary: Create or update an approved B2B price rule
      security:
        - bearerAuth: []
      responses:
        "200":
          description: B2B price rule updated
        "201":
          description: B2B price rule created
        "403":
          description: Missing b2b.pricing.manage permission
        "422":
          description: Validation error

  /b2b/dashboard:
    get:
      tags: [B2B]
      summary: Get approved B2B account dashboard summary
      operationId: getB2bDashboard
      security:
        - bearerAuth: []
      responses:
        "200":
          description: B2B dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/B2bDashboard"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /b2b/reports/purchases:
    get:
      tags: [B2B]
      summary: Get approved B2B purchase report aggregates
      operationId: getB2bPurchaseReports
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: from
          schema: { type: string, format: date }
        - in: query
          name: to
          schema: { type: string, format: date }
      responses:
        "200":
          description: Date-grouped B2B purchase totals
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: Invalid date range

  /b2b/products:
    get:
      tags: [B2B]
      summary: List the approved B2B catalog with account pricing
      operationId: listB2bProducts
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Approved B2B catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/B2bProductCollection"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /b2b/orders:
    get:
      tags: [B2B]
      summary: List B2B customer orders
      operationId: listB2bOrders
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: B2B order collection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderCollection"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /b2b/orders/{order}:
    get:
      tags: [B2B]
      summary: Get an authorized B2B order
      operationId: showB2bOrder
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrderId"
      responses:
        "200":
          description: Authorized B2B order detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /b2b/invoices:
    get:
      tags: [B2B]
      summary: List invoices for the approved B2B account
      operationId: listB2bInvoices
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: B2B invoice collection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceCollection"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /b2b/invoices/{invoice}:
    get:
      tags: [B2B]
      summary: Get an authorized B2B invoice
      operationId: showB2bInvoice
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/InvoiceId"
      responses:
        "200":
          description: B2B invoice detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /b2b/account-statement:
    get:
      tags: [B2B]
      summary: Get the approved B2B account statement
      operationId: getB2bAccountStatement
      security:
        - bearerAuth: []
      responses:
        "200":
          description: B2B account statement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/B2bAccountStatement"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /drivers/assignments:
    get:
      tags: [Drivers]
      summary: List assignments for the authenticated driver role
      operationId: listDriverAssignments
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Assignments filtered by exact driver role and channel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverAssignmentCollection"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /notifications:
    get:
      tags: [Notifications]
      summary: List notifications for the authenticated user
      operationId: listNotifications
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
        - $ref: "#/components/parameters/Locale"
      responses:
        "200":
          description: User notification collection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationCollection"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /notifications/{notification}:
    get:
      tags: [Notifications]
      summary: Get one authorized notification in the requested locale
      operationId: getNotification
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/NotificationId"
        - $ref: "#/components/parameters/Locale"
      responses:
        "200":
          description: Localized notification detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

  /notifications/{notification}/read:
    post:
      tags: [Notifications]
      summary: Mark one authorized notification as read
      operationId: markNotificationRead
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/NotificationId"
      responses:
        "204":
          description: Notification marked as read
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"


  /admin/security/permissions:
    get:
      tags: [Security]
      summary: List the declared FOODEX permission catalog
      operationId: listSecurityPermissions
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Permission catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecurityPermissionCollection"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/security/roles:
    get:
      tags: [Security]
      summary: List roles and their permissions
      operationId: listSecurityRoles
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Role collection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecurityRoleCollection"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Security]
      summary: Create a delegated role
      operationId: createSecurityRole
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SecurityRoleWrite"
      responses:
        "201":
          description: Role created
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"

  /admin/security/roles/{role}:
    patch:
      tags: [Security]
      summary: Update a role and permission matrix
      operationId: updateSecurityRole
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: role
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SecurityRoleWrite"
      responses:
        "200":
          description: Role updated
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [Security]
      summary: Delete an unassigned custom role
      operationId: deleteSecurityRole
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: role
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Role deleted
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"

  /admin/security/roles/{role}/clone:
    post:
      tags: [Security]
      summary: Clone a role
      operationId: cloneSecurityRole
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: role
          required: true
          schema:
            type: integer
      responses:
        "201":
          description: Role cloned
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/security/users:
    get:
      tags: [Security]
      summary: List users with account status and role assignments
      operationId: listSecurityUsers
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
        - in: query
          name: q
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
            enum: [all, active, inactive]
        - in: query
          name: store_id
          schema:
            type: integer
      responses:
        "200":
          description: User access collection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecurityUserCollection"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/security/users/{user}:
    get:
      tags: [Security]
      summary: Get effective access for one user
      operationId: getSecurityUser
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: user
          required: true
          schema:
            type: integer
        - in: query
          name: store_id
          schema:
            type: integer
      responses:
        "200":
          description: User access detail
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/security/users/{user}/roles:
    put:
      tags: [Security]
      summary: Replace global and store-scoped role assignments
      operationId: replaceSecurityUserRoles
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: user
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SecurityUserRolesWrite"
      responses:
        "200":
          description: Role assignments updated
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"

  /admin/security/users/{user}/status:
    patch:
      tags: [Security]
      summary: Activate or deactivate a user account
      operationId: updateSecurityUserStatus
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: user
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SecurityUserStatusWrite"
      responses:
        "200":
          description: User status updated
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"

  /admin/deliveries/assign:
    post:
      tags: [Drivers]
      summary: Assign an order to a driver of the same channel
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Delivery assignment created
        "403":
          description: Missing channel management permission or store scope
        "409":
          description: Driver and order channels do not match

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  parameters:
    StoreId:
      in: path
      name: store
      required: true
      schema:
        type: integer
        minimum: 1
    ProductId:
      in: path
      name: product
      required: true
      schema:
        type: integer
        minimum: 1
    CartItemId:
      in: path
      name: item
      required: true
      schema:
        type: integer
        minimum: 1
    OrderId:
      in: path
      name: order
      required: true
      schema:
        type: integer
        minimum: 1
    InvoiceId:
      in: path
      name: invoice
      required: true
      schema:
        type: integer
        minimum: 1
    NotificationId:
      in: path
      name: notification
      required: true
      schema:
        type: integer
        minimum: 1
    Locale:
      in: query
      name: locale
      description: Requested localized notification content. Falls back to the authenticated user's locale.
      schema:
        type: string
        enum: [ar, en]

    Page:
      in: query
      name: page
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      in: query
      name: per_page
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    GuestToken:
      in: header
      name: X-Guest-Token
      required: false
      description: Opaque cart identity for guest browsing. Ignored when the authenticated cart is authoritative.
      schema:
        type: string
        minLength: 16
        maxLength: 200
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      description: Client-generated key preventing duplicate order creation for a retried checkout.
      schema:
        type: string
        minLength: 16
        maxLength: 100

  schemas:
    ApiVersion:
      type: object
      required: [version]
      properties:
        version:
          type: string

    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    LoginResponse:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
        token_type:
          type: string
          const: Bearer
        user:
          $ref: "#/components/schemas/UserIdentity"

    UserIdentity:
      type: object
      required: [id, name, email, roles]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
        locale:
          type: string
          enum: [ar, en]
        roles:
          type: array
          uniqueItems: true
          items:
            type: string
        store_ids:
          type: array
          uniqueItems: true
          items:
            type: integer

    Store:
      type: object
      required: [id, code, name, store_type, is_active]
      properties:
        id:
          type: integer
        code:
          type: string
        name:
          type: string
        store_type:
          type: string
        is_active:
          type: boolean

    Category:
      type: object
      required: [id, name, slug, is_active]
      properties:
        id:
          type: integer
        parent_id:
          type: [integer, "null"]
        name:
          type: string
        slug:
          type: string
        is_active:
          type: boolean

    ProductSummary:
      type: object
      required: [id, sku, name, is_active]
      properties:
        id:
          type: integer
        sku:
          type: string
        name:
          type: string
        category_id:
          type: [integer, "null"]
        brand_id:
          type: [integer, "null"]
        is_active:
          type: boolean
        price:
          type: [number, "null"]
          multipleOf: 0.001
        currency:
          type: string
          enum: [KWD]

    Product:
      allOf:
        - $ref: "#/components/schemas/ProductSummary"
        - type: object
          properties:
            description:
              type: [string, "null"]
            images:
              type: array
              items:
                type: string
                format: uri-reference

    Offer:
      type: object
      required: [id, name, type, is_active]
      properties:
        id:
          type: integer
        name:
          type: string
        type:
          type: string
        value:
          type: [number, "null"]
          multipleOf: 0.001
        starts_at:
          type: [string, "null"]
          format: date-time
        ends_at:
          type: [string, "null"]
          format: date-time
        is_active:
          type: boolean

    CartItem:
      type: object
      required: [id, product, quantity]
      properties:
        id:
          type: integer
        product:
          $ref: "#/components/schemas/ProductSummary"
        quantity:
          type: number
          exclusiveMinimum: 0
          multipleOf: 0.001
        unit_price_snapshot:
          type: [number, "null"]
          multipleOf: 0.001
        line_total:
          type: [number, "null"]
          multipleOf: 0.001

    Cart:
      type: object
      required: [id, store_id, channel, items]
      properties:
        id:
          type: integer
        store_id:
          type: integer
        channel:
          type: string
          enum: [b2c, b2b]
        guest_token:
          type: [string, "null"]
        currency:
          type: string
          enum: [KWD]
        items:
          type: array
          items:
            $ref: "#/components/schemas/CartItem"
        subtotal:
          type: number
          multipleOf: 0.001

    AddCartItemRequest:
      type: object
      additionalProperties: false
      required: [store_id, product_id, quantity]
      properties:
        store_id:
          type: integer
          minimum: 1
        product_id:
          type: integer
          minimum: 1
        quantity:
          type: number
          exclusiveMinimum: 0
          multipleOf: 0.001

    UpdateCartItemRequest:
      type: object
      additionalProperties: false
      required: [quantity]
      properties:
        quantity:
          type: number
          exclusiveMinimum: 0
          multipleOf: 0.001

    CheckoutRequest:
      type: object
      additionalProperties: false
      required: [address_id]
      properties:
        address_id:
          type: integer
          minimum: 1
        payment_method:
          type: [string, "null"]
        note:
          type: [string, "null"]
          maxLength: 1000

    OrderItem:
      type: object
      required: [id, product_id, sku, name, quantity, unit_price, line_total]
      properties:
        id:
          type: integer
        product_id:
          type: integer
        sku:
          type: string
        name:
          type: string
        quantity:
          type: number
          exclusiveMinimum: 0
          multipleOf: 0.001
        unit_price:
          type: number
          multipleOf: 0.001
        line_total:
          type: number
          multipleOf: 0.001

    Order:
      type: object
      required:
        [id, order_number, store_id, channel, status, currency, subtotal, grand_total, items, created_at]
      properties:
        id:
          type: integer
        order_number:
          type: string
        store_id:
          type: integer
        channel:
          type: string
          enum: [b2c, b2b]
        status:
          type: string
        currency:
          type: string
          enum: [KWD]
        subtotal:
          type: number
          multipleOf: 0.001
        discount_total:
          type: number
          multipleOf: 0.001
        delivery_total:
          type: number
          multipleOf: 0.001
        grand_total:
          type: number
          multipleOf: 0.001
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        created_at:
          type: string
          format: date-time

    B2bProduct:
      allOf:
        - $ref: "#/components/schemas/ProductSummary"
        - type: object
          required: [account_price]
          properties:
            account_price:
              type: number
              multipleOf: 0.001
            minimum_order_quantity:
              type: number
              minimum: 0
              multipleOf: 0.001
            price_tier:
              type: [string, "null"]

    B2bDashboard:
      type: object
      required: [open_orders, outstanding_balance, currency]
      properties:
        open_orders:
          type: integer
          minimum: 0
        outstanding_balance:
          type: number
          multipleOf: 0.001
        currency:
          type: string
          enum: [KWD]

    Invoice:
      type: object
      required: [id, invoice_number, status, currency, total]
      properties:
        id:
          type: integer
        invoice_number:
          type: string
        order_id:
          type: [integer, "null"]
        status:
          type: string
        currency:
          type: string
          enum: [KWD]
        total:
          type: number
          multipleOf: 0.001
        issued_at:
          type: [string, "null"]
          format: date-time
        due_at:
          type: [string, "null"]
          format: date-time

    B2bAccountStatement:
      type: object
      required: [currency, balance, entries]
      properties:
        currency:
          type: string
          enum: [KWD]
        balance:
          type: number
          multipleOf: 0.001
        entries:
          type: array
          items:
            type: object
            required: [date, type, amount]
            properties:
              date:
                type: string
                format: date
              type:
                type: string
              reference:
                type: [string, "null"]
              amount:
                type: number
                multipleOf: 0.001

    DriverAssignment:
      type: object
      required: [id, order_id, assignment_type, status]
      properties:
        id:
          type: integer
        order_id:
          type: integer
        assignment_type:
          type: string
          enum: [b2c, b2b]
        status:
          type: string
        assigned_at:
          type: [string, "null"]
          format: date-time
        completed_at:
          type: [string, "null"]
          format: date-time

    Notification:
      type: object
      required: [id, channel, target_channel, type, title, body, locale, created_at]
      properties:
        id:
          type: integer
        channel:
          type: string
          enum: [in_app, push, both]
        target_channel:
          type: string
          enum: [all, b2c, b2b]
        type:
          type: string
        title:
          type: string
          description: Localized title selected for the requested/user locale.
        body:
          type: string
          description: Localized body selected for the requested/user locale.
        locale:
          type: string
          enum: [ar, en]
        data:
          type: [object, "null"]
          additionalProperties: true
        read_at:
          type: [string, "null"]
          format: date-time
        published_at:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time

    AppVersionPolicy:
      type: object
      required: [latest_version, minimum_supported_version, force_update, update_required, status]
      properties:
        latest_version:
          type: string
        minimum_supported_version:
          type: string
        force_update:
          type: boolean
        update_required:
          type: boolean
        status:
          type: string
          enum: [current, optional, forced, unsupported]
        store_url:
          type: [string, "null"]
          format: uri
        release_notes:
          type: [string, "null"]


    SecurityPermission:
      type: object
      required: [id, code, name, module, action]
      properties:
        id:
          type: integer
        code:
          type: string
        name:
          type: string
        module:
          type: string
        action:
          type: string

    SecurityPermissionCollection:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/SecurityPermission"

    SecurityRole:
      type: object
      required: [id, code, name, scope, is_system, is_active, permissions]
      properties:
        id:
          type: integer
        code:
          type: string
        name:
          type: string
        description:
          type: [string, "null"]
        scope:
          type: string
          enum: [global, store, both]
        is_system:
          type: boolean
        is_active:
          type: boolean
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/SecurityPermission"

    SecurityRoleCollection:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/SecurityRole"

    SecurityRoleWrite:
      type: object
      required: [name, scope, is_active, permission_ids]
      properties:
        code:
          type: string
          pattern: "^[A-Z][A-Z0-9_]{2,49}$"
        name:
          type: string
        description:
          type: [string, "null"]
        scope:
          type: string
          enum: [global, store, both]
        is_active:
          type: boolean
        permission_ids:
          type: array
          uniqueItems: true
          items:
            type: integer

    SecurityUser:
      type: object
      required: [id, name, email, is_active, global_roles, store_roles, effective_permissions]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
        locale:
          type: string
          enum: [ar, en]
        is_active:
          type: boolean
        deactivated_at:
          type: [string, "null"]
          format: date-time
        deactivation_reason:
          type: [string, "null"]
        global_roles:
          type: array
          items:
            type: object
            additionalProperties: true
        store_roles:
          type: array
          items:
            type: object
            additionalProperties: true
        effective_permissions:
          type: array
          uniqueItems: true
          items:
            type: string

    SecurityUserCollection:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/SecurityUser"
        meta:
          $ref: "#/components/schemas/PaginationMeta"

    SecurityUserRolesWrite:
      type: object
      required: [global_role_ids, store_roles]
      properties:
        global_role_ids:
          type: array
          uniqueItems: true
          items:
            type: integer
        store_roles:
          type: array
          items:
            type: object
            required: [store_id, role_id]
            properties:
              store_id:
                type: integer
              role_id:
                type: integer

    SecurityUserStatusWrite:
      type: object
      required: [is_active]
      properties:
        is_active:
          type: boolean
        reason:
          type: [string, "null"]
          maxLength: 500

    PaginationMeta:
      type: object
      required: [current_page, per_page, total]
      properties:
        current_page:
          type: integer
          minimum: 1
        per_page:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0

    StoreCollection:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Store"
        meta:
          $ref: "#/components/schemas/PaginationMeta"

    CategoryCollection:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Category"
        meta:
          $ref: "#/components/schemas/PaginationMeta"

    ProductCollection:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ProductSummary"
        meta:
          $ref: "#/components/schemas/PaginationMeta"

    OfferCollection:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Offer"
        meta:
          $ref: "#/components/schemas/PaginationMeta"

    OrderCollection:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Order"
        meta:
          $ref: "#/components/schemas/PaginationMeta"

    B2bProductCollection:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/B2bProduct"
        meta:
          $ref: "#/components/schemas/PaginationMeta"

    InvoiceCollection:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Invoice"
        meta:
          $ref: "#/components/schemas/PaginationMeta"

    DriverAssignmentCollection:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/DriverAssignment"
        meta:
          $ref: "#/components/schemas/PaginationMeta"

    NotificationCollection:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Notification"
        meta:
          $ref: "#/components/schemas/PaginationMeta"

    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
        code:
          type: [string, "null"]
        errors:
          type: [object, "null"]
          additionalProperties: true

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthenticated:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Authenticated but not authorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found or not visible in authorized scope
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Request conflicts with current resource state or idempotency key
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

