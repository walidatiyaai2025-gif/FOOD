openapi: 3.1.0
info:
  title: FOODEX API
  version: 0.2.0
  description: Implementation baseline for FOODEX v1 mobile and web clients.
  license:
    name: Proprietary
servers:
  - url: /api/v1
security: []
tags:
  - name: Authentication
    description: Login, logout, profile and authenticated identity boundaries.
  - name: Stores
    description: Public and authorized store discovery.
  - name: Catalog
    description: Store-scoped categories, products and offers.
  - name: Cart
    description: Guest or authenticated shopping cart operations.
  - name: Checkout
    description: Authenticated, idempotent order creation boundary.
  - name: Orders
    description: Authenticated customer order access.
  - name: B2B
    description: Approved wholesale customer operations; public self-registration is forbidden.
  - name: Drivers
    description: Driver-role-scoped assignment operations.
  - name: Notifications
    description: Authenticated notification access.
  - name: Version
    description: Platform and mobile application version policy.

paths:
  /version:
    get:
      tags: [Version]
      summary: Get platform API version
      operationId: getPlatformVersion
      responses:
        "200":
          description: Platform/API version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiVersion"

  /app-version:
    get:
      tags: [Version]
      summary: Get mobile application version policy
      operationId: getAppVersionPolicy
      parameters:
        - in: query
          name: platform
          required: true
          schema:
            type: string
            enum: [android, ios]
        - in: query
          name: app
          required: true
          schema:
            type: string
            enum: [customer, driver]
        - in: query
          name: current_version
          required: true
          schema:
            type: string
            maxLength: 64
      responses:
        "200":
          description: Mobile version policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppVersionPolicy"
        "400":
          $ref: "#/components/responses/BadRequest"

  /auth/login:
    post:
      tags: [Authentication]
      summary: Authenticate a FOODEX user
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated session/token response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/logout:
    post:
      tags: [Authentication]
      summary: Log out the authenticated user
      operationId: logout
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Logged out
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /profile:
    get:
      tags: [Authentication]
      summary: Get the authenticated identity and customer profile
      operationId: getProfile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Authenticated identity and customer-owned profile resources
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserIdentity"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    patch:
      tags: [Authentication]
      summary: Update authenticated customer profile data
      operationId: updateProfile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdateRequest"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserIdentity"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"

  /profile/addresses:
    get:
      tags: [Authentication]
      summary: List authenticated customer's saved addresses
      operationId: listProfileAddresses
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Customer-owned addresses
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Address"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Authentication]
      summary: Create a saved address for the authenticated customer
      operationId: createProfileAddress
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddressCreateRequest"
      responses:
        "201":
          description: Address created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Address"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"

  /profile/addresses/{address}:
    patch:
      tags: [Authentication]
      summary: Update an authenticated customer's saved address
      operationId: updateProfileAddress
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AddressId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddressUpdateRequest"
      responses:
        "200":
          description: Address updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Address"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [Authentication]
      summary: Delete an authenticated customer's saved address
      operationId: deleteProfileAddress
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AddressId"
      responses:
        "204":
          description: Address deleted
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /profile/favorites:
    get:
      tags: [Authentication]
      summary: List authenticated customer's active favorite products
      operationId: listProfileFavorites
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Active favorite products
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ProductSummary"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /profile/favorites/{product}:
    post:
      tags: [Authentication]
      summary: Add an active product to authenticated customer's favorites
      operationId: addProfileFavorite
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProductId"
      responses:
        "200":
          description: Favorite already existed
        "201":
          description: Favorite created
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Authentication]
      summary: Remove a product from authenticated customer's favorites
      operationId: removeProfileFavorite
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProductId"
      responses:
        "204":
          description: Favorite removed
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /stores:
    get:
      tags: [Stores]
      summary: List active stores visible to the current client
      operationId: listStores
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Store collection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreCollection"

  /stores/{store}/categories:
    get:
      tags: [Catalog]
      summary: List categories for a store
      operationId: listStoreCategories
      parameters:
        - $ref: "#/components/parameters/StoreId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Category collection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryCollection"
        "404":
          $ref: "#/components/responses/NotFound"

  /stores/{store}/products:
    get:
      tags: [Catalog]
      summary: List active products for a store
      operationId: listStoreProducts
      parameters:
        - $ref: "#/components/parameters/StoreId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
        - in: query
          name: category
          schema:
            type: integer
            minimum: 1
        - in: query
          name: q
          schema:
            type: string
            maxLength: 120
        - in: query
          name: min_price
          schema:
            type: number
            minimum: 0
        - in: query
          name: max_price
          schema:
            type: number
            minimum: 0
        - in: query
          name: sort
          schema:
            type: string
            enum: [name, price]
        - in: query
          name: direction
          schema:
            type: string
            enum: [asc, desc]
      responses:
        "200":
          description: Product collection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductCollection"
        "404":
          $ref: "#/components/responses/NotFound"

  /stores/{store}/offers:
    get:
      tags: [Catalog]
      summary: List active offers for a store
      operationId: listStoreOffers
      parameters:
        - $ref: "#/components/parameters/StoreId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Store offer collection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfferCollection"
        "404":
          $ref: "#/components/responses/NotFound"

  /products/{product}:
    get:
      tags: [Catalog]
      summary: Get product details
      operationId: showProduct
      parameters:
        - $ref: "#/components/parameters/ProductId"
        - in: query
          name: store
          required: true
          description: Store context used for active availability and B2C pricing.
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Product detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          $ref: "#/components/responses/NotFound"

  /cart:
    get:
      tags: [Cart]
      summary: Get or initialize the current guest or authenticated customer cart
      operationId: showCart
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/GuestToken"
        - in: query
          name: store
          required: false
          description: Store context required when initializing a cart without an existing guest token.
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Current cart. Guest responses also return X-Guest-Token.
          headers:
            X-Guest-Token:
              description: Opaque guest cart identity for subsequent guest requests.
              schema:
                type: string
                minLength: 16
                maxLength: 200
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
        "422":
          $ref: "#/components/responses/ValidationError"

  /cart/items:
    post:
      tags: [Cart]
      summary: Add an item to the current cart
      operationId: addCartItem
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/GuestToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddCartItemRequest"
      responses:
        "201":
          description: Cart item created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
        "422":
          $ref: "#/components/responses/ValidationError"

  /cart/items/{item}:
    patch:
      tags: [Cart]
      summary: Update a cart item
      operationId: updateCartItem
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CartItemId"
        - $ref: "#/components/parameters/GuestToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCartItemRequest"
      responses:
        "200":
          description: Cart item updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [Cart]
      summary: Remove a cart item
      operationId: deleteCartItem
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CartItemId"
        - $ref: "#/components/parameters/GuestToken"
      responses:
        "204":
          description: Cart item removed
        "404":
          $ref: "#/components/responses/NotFound"

  /checkout:
    post:
      tags: [Checkout]
      summary: Create an order from the authenticated cart
      operationId: checkout
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutRequest"
      responses:
        "200":
          description: Idempotent replay of the previously created order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "201":
          description: Order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /orders:
    get:
      tags: [Orders]
      summary: List authenticated customer orders
      operationId: listOrders
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Authenticated order collection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderCollection"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /orders/{order}:
    get:
      tags: [Orders]
      summary: Get an authorized order
      operationId: showOrder
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrderId"
      responses:
        "200":
          description: Authorized order detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

  /orders/{order}/status:
    post:
      tags: [Orders]
      summary: Transition an order status using an authorized management role
      operationId: transitionOrderStatus
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderStatusUpdateRequest"
      responses:
        "200":
          description: Order status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /b2b/dashboard:
    get:
      tags: [B2B]
      summary: Get approved B2B account dashboard summary
      operationId: getB2bDashboard
      security:
        - bearerAuth: []
      responses:
        "200":
          description: B2B dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/B2bDashboard"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /b2b/products:
    get:
      tags: [B2B]
      summary: List the approved B2B catalog with account pricing
      operationId: listB2bProducts
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Approved B2B catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/B2bProductCollection"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /b2b/orders:
    get:
      tags: [B2B]
      summary: List B2B customer orders
      operationId: listB2bOrders
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: B2B order collection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderCollection"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /b2b/orders/{order}:
    get:
      tags: [B2B]
      summary: Get an authorized B2B order
      operationId: showB2bOrder
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrderId"
      responses:
        "200":
          description: Authorized B2B order detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /b2b/invoices:
    get:
      tags: [B2B]
      summary: List invoices for the approved B2B account
      operationId: listB2bInvoices
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: B2B invoice collection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceCollection"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /b2b/invoices/{invoice}:
    get:
      tags: [B2B]
      summary: Get an authorized B2B invoice
      operationId: showB2bInvoice
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/InvoiceId"
      responses:
        "200":
          description: B2B invoice detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /b2b/account-statement:
    get:
      tags: [B2B]
      summary: Get the approved B2B account statement
      operationId: getB2bAccountStatement
      security:
        - bearerAuth: []
      responses:
        "200":
          description: B2B account statement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/B2bAccountStatement"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /drivers/assignments:
    get:
      tags: [Drivers]
      summary: List assignments for the authenticated driver role
      operationId: listDriverAssignments
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Assignments filtered by exact driver role and channel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverAssignmentCollection"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /notifications:
    get:
      tags: [Notifications]
      summary: List notifications for the authenticated user
      operationId: listNotifications
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: User notification collection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationCollection"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /notifications/{notification}/read:
    post:
      tags: [Notifications]
      summary: Mark one authorized notification as read
      operationId: markNotificationRead
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/NotificationId"
      responses:
        "204":
          description: Notification marked as read
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  parameters:
    StoreId:
      in: path
      name: store
      required: true
      schema:
        type: integer
        minimum: 1
    ProductId:
      in: path
      name: product
      required: true
      schema:
        type: integer
        minimum: 1
    AddressId:
      in: path
      name: address
      required: true
      schema:
        type: integer
        minimum: 1
    CartItemId:
      in: path
      name: item
      required: true
      schema:
        type: integer
        minimum: 1
    OrderId:
      in: path
      name: order
      required: true
      schema:
        type: integer
        minimum: 1
    InvoiceId:
      in: path
      name: invoice
      required: true
      schema:
        type: integer
        minimum: 1
    NotificationId:
      in: path
      name: notification
      required: true
      schema:
        type: integer
        minimum: 1
    Page:
      in: query
      name: page
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      in: query
      name: per_page
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    GuestToken:
      in: header
      name: X-Guest-Token
      required: false
      description: Opaque B2C guest cart identity. An authenticated B2C customer may supply it to merge that guest cart into the customer cart for the same store; B2B merge is rejected.
      schema:
        type: string
        minLength: 16
        maxLength: 200
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      description: Client-generated key preventing duplicate order creation for a retried checkout.
      schema:
        type: string
        minLength: 16
        maxLength: 100

  schemas:
    ApiVersion:
      type: object
      required: [version]
      properties:
        version:
          type: string

    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    LoginResponse:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
        token_type:
          type: string
          const: Bearer
        user:
          $ref: "#/components/schemas/UserIdentity"

    UserIdentity:
      type: object
      required: [id, name, email, roles]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
        locale:
          type: string
          enum: [ar, en]
        roles:
          type: array
          uniqueItems: true
          items:
            type: string
        store_ids:
          type: array
          uniqueItems: true
          items:
            type: integer
        customer:
          anyOf:
            - $ref: "#/components/schemas/CustomerProfile"
            - type: "null"
        addresses:
          type: array
          items:
            $ref: "#/components/schemas/Address"
        favorites:
          type: array
          items:
            $ref: "#/components/schemas/ProductSummary"

    ProfileUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 255
        email:
          type: string
          format: email
          maxLength: 255
        phone:
          type: [string, "null"]
          maxLength: 50
        locale:
          type: string
          enum: [ar, en]

    CustomerProfile:
      type: object
      required: [id, type, name]
      properties:
        id:
          type: integer
        type:
          type: string
          enum: [b2c, b2b]
        name:
          type: string
        phone:
          type: [string, "null"]
        email:
          type: [string, "null"]
          format: email

    Address:
      type: object
      required: [id, line1, city, country_code, is_default]
      properties:
        id:
          type: integer
        label:
          type: [string, "null"]
        line1:
          type: string
        line2:
          type: [string, "null"]
        city:
          type: string
        area:
          type: [string, "null"]
        country_code:
          type: string
          minLength: 2
          maxLength: 2
        latitude:
          type: [number, "null"]
        longitude:
          type: [number, "null"]
        is_default:
          type: boolean

    AddressCreateRequest:
      type: object
      additionalProperties: false
      required: [line1, city, country_code]
      properties:
        label:
          type: [string, "null"]
          maxLength: 100
        line1:
          type: string
          maxLength: 255
        line2:
          type: [string, "null"]
          maxLength: 255
        city:
          type: string
          maxLength: 120
        area:
          type: [string, "null"]
          maxLength: 120
        country_code:
          type: string
          minLength: 2
          maxLength: 2
        latitude:
          type: [number, "null"]
          minimum: -90
          maximum: 90
        longitude:
          type: [number, "null"]
          minimum: -180
          maximum: 180
        is_default:
          type: boolean

    AddressUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        label:
          type: [string, "null"]
          maxLength: 100
        line1:
          type: string
          maxLength: 255
        line2:
          type: [string, "null"]
          maxLength: 255
        city:
          type: string
          maxLength: 120
        area:
          type: [string, "null"]
          maxLength: 120
        country_code:
          type: string
          minLength: 2
          maxLength: 2
        latitude:
          type: [number, "null"]
          minimum: -90
          maximum: 90
        longitude:
          type: [number, "null"]
          minimum: -180
          maximum: 180
        is_default:
          type: boolean

    Store:
      type: object
      required: [id, code, name, store_type, is_active]
      properties:
        id:
          type: integer
        code:
          type: string
        name:
          type: string
        store_type:
          type: string
        is_active:
          type: boolean

    Category:
      type: object
      required: [id, name, slug, is_active]
      properties:
        id:
          type: integer
        parent_id:
          type: [integer, "null"]
        name:
          type: string
        slug:
          type: string
        is_active:
          type: boolean

    ProductSummary:
      type: object
      required: [id, sku, name, is_active]
      properties:
        id:
          type: integer
        sku:
          type: string
        name:
          type: string
        category_id:
          type: [integer, "null"]
        brand_id:
          type: [integer, "null"]
        is_active:
          type: boolean
        price:
          type: [number, "null"]
          multipleOf: 0.001
        currency:
          type: string
          enum: [KWD]

    Product:
      allOf:
        - $ref: "#/components/schemas/ProductSummary"
        - type: object
          properties:
            description:
              type: [string, "null"]
            images:
              type: array
              items:
                type: string
                format: uri-reference

    Offer:
      type: object
      required: [id, name, type, is_active]
      properties:
        id:
          type: integer
        name:
          type: string
        type:
          type: string
        value:
          type: [number, "null"]
          multipleOf: 0.001
        starts_at:
          type: [string, "null"]
          format: date-time
        ends_at:
          type: [string, "null"]
          format: date-time
        is_active:
          type: boolean

    CartItem:
      type: object
      required: [id, product, quantity, is_available, available_quantity]
      properties:
        id:
          type: integer
        product:
          $ref: "#/components/schemas/ProductSummary"
        quantity:
          type: number
          exclusiveMinimum: 0
          multipleOf: 0.001
        unit_price_snapshot:
          type: [number, "null"]
          multipleOf: 0.001
        line_total:
          type: [number, "null"]
          multipleOf: 0.001
        is_available:
          type: boolean
        available_quantity:
          type: [number, "null"]
          minimum: 0
          multipleOf: 0.001

    Cart:
      type: object
      required: [id, store_id, customer_id, channel, guest_token, currency, items, subtotal, has_unavailable_items]
      properties:
        id:
          type: integer
        store_id:
          type: integer
        customer_id:
          type: [integer, "null"]
        channel:
          type: string
          enum: [b2c, b2b]
        guest_token:
          type: [string, "null"]
        currency:
          type: string
          enum: [KWD]
        items:
          type: array
          items:
            $ref: "#/components/schemas/CartItem"
        subtotal:
          type: number
          multipleOf: 0.001
        has_unavailable_items:
          type: boolean

    AddCartItemRequest:
      type: object
      additionalProperties: false
      required: [store_id, product_id, quantity]
      properties:
        store_id:
          type: integer
          minimum: 1
        product_id:
          type: integer
          minimum: 1
        quantity:
          type: number
          exclusiveMinimum: 0
          multipleOf: 0.001

    UpdateCartItemRequest:
      type: object
      additionalProperties: false
      required: [quantity]
      properties:
        quantity:
          type: number
          exclusiveMinimum: 0
          multipleOf: 0.001

    CheckoutRequest:
      type: object
      additionalProperties: false
      required: [store_id, address_id]
      properties:
        store_id:
          type: integer
          minimum: 1
        address_id:
          type: integer
          minimum: 1
        payment_method:
          type: [string, "null"]
        note:
          type: [string, "null"]
          maxLength: 1000

    OrderItem:
      type: object
      required: [id, product_id, sku, name, quantity, unit_price, line_total]
      properties:
        id:
          type: integer
        product_id:
          type: integer
        sku:
          type: string
        name:
          type: string
        quantity:
          type: number
          exclusiveMinimum: 0
          multipleOf: 0.001
        unit_price:
          type: number
          multipleOf: 0.001
        line_total:
          type: number
          multipleOf: 0.001

    Order:
      type: object
      required:
        [id, order_number, store_id, channel, status, currency, subtotal, grand_total, items, status_history, created_at]
      properties:
        id:
          type: integer
        order_number:
          type: string
        store_id:
          type: integer
        address_id:
          type: [integer, "null"]
        channel:
          type: string
          enum: [b2c, b2b]
        status:
          type: string
        currency:
          type: string
          enum: [KWD]
        subtotal:
          type: number
          multipleOf: 0.001
        discount_total:
          type: number
          multipleOf: 0.001
        delivery_total:
          type: number
          multipleOf: 0.001
        grand_total:
          type: number
          multipleOf: 0.001
        payment_method:
          type: [string, "null"]
        payment:
          anyOf:
            - $ref: "#/components/schemas/PaymentSummary"
            - type: "null"
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        status_history:
          type: array
          items:
            $ref: "#/components/schemas/OrderStatusHistoryEntry"
        created_at:
          type: string
          format: date-time

    OrderStatusUpdateRequest:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [pending, confirmed, preparing, ready, out_for_delivery, delivered, failed, cancelled]
        note:
          type: [string, "null"]
          maxLength: 1000

    OrderStatusHistoryEntry:
      type: object
      required: [id, from_status, to_status, note, created_at]
      properties:
        id:
          type: integer
        from_status:
          type: [string, "null"]
        to_status:
          type: string
        note:
          type: [string, "null"]
        created_at:
          type: [string, "null"]
          format: date-time

    PaymentSummary:
      type: object
      required: [id, provider, status, amount, currency]
      properties:
        id:
          type: integer
        provider:
          type: string
        status:
          type: string
        amount:
          type: number
          multipleOf: 0.001
        currency:
          type: string
          enum: [KWD]

    B2bProduct:
      allOf:
        - $ref: "#/components/schemas/ProductSummary"
        - type: object
          required: [account_price]
          properties:
            account_price:
              type: number
              multipleOf: 0.001
            minimum_order_quantity:
              type: number
              minimum: 0
              multipleOf: 0.001
            price_tier:
              type: [string, "null"]

    B2bDashboard:
      type: object
      required: [open_orders, outstanding_balance, currency]
      properties:
        open_orders:
          type: integer
          minimum: 0
        outstanding_balance:
          type: number
          multipleOf: 0.001
        currency:
          type: string
          enum: [KWD]

    Invoice:
      type: object
      required: [id, invoice_number, status, currency, total]
      properties:
        id:
          type: integer
        invoice_number:
          type: string
        order_id:
          type: [integer, "null"]
        status:
          type: string
        currency:
          type: string
          enum: [KWD]
        total:
          type: number
          multipleOf: 0.001
        issued_at:
          type: [string, "null"]
          format: date-time
        due_at:
          type: [string, "null"]
          format: date-time

    B2bAccountStatement:
      type: object
      required: [currency, balance, entries]
      properties:
        currency:
          type: string
          enum: [KWD]
        balance:
          type: number
          multipleOf: 0.001
        entries:
          type: array
          items:
            type: object
            required: [date, type, amount]
            properties:
              date:
                type: string
                format: date
              type:
                type: string
              reference:
                type: [string, "null"]
              amount:
                type: number
                multipleOf: 0.001

    DriverAssignment:
      type: object
      required: [id, order_id, assignment_type, status]
      properties:
        id:
          type: integer
        order_id:
          type: integer
        assignment_type:
          type: string
          enum: [b2c, b2b]
        status:
          type: string
        assigned_at:
          type: [string, "null"]
          format: date-time
        completed_at:
          type: [string, "null"]
          format: date-time

    Notification:
      type: object
      required: [id, channel, type, title, body, created_at]
      properties:
        id:
          type: integer
        channel:
          type: string
        type:
          type: string
        title:
          type: string
        body:
          type: string
        data:
          type: [object, "null"]
          additionalProperties: true
        read_at:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time

    AppVersionPolicy:
      type: object
      required: [latest_version, minimum_supported_version, force_update, update_required, status]
      properties:
        latest_version:
          type: string
        minimum_supported_version:
          type: string
        force_update:
          type: boolean
        update_required:
          type: boolean
        status:
          type: string
          enum: [current, optional, forced, unsupported]
        store_url:
          type: [string, "null"]
          format: uri
        release_notes:
          type: [string, "null"]

    PaginationMeta:
      type: object
      required: [current_page, per_page, total]
      properties:
        current_page:
          type: integer
          minimum: 1
        per_page:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0

    StoreCollection:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Store"
        meta:
          $ref: "#/components/schemas/PaginationMeta"

    CategoryCollection:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Category"
        meta:
          $ref: "#/components/schemas/PaginationMeta"

    ProductCollection:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ProductSummary"
        meta:
          $ref: "#/components/schemas/PaginationMeta"

    OfferCollection:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Offer"
        meta:
          $ref: "#/components/schemas/PaginationMeta"

    OrderCollection:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Order"
        meta:
          $ref: "#/components/schemas/PaginationMeta"

    B2bProductCollection:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/B2bProduct"
        meta:
          $ref: "#/components/schemas/PaginationMeta"

    InvoiceCollection:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Invoice"
        meta:
          $ref: "#/components/schemas/PaginationMeta"

    DriverAssignmentCollection:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/DriverAssignment"
        meta:
          $ref: "#/components/schemas/PaginationMeta"

    NotificationCollection:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Notification"
        meta:
          $ref: "#/components/schemas/PaginationMeta"

    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
        code:
          type: [string, "null"]
        errors:
          type: [object, "null"]
          additionalProperties: true

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthenticated:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Authenticated but not authorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found or not visible in authorized scope
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Request conflicts with current resource state or idempotency key
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
