      summary: Get effective access for one user
      operationId: getSecurityUser
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: user
          required: true
          schema:
            type: integer
        - in: query
          name: store_id
          schema:
            type: integer
      responses:
        "200":
          description: User access detail
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/security/users/{user}/roles:
    put:
      tags: [Security]
      summary: Replace global and store-scoped role assignments
      operationId: replaceSecurityUserRoles
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: user
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SecurityUserRolesWrite"
      responses:
        "200":
          description: Role assignments updated
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"

  /admin/security/users/{user}/status:
    patch:
      tags: [Security]
      summary: Activate or deactivate a user account
      operationId: updateSecurityUserStatus
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: user
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SecurityUserStatusWrite"
      responses:
        "200":
          description: User status updated
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"

  /admin/deliveries/assign:
    post:
      tags: [Drivers]
      summary: Assign an order to a driver of the same channel
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Delivery assignment created
        "403":
          description: Missing channel management permission or store scope
        "409":
          description: Driver and order channels do not match

  /mobile/runtime:
    get:
      tags: [Mobile Runtime]
      summary: Get Customer or Driver runtime and store settings
      operationId: getMobileRuntime
      parameters:
        - in: query
          name: app
          required: true
          schema: { type: string, enum: [customer, driver] }
        - in: query
          name: environment
          required: true
          schema: { type: string, enum: [development, staging, production] }
        - in: query
          name: locale
          schema: { type: string, enum: [ar, en], default: ar }
      responses:
        "200":
          description: Public non-secret runtime configuration
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /push/devices/guest:
    post:
      tags: [Push Devices]
      summary: Register or refresh an anonymous Customer installation for push
      operationId: registerGuestPushDevice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuestPushDeviceRegistrationRequest"
      responses:
        "200": { description: Existing anonymous registration refreshed }
        "201": { description: Anonymous Customer installation registered }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /push/devices:
    post:
      tags: [Push Devices]
      summary: Register or refresh an authenticated user's push device
      operationId: registerPushDevice
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushDeviceRegistrationRequest"
      responses:
        "200": { description: Existing registration refreshed }
        "201": { description: Device registered }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /push/devices/{device}:
    delete:
      tags: [Push Devices]
      summary: Revoke an authenticated user's push device
      operationId: revokePushDevice
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: device
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200": { description: Device revoked }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  parameters:
    StoreId:
      in: path
      name: store
      required: true
      schema:
        type: integer
        minimum: 1
    ProductId:
      in: path
      name: product
      required: true
      schema:
        type: integer
        minimum: 1
    CartItemId:
      in: path
      name: item
      required: true
      schema:
        type: integer
        minimum: 1
    OrderId:
      in: path
      name: order
      required: true
      schema:
        type: integer
        minimum: 1
    AddressId:
      in: path
      name: address
      required: true
      schema:
        type: integer
        minimum: 1
    InvoiceId:
      in: path
      name: invoice
      required: true
      schema:
        type: integer
        minimum: 1
    NotificationId:
      in: path
      name: notification
      required: true
      schema:
        type: integer
        minimum: 1
    Locale:
      in: query
      name: locale
      description: Requested localized notification content. Falls back to the authenticated user's locale.
      schema:
        type: string
        enum: [ar, en]

    Page:
      in: query
      name: page
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      in: query
      name: per_page
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    GuestToken:
      in: header
      name: X-Guest-Token
      required: false
      description: Opaque cart identity for guest browsing. Ignored when the authenticated cart is authoritative.
      schema:
        type: string
        minLength: 16
        maxLength: 200
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      description: Client-generated key preventing duplicate order creation for a retried checkout.
      schema:
        type: string
        minLength: 16
        maxLength: 100

  schemas:
    ApiVersion:
      type: object
      required: [version]
      properties:
        version:
          type: string

    PushDeviceRegistrationRequest:
      type: object
      additionalProperties: false
      required: [app, platform, environment, token]
      properties:
        app:
          type: string
          enum: [customer, driver]
        platform:
          type: string
          enum: [android, ios]
        environment:
          type: string
          enum: [development, staging, production]
        token:
          type: string
          minLength: 1
          maxLength: 4096
          description: Push-provider device token.
        install_id:
          type: string
          minLength: 1
          maxLength: 120
          description: Stable per-installation identifier used to reconcile provider token refresh without revoking other devices.
        store_id:
          type:
            - integer
            - "null"
          minimum: 1
        target_channel:
          type: string
          enum: [all, b2b, b2c]
          default: all
        locale:
          type: string
          enum: [ar, en]

    GuestPushDeviceRegistrationRequest:
      allOf:
        - $ref: "#/components/schemas/PushDeviceRegistrationRequest"
        - type: object
          required: [install_id]
          properties:
            app:
              type: string
              enum: [customer]

    PlatformCustomerRegistrationRequest:
      type: object
      additionalProperties: false
      required: [name, email, phone, password, password_confirmation]
      properties:
        name:
          type: string
          maxLength: 255
        email:
          type: string
          format: email
          maxLength: 255
        phone:
          type: string
          maxLength: 40
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 255
        password_confirmation:
          type: string
          format: password
          minLength: 8
          maxLength: 255
        locale:
          type: string
          enum: [ar, en]
        store_id:
          type: [integer, "null"]
          minimum: 1
          description: Exact active storefront where registration originated. Retail creates that store's B2C profile immediately. Omit for the main Wholesale storefront.

    PlatformCustomerRegistrationResponse:
      type: object
      required: [token, token_type, platform_customer, user]
      properties:
        token:
          type: string
        token_type:
          type: string
          const: Bearer
        platform_customer:
          type: boolean
          const: true
        user:
          $ref: "#/components/schemas/UserIdentity"

    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    LoginResponse:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
        token_type:
          type: string
          const: Bearer
        user:
          $ref: "#/components/schemas/UserIdentity"

    UserIdentity:
      type: object
      required: [id, name, email, roles, store_ids, driver_scope, platform_customer, retail_merchant, b2b_customer_ids, owned_retail_store_ids, managed_retail_store_ids, retail_store_ids, retail_wholesale_accounts]
      properties:
        id:
          type: integer
        name:
          type: string
        username:
          type: [string, "null"]
        email:
          type: string
          format: email
        locale:
          type: string
          enum: [ar, en]
        roles:
          type: array
          uniqueItems: true
          items:
            type: string
        store_ids:
          type: array
          uniqueItems: true
          items:
            type: integer
        driver_scope:
          description: Persisted authoritative Driver runtime scope. Null for non-Driver identities; never inferred from assignment history.
          oneOf:
            - type: "null"
            - type: object
              additionalProperties: false
              required: [driver_id, channel, store_id]
              properties:
                driver_id:
                  type: integer
                  minimum: 1
                channel:
                  type: string
                  enum: [b2c, b2b]
                store_id:
                  type: [integer, "null"]
                  minimum: 1
        platform_customer:
          type: boolean
        retail_merchant:
          type: boolean
          description: True when the authenticated Dashboard account owns or manages at least one active Retail Store.
        b2b_customer_ids:
          type: array
          uniqueItems: true
          description: B2B customer identities directly owned by the account or authoritatively linked through its Retail Stores.
          items:
            type: integer
        owned_retail_store_ids:
          type: array
          uniqueItems: true
          description: Active Retail Stores explicitly owned by this account.
          items:
            type: integer
        managed_retail_store_ids:
          type: array
          uniqueItems: true
          description: Active Retail Stores this account manages through B2C_STORE_ADMIN.
          items:
            type: integer
        retail_store_ids:
          type: array
          uniqueItems: true
          description: Union of owned and managed Retail Stores. Every ID in this set is a forbidden B2C purchase target for the same account.
          items:
            type: integer
        retail_wholesale_accounts:
          type: array
          description: Authoritative Retail Store to Wholesale B2B customer identities available to this merchant account.
          items:
            type: object
            required: [retail_store_id, b2b_customer_id]
            properties:
              retail_store_id:
                type: integer
              b2b_customer_id:
                type: integer

    Store:
      type: object
      required: [id, code, name, store_type, is_active]
      properties:
        id:
          type: integer
        code:
          type: string
        name:
          type: string
        store_type:
          type: string
        is_active:
          type: boolean

    Category:
      type: object
      required: [id, name, slug, is_active]
      properties:
        id:
          type: integer
        parent_id:
          type: [integer, "null"]
        name:
          type: string
        slug:
          type: string
        is_active:
          type: boolean
        image_url:
          type: [string, "null"]
          format: uri-reference

    ProductSummary:
      type: object
      required: [id, sku, name, is_active]
      properties:
        id:
          type: integer
        sku:
          type: string
        name:
          type: string
        category_id:
          type: [integer, "null"]
        brand_id:
          type: [integer, "null"]
        is_active:
          type: boolean
        price:
          type: [number, "null"]
          multipleOf: 0.001
        currency:
          type: string
          enum: [EGP]
        image_url:
          type: [string, "null"]
          format: uri-reference

    Product:
      allOf:
        - $ref: "#/components/schemas/ProductSummary"
        - type: object
          properties:
            description:
              type: [string, "null"]
            images:
              type: array
              items:
                type: string
                format: uri-reference

    Offer:
      type: object
      required: [id, name, type, is_active]
      properties:
        id:
          type: integer
        name:
          type: string
        type:
          type: string
        value:
          type: [number, "null"]
          multipleOf: 0.001
        starts_at:
          type: [string, "null"]
          format: date-time
        ends_at:
          type: [string, "null"]
          format: date-time
        is_active:
          type: boolean

    Banner:
      type: object
      required: [id, title, sort_order]
      properties:
        id:
          type: integer
        title:
          type: string
        image_url:
          type: [string, "null"]
          format: uri-reference
        target_url:
          type: [string, "null"]
          format: uri-reference
        sort_order:
          type: integer

    CartItem:
      type: object
      required: [id, product, quantity]
      properties:
        id:
          type: integer
        product:
          $ref: "#/components/schemas/ProductSummary"
        quantity:
          type: number
          exclusiveMinimum: 0
          multipleOf: 0.001
        unit_price_snapshot:
          type: [number, "null"]
          multipleOf: 0.001
        line_total:
          type: [number, "null"]
          multipleOf: 0.001

    Cart:
      type: object
      required: [id, store_id, channel, items]
      properties:
        id:
          type: integer
        store_id:
          type: integer
        channel:
          type: string
          enum: [b2c, b2b]
        guest_token:
          type: [string, "null"]
        currency:
          type: string
          enum: [EGP]
        items:
          type: array
          items:
            $ref: "#/components/schemas/CartItem"
        subtotal:
          type: number
          multipleOf: 0.001

    AddCartItemRequest:
      type: object
      additionalProperties: false
      required: [store_id, product_id, quantity]
      properties:
        store_id:
          type: integer
          minimum: 1
        product_id:
          type: integer
          minimum: 1
        quantity:
          type: number
          exclusiveMinimum: 0
          multipleOf: 0.001

    UpdateCartItemRequest:
      type: object
      additionalProperties: false
      required: [quantity]
      properties:
        quantity:
          type: number
          exclusiveMinimum: 0
          multipleOf: 0.001

    QuoteRequest:
      type: object
      additionalProperties: false
      required: [store_id]
      properties:
        store_id:
          type: integer
          minimum: 1
        coupon_code:
          type: [string, "null"]
          maxLength: 80
        payment_method:
          type: [string, "null"]
          maxLength: 50

    QuoteLine:
      type: object
      required:
        [product_id, quantity, unit_price, line_total, is_available]
      properties:
        product_id:
          type: integer
        sku:
          type: [string, "null"]
        name:
          type: [string, "null"]
        quantity:
          type: number
          exclusiveMinimum: 0
          multipleOf: 0.001
        base_unit_price:
          type: [number, "null"]
          multipleOf: 0.001
        unit_price:
          type: [number, "null"]
          multipleOf: 0.001
        line_total:
          type: [number, "null"]
          multipleOf: 0.001
        is_available:
          type: boolean
        available_quantity:
          type: [number, "null"]
          minimum: 0
        availability_state:
          type: string
        commercial_status:
          type: string
          description: Server-authoritative OPEN / RESTRICTED / CLOSED policy state when the product is resolvable.
        commercial_reason_codes:
          type: array
          items:
            type: string
        commercial_limits:
          type: object
          additionalProperties:
            type: [number, "null"]
        selling_units:
          type: array
          items:
            type: object
            required: [code, name, conversion_factor, is_base]
            properties:
              code:
                type: string
              name:
                type: string
              conversion_factor:
                type: number
                exclusiveMinimum: 0
              price:
                type: [number, "null"]
              sku:
                type: [string, "null"]
              barcode:
                type: [string, "null"]
              is_base:
                type: boolean
        minimum_order_quantity:
          type: [number, "null"]
        ordering_increment:
          type: [number, "null"]
        pack_size:
          type: [number, "null"]
        case_size:
          type: [number, "null"]
        price_tier_id:
          type: [integer, "null"]
        price_tier_code:
          type: [string, "null"]

    CommerceQuote:
      type: object
      required:
        [quote_id, quoted_at, store_id, channel, currency, items, subtotal, discount_total, delivery_total, tax_total, grand_total, pricing_source]
      properties:
        quote_id:
          type: string
          format: uuid
        quoted_at:
          type: string
          format: date-time
        store_id:
          type: integer
        channel:
          type: string
          enum: [b2b, b2c]
        currency:
          type: string
          enum: [EGP]
        customer_context:
          type: object
          properties:
            customer_id:
              type: [integer, "null"]
            b2b_account_id:
              type: [integer, "null"]
            price_tier_id:
              type: [integer, "null"]
            price_tier_code:
              type: [string, "null"]
        items:
          type: array
          items:
            $ref: "#/components/schemas/QuoteLine"
        subtotal:
          type: number
          multipleOf: 0.001
        promotion_discount_total:
          type: number
          multipleOf: 0.001
        coupon_discount_total:
          type: number
          multipleOf: 0.001
        discount_total:
          type: number
          multipleOf: 0.001
        delivery_total:
          type: number
          multipleOf: 0.001
        tax_rate:
          type: number
          minimum: 0
        tax_total:
          type: number
          multipleOf: 0.001
        grand_total:
          type: number
          multipleOf: 0.001
        has_unavailable_items:
          type: boolean
        pricing_source:
          type: string
          enum: [backend_authoritative_quote_v1]

    QuoteResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/CommerceQuote"

    CheckoutRequest:
      type: object
      additionalProperties: false
      required: [store_id, address_id]
      properties:
        store_id:
          type: integer
          minimum: 1
        address_id:
          type: integer
          minimum: 1
        payment_method:
          type: [string, "null"]
        note:
          type: [string, "null"]
          maxLength: 1000

    OrderItem:
      type: object
      required: [id, product_id, sku, name, quantity, unit_price, line_total]
      properties:
        id:
          type: integer
        product_id:
          type: integer
        sku:
          type: string
        name:
          type: string
        quantity:
          type: number
          exclusiveMinimum: 0
          multipleOf: 0.001
        selling_unit_code:
          type: [string, "null"]
          description: Selling unit code captured when the order line was confirmed.
        selling_unit_name:
          type: [string, "null"]
          description: Selling unit display name captured when the order line was confirmed.
        selling_unit_quantity:
          type: [number, "null"]
          exclusiveMinimum: 0
          multipleOf: 0.001
        base_quantity:
          type: [number, "null"]
          exclusiveMinimum: 0
          multipleOf: 0.001
          description: Authoritative inventory/quota quantity in the product base unit.
        conversion_factor:
          type: [number, "null"]
          exclusiveMinimum: 0
          multipleOf: 0.001
          description: Immutable selling-unit to base-unit conversion captured at confirmation.
        unit_price:
          type: number
          multipleOf: 0.001
        line_total:
          type: number
          multipleOf: 0.001

    Order:
      type: object
      required:
        [id, order_number, store_id, store, channel, status, currency, subtotal, grand_total, items, created_at]
      properties:
        id:
          type: integer
        order_number:
          type: string
        store_id:
          type: integer
        store:
          type: [object, "null"]
          properties:
            id:
              type: integer
            code:
              type: string
            name:
              type: string
            logo_url:
              type: [string, "null"]
        channel:
          type: string
          enum: [b2c, b2b]
        status:
          type: string
        currency:
          type: string
          enum: [EGP]
        subtotal:
          type: number
          multipleOf: 0.001
        discount_total:
          type: number
          multipleOf: 0.001
        delivery_total:
          type: number
          multipleOf: 0.001
        tax_total:
          type: number
          multipleOf: 0.001
        quote_id:
          type: [string, "null"]
          format: uuid
        quoted_at:
          type: [string, "null"]
          format: date-time
        price_tier_id:
          type: [integer, "null"]
        price_tier_code:
          type: [string, "null"]
        grand_total:
          type: number
          multipleOf: 0.001
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        invoice:
          type: [object, "null"]
          properties:
            id:
              type: integer
            invoice_number:
              type: string
            status:
              type: string
        created_at:
          type: string
          format: date-time

    B2bProduct:
      allOf:
        - $ref: "#/components/schemas/ProductSummary"
        - type: object
          required: [account_price]
          properties:
            account_price:
              type: number
              multipleOf: 0.001
            minimum_order_quantity:
              type: number
              minimum: 0
              multipleOf: 0.001
            price_tier:
              type: [string, "null"]

    B2bProductDetail:
      allOf:
        - $ref: "#/components/schemas/B2bProduct"
        - type: object
          required:
            [store_id, minimum_order_quantity, price_tier, available_quantity, is_available, currency]
          properties:
            store_id:
              type: integer
            available_quantity:
              type: [number, "null"]
              minimum: 0
              multipleOf: 0.001
            is_available:
              type: boolean
            currency:
              type: string
              enum: [EGP]

    B2bTopProduct:
      type: object
      required:
        [rank, product_id, sku, name, quantity, total, currency, availability_state, can_repurchase]
      properties:
        rank:
          type: integer
          minimum: 1
        product_id:
          type: integer
        store_id:
          type: [integer, "null"]
          minimum: 1
        sku:
          type: string
        name:
          type: string
        quantity:
          type: number
          minimum: 0
          multipleOf: 0.001
        total:
          type: number
          minimum: 0
          multipleOf: 0.001
        currency:
          type: string
          description: Historical order-line spend currency.
        last_purchased_at:
          type: [string, "null"]
          format: date-time
        image_url:
          type: [string, "null"]
          format: uri
        account_price:
          type: [number, "null"]
          minimum: 0
          multipleOf: 0.001
          description: Current account-tier price; never derived from the historical order-line price.
        current_price_currency:
          type: [string, "null"]
        minimum_order_quantity:
          type: [number, "null"]
          minimum: 0
        ordering_increment:
          type: [number, "null"]
          minimum: 0
        pack_size:
          type: [number, "null"]
          minimum: 0
        case_size:
          type: [number, "null"]
          minimum: 0
        pack_label:
          type: [string, "null"]
        available_quantity:
          type: [number, "null"]
          minimum: 0
        availability_state:
          type: string
          enum: [AVAILABLE, OUT_OF_STOCK, UNAVAILABLE_FOR_ACCOUNT]
        can_repurchase:
          type: boolean
        unavailable_reason:
          type: [string, "null"]
          enum: [OUT_OF_STOCK, BELOW_MINIMUM_ORDER, UNAVAILABLE_FOR_ACCOUNT, null]

    B2bTopProductCollection:
