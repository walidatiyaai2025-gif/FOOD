openapi: 3.1.0
info:
  title: FOODEX API
  version: 0.2.0
  description: Implementation baseline for FOODEX v1 mobile and web clients.
  license:
    name: Proprietary
servers:
  - url: /api/v1
security: []
tags:
  - name: Authentication
    description: Login, logout, profile and authenticated identity boundaries.
  - name: Stores
    description: Public and authorized store discovery.
  - name: Catalog
    description: Store-scoped categories, products and offers.
  - name: Cart
    description: Guest or authenticated shopping cart operations.
  - name: Checkout
    description: Authenticated, idempotent order creation boundary.
  - name: Orders
    description: Authenticated customer order access.
  - name: Customer Profile
    description: Unified Platform Customer profile and delivery-address management.
  - name: B2B
    description: Wholesale customer operations. Platform Customer registration may provision consumer Wholesale eligibility; managed corporate/credit account approval remains administrative.
  - name: Drivers
    description: Driver-role-scoped assignment operations.
  - name: Notifications
    description: Authenticated notification access.
  - name: Localization
    description: Arabic and English runtime translation bundles.
  - name: Version
    description: Platform and mobile application version policy.
  - name: Mobile Runtime
    description: Customer and Driver runtime/store configuration without provider secrets.
  - name: Push Devices
    description: Authenticated mobile push-device registration and revocation.
  - name: Management Reporting
    description: Permission and scope-aware management reporting catalog.
  - name: App Preview
    description: Short-lived, read-only Customer/Driver preview sessions for the authorized Management Dashboard.

paths:
  /version:
    get:
      tags: [Version]
      summary: Get platform API version
      operationId: getPlatformVersion
      responses:
        "200":
          description: Platform/API version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiVersion"

  /app-preview/resolve:
    post:
      tags: [App Preview]
      summary: Resolve a short-lived read-only application preview token
      operationId: resolveAppPreviewSession
      parameters:
        - in: header
          name: X-Foodex-Preview-Token
          required: false
          description: Opaque preview token. It is not a Sanctum bearer token.
          schema:
            type: string
            minLength: 1
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppPreviewResolveRequest"
      responses:
        "200":
          description: Active read-only preview context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppPreviewContextResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /admin/app-preview/sessions:
    post:
      tags: [App Preview]
      summary: Create an audited short-lived authenticated app preview session
      operationId: createAppPreviewSession
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppPreviewSessionCreateRequest"
      responses:
        "201":
          description: Preview session created; the plaintext token is returned once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppPreviewSessionCreateResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"

  /admin/app-preview/sessions/{session}:
    delete:
      tags: [App Preview]
      summary: Revoke an app preview session
      operationId: revokeAppPreviewSession
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: session
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason:
                  type: string
                  maxLength: 255
      responses:
        "204":
          description: Preview session revoked
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /app-preview/events:
    get:
      tags: [App Preview]
      summary: Stream scoped storefront preview invalidation events
      operationId: streamAppPreviewInvalidationEvents
      parameters:
        - in: header
          name: X-Foodex-Preview-Token
          required: true
          schema:
            type: string
            minLength: 1
        - in: header
          name: Last-Event-ID
          required: false
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: Server-sent invalidation events for the exact preview session store/channel scope
          content:
            text/event-stream:
              schema:
                type: string
                description: SSE frames whose data field conforms to AppPreviewInvalidationEvent.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /app-preview/storefront-configuration:
    get:
      tags: [App Preview]
      summary: Resolve the current Draft or Published storefront configuration for a valid Customer preview session
      operationId: resolveCurrentStorefrontPreviewConfiguration
      parameters:
        - in: header
          name: X-Foodex-Preview-Token
          required: true
          schema:
            type: string
            minLength: 1
        - in: query
          name: mode
          required: true
          schema:
            type: string
            enum: [draft, published]
      responses:
        "200":
          description: Current read-only storefront configuration for the preview session scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorefrontRevisionPreviewResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /app-preview/storefront-revisions/{revision}/resolve:
    post:
      tags: [App Preview]
      summary: Resolve one exact Draft or Published Customer storefront revision through a valid preview session
      operationId: resolveStorefrontRevisionForPreview
      parameters:
        - in: path
          name: revision
          required: true
          schema:
            type: string
            format: uuid
        - in: header
          name: X-Foodex-Preview-Token
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Exact read-only storefront revision for the authorized preview scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorefrontRevisionPreviewResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /admin/app-preview/storefront-revisions:
    get:
      tags: [App Preview]
      summary: List scoped storefront revisions
      operationId: listStorefrontRevisions
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: channel
          required: true
          schema:
            type: string
            enum: [b2b, b2c]
        - in: query
          name: store_id
          required: false
          schema:
            type: integer
            minimum: 1
        - in: query
          name: status
          required: false
          schema:
            type: string
            enum: [draft, published, archived]
        - in: query
          name: support_access
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: Scoped storefront revision history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorefrontRevisionCollection"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/app-preview/storefront-revisions/draft:
    post:
      tags: [App Preview]
      summary: Create or reuse the scoped Draft storefront revision
      operationId: createStorefrontDraft
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StorefrontRevisionScopeRequest"
      responses:
        "201":
          description: Draft revision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorefrontRevisionResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"

  /admin/app-preview/storefront-revisions/{revision}:
    get:
      tags: [App Preview]
      summary: Get one scoped storefront revision
      operationId: getStorefrontRevision
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: revision
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Storefront revision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorefrontRevisionResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [App Preview]
      summary: Replace the payload of a Draft storefront revision
      operationId: updateStorefrontDraft
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: revision
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StorefrontRevisionUpdateRequest"
      responses:
        "200":
          description: Updated Draft revision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorefrontRevisionResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /admin/app-preview/storefront-revisions/{revision}/publish:
    post:
      tags: [App Preview]
      summary: Atomically publish one validated Draft and apply its storefront snapshot
      operationId: publishStorefrontRevision
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: revision
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Published storefront revision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorefrontRevisionResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /admin/app-preview/storefront-revisions/{revision}/rollback:
    post:
      tags: [App Preview]
      summary: Publish a new immutable revision from an older valid Published or Archived snapshot
      operationId: rollbackStorefrontRevision
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: revision
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: New Published rollback revision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorefrontRevisionResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /app-version:
    get:
      tags: [Version]
      summary: Get mobile application version policy
      operationId: getAppVersionPolicy
      parameters:
        - in: query
          name: platform
          required: true
          schema:
            type: string
            enum: [android, ios]
        - in: query
          name: app
          required: true
          schema:
            type: string
            enum: [customer, driver]
        - in: query
          name: current_version
          required: true
          schema:
            type: string
            maxLength: 64
      responses:
        "200":
          description: Mobile version policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppVersionPolicy"
        "400":
          $ref: "#/components/responses/BadRequest"

  /translations/{locale}:
    get:
      tags: [Localization]
      summary: Get the runtime translation bundle for a supported locale
      operationId: getTranslationBundle
      parameters:
        - in: path
          name: locale
          required: true
          schema:
            type: string
            enum: [ar, en]
      responses:
        "200":
          description: Translation key/value bundle with text direction
          content:
            application/json:
              schema:
                type: object
                required: [locale, direction, translations]
                properties:
                  locale:
                    type: string
                    enum: [ar, en]
                  direction:
                    type: string
                    enum: [rtl, ltr]
                  translations:
                    type: object
                    additionalProperties:
                      type: string
        "404":
          $ref: "#/components/responses/NotFound"

  /auth/register:
    post:
      tags: [Authentication]
      summary: Register one Platform Customer identity from the current Wholesale or Retail store
      operationId: registerPlatformCustomer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlatformCustomerRegistrationRequest"
      responses:
        "201":
          description: Platform Customer account created with automatic Wholesale purchasing eligibility
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformCustomerRegistrationResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/login:
    post:
      tags: [Authentication]
      summary: Authenticate a FOODEX user
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated session/token response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/logout:
    post:
      tags: [Authentication]
      summary: Log out the authenticated user
      operationId: logout
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Logged out
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /profile:
    get:
      tags: [Authentication]
      summary: Get the authenticated customer profile
      operationId: getProfile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Authenticated identity and customer profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserIdentity"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /stores:
    get:
      tags: [Stores]
      summary: List active stores visible to the current client
      operationId: listStores
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Store collection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreCollection"

  /stores/{store}/categories:
    get:
      tags: [Catalog]
      summary: List categories for a store
      operationId: listStoreCategories
      parameters:
        - $ref: "#/components/parameters/StoreId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Category collection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryCollection"
        "404":
          $ref: "#/components/responses/NotFound"

  /stores/{store}/products:
    get:
      tags: [Catalog]
      summary: List active products for a store
      operationId: listStoreProducts
      parameters:
        - $ref: "#/components/parameters/StoreId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
        - in: query
          name: category
          schema:
            type: integer
            minimum: 1
        - in: query
          name: q
          schema:
            type: string
            maxLength: 120
        - in: query
          name: min_price
          schema:
            type: number
            minimum: 0
        - in: query
          name: max_price
          schema:
            type: number
            minimum: 0
        - in: query
          name: sort
          schema:
            type: string
            enum: [name, price]
        - in: query
          name: direction
          schema:
            type: string
            enum: [asc, desc]
      responses:
        "200":
          description: Product collection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductCollection"
        "404":
          $ref: "#/components/responses/NotFound"

  /stores/{store}/offers:
    get:
      tags: [Catalog]
      summary: List active offers for a store
      operationId: listStoreOffers
      parameters:
        - $ref: "#/components/parameters/StoreId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Store offer collection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfferCollection"
        "404":
          $ref: "#/components/responses/NotFound"

  /stores/{store}/banners:
    get:
      tags: [Catalog]
      summary: List active storefront banners for a B2C store
      operationId: listStoreBanners
      parameters:
        - $ref: "#/components/parameters/StoreId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Store banner collection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BannerCollection"
        "404":
          $ref: "#/components/responses/NotFound"

  /products/{product}:
    get:
      tags: [Catalog]
      summary: Get product details
      operationId: showProduct
      parameters:
        - $ref: "#/components/parameters/ProductId"
        - in: query
          name: store
          required: true
          description: Store context used for active availability and B2C pricing.
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Product detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          $ref: "#/components/responses/NotFound"

  /cart:
    get:
      tags: [Cart]
      summary: Get or initialize the current guest cart
      operationId: showCart
      parameters:
        - $ref: "#/components/parameters/GuestToken"
        - in: query
          name: store
          required: false
          description: Required only when initializing a guest cart without X-Guest-Token.
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Current guest cart. The response also returns X-Guest-Token.
          headers:
            X-Guest-Token:
              description: Opaque guest cart identity for subsequent cart requests.
              schema:
                type: string
                minLength: 16
                maxLength: 200
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
        "422":
          $ref: "#/components/responses/ValidationError"

  /cart/items:
    post:
      tags: [Cart]
      summary: Add an item to the current cart
      operationId: addCartItem
      parameters:
        - $ref: "#/components/parameters/GuestToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddCartItemRequest"
      responses:
        "201":
          description: Cart item created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
        "422":
          $ref: "#/components/responses/ValidationError"

  /cart/items/{item}:
    patch:
      tags: [Cart]
      summary: Update a cart item
      operationId: updateCartItem
      parameters:
        - $ref: "#/components/parameters/CartItemId"
        - $ref: "#/components/parameters/GuestToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCartItemRequest"
      responses:
        "200":
          description: Cart item updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [Cart]
      summary: Remove a cart item
      operationId: deleteCartItem
      parameters:
        - $ref: "#/components/parameters/CartItemId"
        - $ref: "#/components/parameters/GuestToken"
      responses:
        "204":
          description: Cart item removed
        "404":
          $ref: "#/components/responses/NotFound"

  /quote:
    post:
      tags: [Checkout]
      summary: Reprice the authenticated store cart using backend-authoritative commercial rules
      operationId: quoteCart
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuoteRequest"
      responses:
        "200":
          description: Authoritative quote. Clients must treat all returned amounts as read-only.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /checkout:
    post:
      tags: [Checkout]
      summary: Create an order from the authenticated cart
      operationId: checkout
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutRequest"
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /invoices:
    get:
      tags: [Invoices]
      summary: List invoice documents owned by the authenticated Platform Customer
      description: Returns only invoices belonging to the authenticated customer's Wholesale or Retail domain identities. Optional store and channel filters never broaden ownership.
      operationId: listCustomerInvoices
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
        - in: query
          name: store_id
          schema:
            type: integer
            minimum: 1
        - in: query
          name: channel
          schema:
            type: string
            enum: [b2b, b2c]
        - in: query
          name: status
          schema:
            type: string
      responses:
        "200":
          description: Owned invoice document collection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerInvoiceDocumentCollection"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /invoices/{invoice}:
    get:
      tags: [Invoices]
      summary: Get an owned immutable invoice document
      operationId: showCustomerInvoice
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/InvoiceId"
        - in: query
          name: store_id
          schema:
            type: integer
            minimum: 1
        - in: query
          name: channel
          schema:
            type: string
            enum: [b2b, b2c]
      responses:
        "200":
          description: Owned invoice detail
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/CustomerInvoiceDocument"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

  /invoices/{invoice}/download:
    get:
      tags: [Invoices]
      summary: Download an owned invoice as a server-rendered PDF
      operationId: downloadCustomerInvoice
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/InvoiceId"
        - in: query
          name: locale
          schema:
            type: string
            enum: [ar, en]
      responses:
        "200":
          description: Arabic RTL or English LTR invoice PDF
          content:
