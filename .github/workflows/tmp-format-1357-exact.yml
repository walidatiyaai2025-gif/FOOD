name: Temporary exact format 1357

on:
  push:
    branches:
      - feat/1357-business-dashboard-smart-analytics-launcher
    paths:
      - "apps/customer_app/lib/features/b2b/b2b_journey_screen.dart"
      - "apps/customer_app/lib/features/b2b/business_dashboard_smart_analytics_launcher.dart"
      - "apps/customer_app/test/business_dashboard_smart_analytics_integration_test.dart"
      - "apps/customer_app/test/business_dashboard_smart_analytics_launcher_test.dart"
      - ".github/workflows/tmp-format-1357-exact.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/1357-business-dashboard-smart-analytics-launcher
          fetch-depth: 0

      - name: Set up Flutter 3.47.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          cache: true

      - name: Resolve dependencies exactly like Customer CI
        working-directory: apps/customer_app
        run: flutter pub get

      - name: Apply exact CI Dart formatting
        working-directory: apps/customer_app
        run: |
          dart format \
            lib/features/b2b/b2b_journey_screen.dart \
            lib/features/b2b/business_dashboard_smart_analytics_launcher.dart \
            test/business_dashboard_smart_analytics_integration_test.dart \
            test/business_dashboard_smart_analytics_launcher_test.dart

      - name: Commit exact formatted files and remove temporary workflow
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-format-1357-exact.yml
          git checkout -- apps/customer_app/analysis_options.yaml || true
          git add \
            apps/customer_app/lib/features/b2b/b2b_journey_screen.dart \
            apps/customer_app/lib/features/b2b/business_dashboard_smart_analytics_launcher.dart \
            apps/customer_app/test/business_dashboard_smart_analytics_integration_test.dart \
            apps/customer_app/test/business_dashboard_smart_analytics_launcher_test.dart
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(1357): match exact Customer CI formatter"
          git push origin HEAD:feat/1357-business-dashboard-smart-analytics-launcher
