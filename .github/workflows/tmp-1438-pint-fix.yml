name: Temporary Pint fix for 1438

on:
  push:
    branches:
      - feat/1438-whatsapp-campaign-builder-reports

permissions:
  contents: write

jobs:
  pint-fix:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: feat/1438-whatsapp-campaign-builder-reports
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Apply Pint
        run: ./vendor/bin/pint app routes tests

      - name: Commit formatting fixes
        working-directory: .
        shell: bash
        run: |
          git config user.name "foodex-ci"
          git config user.email "actions@users.noreply.github.com"
          git add backend/app backend/routes backend/tests
          if git diff --cached --quiet; then
            echo "No Pint changes required."
          else
            git commit -m "style: format #1438 with Pint"
            git push origin HEAD:feat/1438-whatsapp-campaign-builder-reports
          fi
