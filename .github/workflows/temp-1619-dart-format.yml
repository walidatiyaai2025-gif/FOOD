name: TEMP 1619 Dart Format

on:
  push:
    branches:
      - fix/1619-driver-collection-dialog-validation

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[dartfmt-1619]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/1619-driver-collection-dialog-validation
      - name: Set up Flutter 3.47.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
      - name: Apply canonical Dart formatting
        shell: bash
        run: |
          set -euo pipefail
          dart format \
            apps/driver_app/lib/features/delivery/active/driver_active_journey.dart \
            apps/driver_app/test/driver_active_journey_test.dart
          if git diff --quiet --exit-code; then
            exit 0
          fi
          git config user.name "foodex-ci"
          git config user.email "actions@users.noreply.github.com"
          git add \
            apps/driver_app/lib/features/delivery/active/driver_active_journey.dart \
            apps/driver_app/test/driver_active_journey_test.dart
          git commit -m "style(1619): apply canonical Dart formatting [dartfmt-1619]"
          git push origin HEAD:fix/1619-driver-collection-dialog-validation
