name: FOODEX Required CI Gate

on:
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      customer: ${{ steps.filter.outputs.customer }}
      driver: ${{ steps.filter.outputs.driver }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: filter
        name: Detect validation areas
        shell: bash
        run: |
          set -euo pipefail

          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"

          git diff --name-only "$base" "$head" > changed-files.txt
          cat changed-files.txt

          backend=false
          customer=false
          driver=false

          if grep -Eq '^(backend/|docs/api/openapi\.yaml$)' changed-files.txt; then
            backend=true
          fi

          if grep -Eq '^apps/customer_app/' changed-files.txt; then
            customer=true
          fi

          if grep -Eq '^apps/driver_app/' changed-files.txt; then
            driver=true
          fi

          {
            echo "backend=$backend"
            echo "customer=$customer"
            echo "driver=$driver"
          } >> "$GITHUB_OUTPUT"

  repository-policy:
    name: Repository Policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate repository foundation
        run: ./scripts/validate-repo.sh

      - name: Require issue-style PR branch
        shell: bash
        run: |
          set -euo pipefail
          branch="${{ github.head_ref }}"
          [[ "$branch" =~ ^(feat|fix|chore|docs|refactor)/[0-9]+-[a-z0-9-]+$ ]]

  backend-validation:
    name: Backend validation
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    uses: ./.github/workflows/backend-ci.yml

  customer-validation:
    name: Customer Flutter validation
    needs: changes
    if: ${{ needs.changes.outputs.customer == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/customer_app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Android/iOS scaffolding
        run: flutter create --platforms=android,ios --project-name foodex_customer_app .

      - name: Remove generated default widget test
        run: rm -f test/widget_test.dart

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Android debug build
        run: flutter build apk --debug

  customer-ios-validation:
    name: Customer iOS no-codesign validation
    needs: changes
    if: ${{ needs.changes.outputs.customer == 'true' }}
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/customer_app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare iOS scaffolding
        run: flutter create --platforms=ios --project-name foodex_customer_app .

      - name: Resolve dependencies
        run: flutter pub get

      - name: iOS debug build without codesign
        run: flutter build ios --debug --no-codesign

  driver-validation:
    name: Driver Flutter validation
    needs: changes
    if: ${{ needs.changes.outputs.driver == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/driver_app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Android/iOS scaffolding
        run: flutter create --platforms=android,ios --project-name foodex_driver_app .

      - name: Remove generated default widget test
        run: rm -f test/widget_test.dart

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Android debug build
        run: flutter build apk --debug

  driver-ios-validation:
    name: Driver iOS no-codesign validation
    needs: changes
    if: ${{ needs.changes.outputs.driver == 'true' }}
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/driver_app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare iOS scaffolding
        run: flutter create --platforms=ios --project-name foodex_driver_app .

      - name: Resolve dependencies
        run: flutter pub get

      - name: iOS debug build without codesign
        run: flutter build ios --debug --no-codesign

  required-ci-gate:
    name: required-ci-gate
    if: ${{ always() }}
    needs:
      - changes
      - repository-policy
      - backend-validation
      - customer-validation
      - customer-ios-validation
      - driver-validation
      - driver-ios-validation
    runs-on: ubuntu-latest
    steps:
      - name: Enforce applicable validation results
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          POLICY_RESULT: ${{ needs.repository-policy.result }}
          BACKEND_CHANGED: ${{ needs.changes.outputs.backend }}
          BACKEND_RESULT: ${{ needs.backend-validation.result }}
          CUSTOMER_CHANGED: ${{ needs.changes.outputs.customer }}
          CUSTOMER_RESULT: ${{ needs.customer-validation.result }}
          CUSTOMER_IOS_RESULT: ${{ needs.customer-ios-validation.result }}
          DRIVER_CHANGED: ${{ needs.changes.outputs.driver }}
          DRIVER_RESULT: ${{ needs.driver-validation.result }}
          DRIVER_IOS_RESULT: ${{ needs.driver-ios-validation.result }}
        run: |
          set -euo pipefail

          require_success() {
            local name="$1"
            local result="$2"
            if [[ "$result" != "success" ]]; then
              echo "::error::$name did not succeed (result: $result)"
              exit 1
            fi
          }

          require_applicable_success() {
            local changed="$1"
            local name="$2"
            local result="$3"

            if [[ "$changed" == "true" ]]; then
              require_success "$name" "$result"
            elif [[ "$result" != "skipped" && "$result" != "success" ]]; then
              echo "::error::$name had unexpected result for unchanged area: $result"
              exit 1
            fi
          }

          require_success "Change detection" "$CHANGES_RESULT"
          require_success "Repository Policy" "$POLICY_RESULT"

          require_applicable_success "$BACKEND_CHANGED" "Backend validation" "$BACKEND_RESULT"
          require_applicable_success "$CUSTOMER_CHANGED" "Customer Flutter validation" "$CUSTOMER_RESULT"
          require_applicable_success "$CUSTOMER_CHANGED" "Customer iOS validation" "$CUSTOMER_IOS_RESULT"
          require_applicable_success "$DRIVER_CHANGED" "Driver Flutter validation" "$DRIVER_RESULT"
          require_applicable_success "$DRIVER_CHANGED" "Driver iOS validation" "$DRIVER_IOS_RESULT"

          echo "All required validations for changed areas passed."
