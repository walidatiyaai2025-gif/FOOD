name: FOODEX Required CI Gate

on:
  pull_request:

concurrency:
  group: required-ci-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      customer: ${{ steps.filter.outputs.customer }}
      driver: ${{ steps.filter.outputs.driver }}
      van: ${{ steps.filter.outputs.van }}
      app_preview_visual: ${{ steps.filter.outputs.app_preview_visual }}
      preview_runtime_distribution: ${{ steps.filter.outputs.preview_runtime_distribution }}
      mobile_prod_ux_acceptance: ${{ steps.filter.outputs.mobile_prod_ux_acceptance }}
      operational_completion_e2e: ${{ steps.filter.outputs.operational_completion_e2e }}
      c13_integrated_e2e: ${{ steps.filter.outputs.c13_integrated_e2e }}
      dashboard_ui: ${{ steps.filter.outputs.dashboard_ui }}
      mobile_ui: ${{ steps.filter.outputs.mobile_ui }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: filter
        name: Resolve validation plan from authoritative CI map
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 scripts/ci-plan.py \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}" \
            --branch "${GITHUB_HEAD_REF:-}" \
            --github-output "$GITHUB_OUTPUT" \
            --report artifacts/ci-plan.json \
            --print-files

  repository-policy:
    name: Repository Policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate repository foundation
        run: ./scripts/validate-repo.sh

      - name: Prevent post-merge main release failures
        shell: bash
        run: bash scripts/validate-premerge-release-version.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"

      - name: Validate mobile artifact packaging
        run: python3 -m unittest discover -s scripts/tests -p 'test_mobile_artifact.py'

      - name: Validate mobile runtime endpoint binary verifier
        run: python3 -m unittest discover -s scripts/tests -p 'test_mobile_runtime_endpoint.py'

      - name: Validate synchronized release artifact contract
        run: python3 -m unittest discover -s scripts/tests -p 'test_release_artifact_contract.py'

      - name: Test mobile UX v4.2 guard
        run: python3 -m unittest discover -s scripts/tests -p 'test_mobile_ux_contract_guard.py'

      - name: Enforce mobile UX v4.2 anti-regression guard
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          # #1058 integrates the immutable 1.0.60 application snapshot into main.
          # Audit only reconciliation changes so this merge cannot silently mutate
          # the accepted application/design source while still enforcing the guard
          # on every post-freeze change made by this integration branch.
          if [[ "${{ github.head_ref }}" == "release/1058-final-main-integration" ]]; then
            base="53857b1daa13c99682081760c89d144f1f701588"
          fi
          python3 scripts/mobile-ux-contract-guard.py --base "$base" --head "$head"

      - name: Test UIUX v4.2 recovery independent audit
        run: python3 -m unittest discover -s scripts/tests -p 'test_uiux_v42_recovery_audit.py'

      - name: Test FOODEX UIUX policy gate
        run: python3 -m unittest discover -s scripts/tests -p 'test_foodex_uiux_audit.py'

      - name: Test FOODEX UI contract planner
        run: python3 -m unittest discover -s scripts/tests -p 'test_foodex_ui_contract_plan.py'

      - name: Test FOODEX UI business intent planner
        run: python3 -m unittest discover -s scripts/tests -p 'test_foodex_ui_intent_plan.py'

      - name: Validate FOODEX business UI casebook
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 scripts/foodex-ui-intent-plan.py \
            --validate-only \
            --output artifacts/foodex-ui-business-casebook-audit.json

      - name: Upload FOODEX business UI casebook audit
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: foodex-ui-business-casebook-${{ github.event.pull_request.head.sha }}
          path: artifacts/foodex-ui-business-casebook-audit.json
          if-no-files-found: warn
          retention-days: 30


      - name: Test FOODEX UI structural parity
        run: python3 -m unittest discover -s scripts/tests -p 'test_foodex_ui_structure_audit.py'

      - name: Test FOODEX UI PR evidence plan
        run: python3 -m unittest discover -s scripts/tests -p 'test_foodex_ui_pr_plan.py'

      - name: Enforce FOODEX UI structural parity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 scripts/foodex-ui-structure-audit.py \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}" \
            --report artifacts/foodex-ui-structure-audit.json

      - name: Generate strict FOODEX UI PR evidence plan
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 scripts/foodex-ui-pr-plan.py \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}" \
            --strict \
            --output artifacts/foodex-ui-pr-evidence-plan.json

      - name: Upload FOODEX UI structural and evidence plan
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: foodex-ui-phase3-${{ github.event.pull_request.head.sha }}
          path: |
            artifacts/foodex-ui-structure-audit.json
            artifacts/foodex-ui-pr-evidence-plan.json
          if-no-files-found: warn
          retention-days: 30



      - name: Enforce FOODEX changed-surface UIUX policy
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 scripts/foodex-uiux-audit.py \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}" \
            --report artifacts/foodex-uiux-audit.json

      - name: Upload FOODEX UIUX policy report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: foodex-uiux-audit-${{ github.event.pull_request.head.sha }}
          path: artifacts/foodex-uiux-audit.json
          if-no-files-found: warn
          retention-days: 30

      - name: Run UIUX v4.2 recovery independent whole-tree audit
        if: ${{ github.head_ref == 'test/1041-uiux-requirement-coverage-audit' }}
        run: |
          mkdir -p artifacts
          python3 scripts/uiux-v42-recovery-audit.py --report artifacts/uiux-v42-recovery-static-audit.json

      - name: Upload UIUX v4.2 static audit report
        if: ${{ always() && github.head_ref == 'test/1041-uiux-requirement-coverage-audit' }}
        uses: actions/upload-artifact@v4
        with:
          name: uiux-v42-recovery-static-audit-${{ github.event.pull_request.head.sha }}
          path: artifacts/uiux-v42-recovery-static-audit.json
          if-no-files-found: warn
          retention-days: 30

      - name: Require issue-style PR branch
        shell: bash
        run: |
          set -euo pipefail
          branch="${{ github.head_ref }}"
          [[ "$branch" == "feat/assistant-v1-integration" || "$branch" == "chore/geography-reset-one-shot" || "$branch" =~ ^((feat|fix|chore|docs|refactor|test|ci)/[0-9]+-[a-z0-9-]+|release/([0-9]+|[0-9]+\.[0-9]+\.[0-9]+)-[a-z0-9-]+)$ ]]

  backend-validation:
    name: Backend validation
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    uses: ./.github/workflows/backend-ci.yml

  customer-validation:
    name: Customer validation
    needs: changes
    if: ${{ needs.changes.outputs.customer == 'true' }}
    uses: ./.github/workflows/customer-app-ci.yml

  driver-validation:
    name: Driver validation
    needs: changes
    if: ${{ needs.changes.outputs.driver == 'true' }}
    uses: ./.github/workflows/driver-app-ci.yml

  van-validation:
    name: Van validation
    needs: changes
    if: ${{ needs.changes.outputs.van == 'true' }}
    uses: ./.github/workflows/van-app-ci.yml

  dashboard-visual-evidence:
    name: Required Dashboard visual evidence
    needs: changes
    if: ${{ needs.changes.outputs.dashboard_ui == 'true' }}
    uses: ./.github/workflows/ui-visual-qa.yml

  mobile-visual-evidence:
    name: Required Mobile visual evidence
    needs: changes
    if: ${{ needs.changes.outputs.mobile_ui == 'true' }}
    uses: ./.github/workflows/mobile-screenshot-capture.yml

  localization-quality:
    name: Localization quality
    uses: ./.github/workflows/localization-quality-gate.yml
    with:
      base_sha: ${{ github.event.pull_request.base.sha }}
      head_sha: ${{ github.event.pull_request.head.sha }}

  app-preview-visual-parity:
    name: APP-PREVIEW visual runtime parity
    needs: changes
    if: ${{ needs.changes.outputs.app_preview_visual == 'true' }}
    uses: ./.github/workflows/app-preview-visual-parity.yml

  preview-runtime-distribution:
    name: Preview runtime distribution
    needs: changes
    if: ${{ needs.changes.outputs.preview_runtime_distribution == 'true' }}
    uses: ./.github/workflows/preview-runtime-distribution.yml

  screenshot-evidence:
    name: Runtime screenshot evidence
    needs: changes
    if: ${{ needs.changes.outputs.mobile_prod_ux_acceptance == 'true' || github.head_ref == 'test/175-runtime-screenshot-evidence' || github.head_ref == 'ci/184-screenshot-evidence-guards' }}
    permissions:
      contents: write
    uses: ./.github/workflows/screenshot-evidence.yml

  operational-completion-e2e:
    name: Operational completion integrated gate
    needs: changes
    if: ${{ needs.changes.outputs.operational_completion_e2e == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate B2B/B2C/store isolation contracts
        run: bash ./scripts/commerce-isolation-acceptance.sh
      - name: Validate synchronized release readiness
        run: bash ./scripts/release-readiness.sh

  c13-integrated-e2e:
    name: C13 integrated Customer journey gate
    needs: changes
    if: ${{ needs.changes.outputs.c13_integrated_e2e == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate 13-screen Customer journey contracts
        run: bash ./scripts/c13-integrated-acceptance.sh

      - name: Record integrated C13 evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          version="$(tr -d '\r\n' < VERSION)"
          {
            echo "C13 Integrated Customer Journey"
            echo "parent_issue=858"
            echo "gate_issue=873"
            echo "integrated_main_sha=${{ github.event.pull_request.base.sha }}"
            echo "candidate_head_sha=${{ github.event.pull_request.head.sha }}"
            echo "version=$version"
            echo "canonical_screen_count=13"
            echo "checkout_subsurface=present"
            echo "finance_contract=B2bAccountLedgerContractTest"
            echo "server_credit_cap_contract=AuthoritativePricingQuoteTest"
            echo "isolation_contract=scripts/commerce-isolation-acceptance.sh"
            echo "gate=PASS"
          } > artifacts/c13-integrated-e2e.txt

      - name: Upload C13 integrated evidence
        uses: actions/upload-artifact@v4
        with:
          name: c13-integrated-e2e-${{ github.event.pull_request.head.sha }}
          path: artifacts/c13-integrated-e2e.txt
          if-no-files-found: error
          retention-days: 30

  required-ci-gate:
    name: required-ci-gate
    if: ${{ always() }}
    needs:
      - changes
      - repository-policy
      - backend-validation
      - customer-validation
      - driver-validation
      - van-validation
      - localization-quality
      - dashboard-visual-evidence
      - mobile-visual-evidence
      - app-preview-visual-parity
      - preview-runtime-distribution
      - screenshot-evidence
      - operational-completion-e2e
      - c13-integrated-e2e
    runs-on: ubuntu-latest
    steps:
      - name: Enforce applicable validation results
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          POLICY_RESULT: ${{ needs.repository-policy.result }}
          BACKEND_CHANGED: ${{ needs.changes.outputs.backend }}
          BACKEND_RESULT: ${{ needs.backend-validation.result }}
          CUSTOMER_CHANGED: ${{ needs.changes.outputs.customer }}
          CUSTOMER_RESULT: ${{ needs.customer-validation.result }}
          DRIVER_CHANGED: ${{ needs.changes.outputs.driver }}
          DRIVER_RESULT: ${{ needs.driver-validation.result }}
          VAN_CHANGED: ${{ needs.changes.outputs.van }}
          VAN_RESULT: ${{ needs.van-validation.result }}
          LOCALIZATION_RESULT: ${{ needs.localization-quality.result }}
          DASHBOARD_UI_CHANGED: ${{ needs.changes.outputs.dashboard_ui }}
          DASHBOARD_VISUAL_RESULT: ${{ needs.dashboard-visual-evidence.result }}
          MOBILE_UI_CHANGED: ${{ needs.changes.outputs.mobile_ui }}
          MOBILE_VISUAL_RESULT: ${{ needs.mobile-visual-evidence.result }}
          APP_PREVIEW_VISUAL_CHANGED: ${{ needs.changes.outputs.app_preview_visual }}
          APP_PREVIEW_VISUAL_RESULT: ${{ needs.app-preview-visual-parity.result }}
          PREVIEW_RUNTIME_DISTRIBUTION_CHANGED: ${{ needs.changes.outputs.preview_runtime_distribution }}
          PREVIEW_RUNTIME_DISTRIBUTION_RESULT: ${{ needs.preview-runtime-distribution.result }}
          SCREENSHOT_RESULT: ${{ needs.screenshot-evidence.result }}
          MOBILE_PROD_UX_ACCEPTANCE: ${{ needs.changes.outputs.mobile_prod_ux_acceptance }}
          OPERATIONAL_COMPLETION_E2E: ${{ needs.changes.outputs.operational_completion_e2e }}
          OPERATIONAL_COMPLETION_E2E_RESULT: ${{ needs.operational-completion-e2e.result }}
          C13_INTEGRATED_E2E: ${{ needs.changes.outputs.c13_integrated_e2e }}
          C13_INTEGRATED_E2E_RESULT: ${{ needs.c13-integrated-e2e.result }}
        run: |
          set -euo pipefail

          require_success() {
            local name="$1"
            local result="$2"
            if [[ "$result" != "success" ]]; then
              echo "::error::$name did not succeed (result: $result)"
              exit 1
            fi
          }

          require_applicable_success() {
            local changed="$1"
            local name="$2"
            local result="$3"

            if [[ "$changed" == "true" ]]; then
              require_success "$name" "$result"
            elif [[ "$result" != "skipped" && "$result" != "success" ]]; then
              echo "::error::$name had unexpected result for unchanged area: $result"
              exit 1
            fi
          }

          require_success "Change detection" "$CHANGES_RESULT"
          require_success "Repository Policy" "$POLICY_RESULT"

          require_applicable_success "$BACKEND_CHANGED" "Backend validation" "$BACKEND_RESULT"
          require_applicable_success "$CUSTOMER_CHANGED" "Customer validation" "$CUSTOMER_RESULT"
          require_applicable_success "$DRIVER_CHANGED" "Driver validation" "$DRIVER_RESULT"
          require_applicable_success "$VAN_CHANGED" "Van validation" "$VAN_RESULT"
          require_success "Localization quality" "$LOCALIZATION_RESULT"
          require_applicable_success "$DASHBOARD_UI_CHANGED" "Dashboard visual evidence" "$DASHBOARD_VISUAL_RESULT"
          require_applicable_success "$MOBILE_UI_CHANGED" "Mobile visual evidence" "$MOBILE_VISUAL_RESULT"
          require_applicable_success "$APP_PREVIEW_VISUAL_CHANGED" "APP-PREVIEW visual runtime parity" "$APP_PREVIEW_VISUAL_RESULT"
          require_applicable_success "$PREVIEW_RUNTIME_DISTRIBUTION_CHANGED" "Preview runtime distribution" "$PREVIEW_RUNTIME_DISTRIBUTION_RESULT"
          require_applicable_success "$OPERATIONAL_COMPLETION_E2E" "Operational completion integrated gate" "$OPERATIONAL_COMPLETION_E2E_RESULT"
          require_applicable_success "$C13_INTEGRATED_E2E" "C13 integrated Customer journey gate" "$C13_INTEGRATED_E2E_RESULT"

          if [[ "$MOBILE_PROD_UX_ACCEPTANCE" == "true" || "${{ github.head_ref }}" == "test/175-runtime-screenshot-evidence" || "${{ github.head_ref }}" == "ci/184-screenshot-evidence-guards" ]]; then
            require_success "Runtime screenshot evidence" "$SCREENSHOT_RESULT"
          elif [[ "$SCREENSHOT_RESULT" != "skipped" && "$SCREENSHOT_RESULT" != "success" ]]; then
            echo "::error::Runtime screenshot evidence had unexpected result: $SCREENSHOT_RESULT"
            exit 1
          fi

          echo "All required validations for changed areas passed."
