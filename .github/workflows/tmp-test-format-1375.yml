name: Temporary exact Customer test formatter 1375

on:
  push:
    branches:
      - fix/1375-customer-hotfix-apk
    paths:
      - .github/workflows/tmp-test-format-1375.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/customer_app
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          cache: true
      - run: flutter pub get
      - name: Format changed Customer sources and tests
        run: |
          dart format             lib/core/api/customer_action_api.dart             lib/core/network/customer_data_mode.dart             lib/core/network/customer_low_data_http_client.dart             lib/core/routing/customer_router.dart             lib/features/auth/unified_customer_auth_screen.dart             lib/features/storefront/wholesale_multistore_screens.dart             test/customer_low_data_http_client_test.dart             test/customer_navigation_test.dart             test/b2b_journey_test.dart
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet -- lib test; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib test
          git commit -m "style(customer): format hotfix regressions (#1375)"
          git push origin "HEAD:${GITHUB_REF_NAME}"
