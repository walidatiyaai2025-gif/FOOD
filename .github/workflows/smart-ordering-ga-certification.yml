name: Smart Ordering GA Certification

on:
  # Quiet mode (#1637): certify the final convergence candidate on demand.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    name: Smart Ordering GA certification
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_sqlite, pdo_mysql
          coverage: none
          tools: composer:v2

      - name: Cache Composer downloads
        uses: actions/cache@v5
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Install backend dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run Smart Ordering GA acceptance
        run: bash scripts/smart-ordering-ga-acceptance.sh
