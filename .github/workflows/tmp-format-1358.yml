name: Temporary Format 1358

on:
  push:
    branches:
      - feat/1358-mobile-store-analytics-screen

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Canonically format changed Dart files
        run: |
          dart format \
            apps/customer_app/lib/features/store_analytics/store_analytics_screen.dart \
            apps/customer_app/test/screenshot_evidence_test.dart \
            apps/customer_app/test/store_analytics_screen_test.dart
      - name: Emit formatted payloads
        run: |
          echo BEGIN_STORE_ANALYTICS_SCREEN
          base64 -w0 apps/customer_app/lib/features/store_analytics/store_analytics_screen.dart
          echo
          echo END_STORE_ANALYTICS_SCREEN
          echo BEGIN_SCREENSHOT_EVIDENCE
          base64 -w0 apps/customer_app/test/screenshot_evidence_test.dart
          echo
          echo END_SCREENSHOT_EVIDENCE
          echo BEGIN_STORE_ANALYTICS_TEST
          base64 -w0 apps/customer_app/test/store_analytics_screen_test.dart
          echo
          echo END_STORE_ANALYTICS_TEST
      - name: Focused W4 compile and widget tests
        working-directory: apps/customer_app
        run: |
          flutter pub get
          flutter test test/store_analytics_screen_test.dart
