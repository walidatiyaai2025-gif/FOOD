name: PH-06 Final Runtime Evidence Refresh

on:
  pull_request:
    paths:
      - ".github/workflows/ph06-final-evidence.yml"

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout PH-06 branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, intl, pdo_sqlite
          coverage: none

      - name: Install backend dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare deterministic runtime database
        working-directory: backend
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
          CACHE_STORE: array
          QUEUE_CONNECTION: sync
          SESSION_DRIVER: file
        run: |
          cp .env.example .env
          php artisan key:generate
          rm -f database/database.sqlite
          touch database/database.sqlite
          php artisan migrate:fresh --force
          php artisan db:seed --class=Database\\Seeders\\ScreenshotEvidenceSeeder --force

      - name: Set up Node and Chromium
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start FOODEX runtime
        working-directory: backend
        env:
          APP_ENV: local
          APP_URL: http://127.0.0.1:8000
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
          CACHE_STORE: array
          QUEUE_CONNECTION: sync
          SESSION_DRIVER: file
        run: |
          php artisan serve --host=127.0.0.1 --port=8000 > /tmp/foodex-ph06-server.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/foodex-ph06-server.log
          exit 1

      - name: Regenerate real Web runtime evidence
        working-directory: backend
        env:
          FOODEX_SCREENSHOT_BASE_URL: http://127.0.0.1:8000
        run: |
          node ../scripts/capture_web_screenshots.mjs
          rm -rf ../ScreenShots/02_Web/Responsive

      - name: Install Arabic evidence font
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          cache: true

      - name: Regenerate Customer mobile runtime evidence
        working-directory: apps/customer_app
        run: |
          flutter pub get
          flutter test test/screenshot_evidence_test.dart

      - name: Regenerate Driver mobile runtime evidence
        working-directory: apps/driver_app
        run: |
          flutter pub get
          flutter test test/screenshot_evidence_test.dart

      - name: Rebuild and validate canonical manifest
        env:
          GITHUB_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python -m pip install --disable-pip-version-check pillow
          python scripts/update_screenshot_manifest.py --self-test
          python scripts/update_screenshot_manifest.py
          test "$(find ScreenShots -type f -name '*.png' | wc -l | tr -d ' ')" -eq 110
          grep -Fq 'Evidence metadata/geometry/PNG failures: **0**' ScreenShots/AUDIT.md
          grep -Fq 'Unapproved duplicate SHA groups: **0**' ScreenShots/AUDIT.md
          grep -Fq 'Canonical palette verification failures: **0**' ScreenShots/AUDIT.md

      - name: Commit final PH-06 runtime evidence
        run: |
          set -euo pipefail
          git config user.name "foodex-ui-evidence-bot"
          git config user.email "foodex-ui-evidence-bot@users.noreply.github.com"
          git add ScreenShots
          if git diff --cached --quiet; then
            echo "Runtime evidence already current."
            exit 0
          fi
          git commit -m "test(ui): regenerate final PH-06 runtime evidence"
          git push origin "HEAD:${{ github.head_ref }}"
