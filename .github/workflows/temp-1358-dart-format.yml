name: Temp 1358 Dart Format

on:
  push:
    branches:
      - feat/1358-mobile-store-analytics-screen

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: feat/1358-mobile-store-analytics-screen
      - name: Set up Flutter 3.47.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Canonically format Store Analytics screen
        run: dart format apps/customer_app/lib/features/store_analytics/store_analytics_screen.dart
      - name: Commit canonical format
        shell: bash
        run: |
          target="apps/customer_app/lib/features/store_analytics/store_analytics_screen.dart"
          if git diff --quiet -- "$target"; then
            echo "Already canonically formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$target"
          git commit -m "style(customer): apply canonical Dart format"
          git push origin HEAD:feat/1358-mobile-store-analytics-screen
