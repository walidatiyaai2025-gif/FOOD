name: Bootstrap Metadata
on:
  push:
    branches: ["chore/1-bootstrap-foundation"]
    paths: [".github/workflows/bootstrap-metadata.yml"]
permissions:
  contents: read
  issues: write
jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const labels = [
              "backend","admin-web","customer-app","driver-app","devops","docs",
              "auth","stores","catalog","inventory","pricing","orders","customers","b2b","b2c","drivers","delivery","promotions","reports","installer","updater",
              "feature","bug","chore","refactor","security","P0","P1","P2","P3",
              "status:backlog","status:ready","status:in-progress","status:code-review","status:qa","status:blocked","status:done"
            ];
            const existing = await github.paginate(github.rest.issues.listLabelsForRepo,{owner:context.repo.owner,repo:context.repo.repo,per_page:100});
            const names = new Set(existing.map(x=>x.name));
            for (const name of labels) if (!names.has(name)) await github.rest.issues.createLabel({owner:context.repo.owner,repo:context.repo.repo,name,color:"0E8A16"});
            const milestones = ["M0 — Foundation","M1 — Identity & Stores","M2 — Catalog & Inventory","M3 — B2C Commerce","M4 — B2B Commerce","M5 — Drivers & Fulfillment","M6 — Admin Operations","M7 — Installer & Updater","M8 — Hardening & Release"];
            const existingMilestones = await github.paginate(github.rest.issues.listMilestones,{owner:context.repo.owner,repo:context.repo.repo,state:"all",per_page:100});
            const milestoneNames = new Set(existingMilestones.map(x=>x.title));
            for (const title of milestones) if (!milestoneNames.has(title)) await github.rest.issues.createMilestone({owner:context.repo.owner,repo:context.repo.repo,title});
