name: Temporary Pint Autofix 436

on:
  push:
    branches:
      - feat/436-customer-address-location-driver-navigation

permissions:
  contents: read

jobs:
  pint-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Apply Pint to failing files
        run: |
          vendor/bin/pint \
            app/Http/Controllers/Admin/Customer360Controller.php \
            app/Http/Controllers/Api/V1/CustomerProfileController.php \
            app/Services/PushDeliveryService.php \
            tests/Feature/PushLifecyclePayloadTest.php

      - name: Print exact formatter diff
        working-directory: .
        run: git diff --no-ext-diff -- backend/app/Http/Controllers/Admin/Customer360Controller.php backend/app/Http/Controllers/Api/V1/CustomerProfileController.php backend/app/Services/PushDeliveryService.php backend/tests/Feature/PushLifecyclePayloadTest.php
