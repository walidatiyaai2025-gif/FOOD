name: Temporary Pint Smart Analytics 1375

on:
  push:
    branches:
      - fix/1375-customer-hotfix-apk
    paths:
      - .github/workflows/tmp-pint-1375.yml

permissions:
  contents: write

jobs:
  pint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
      - name: Install backend dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist
      - name: Format Smart Analytics service only
        working-directory: backend
        run: vendor/bin/pint app/Services/MobileStoreAnalyticsService.php
      - name: Commit Pint-only result
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- backend/app/Services/MobileStoreAnalyticsService.php; then
            echo "No Pint changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/Services/MobileStoreAnalyticsService.php
          git commit -m "style(analytics): apply Laravel Pint (#1375)"
          git push origin HEAD:fix/1375-customer-hotfix-apk
