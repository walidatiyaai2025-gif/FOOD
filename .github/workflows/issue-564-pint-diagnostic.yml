name: Issue 564 Pint Diagnostic

on:
  pull_request:
    paths:
      - "backend/app/Http/Controllers/Admin/StorefrontDraftEditorController.php"
      - "backend/app/Services/StorefrontDraftEditorService.php"
      - ".github/workflows/issue-564-pint-diagnostic.yml"

permissions:
  contents: read

jobs:
  pint-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Print exact Pint diff
        shell: bash
        run: |
          set -euo pipefail
          vendor/bin/pint app/Http/Controllers/Admin/StorefrontDraftEditorController.php app/Services/StorefrontDraftEditorService.php
          git diff -- app/Http/Controllers/Admin/StorefrontDraftEditorController.php app/Services/StorefrontDraftEditorService.php
