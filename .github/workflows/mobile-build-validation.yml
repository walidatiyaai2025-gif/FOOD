name: FOODEX Mobile Build Validation

on:
  workflow_call:
    inputs:
      app:
        required: true
        type: string
      project:
        required: true
        type: string
      label:
        required: true
        type: string
      run_android:
        required: false
        default: true
        type: boolean
      run_ios:
        required: false
        default: false
        type: boolean
      run_web_preview:
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  FOODEX_API_BASE_URL: https://foodex.50sols.com

jobs:
  android:
    name: ${{ inputs.label }} Android release validation
    if: ${{ inputs.run_android }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: apps/${{ inputs.app }}_app
    steps:
      - uses: actions/checkout@v7
      - name: Set up Flutter 3.47.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          cache: true
      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ inputs.app }}-${{ hashFiles('apps/**/pubspec.yaml', 'packages/**/pubspec.yaml') }}
          restore-keys: |
            gradle-${{ runner.os }}-${{ inputs.app }}-
            gradle-${{ runner.os }}-
      - name: Prepare Android production identity
        shell: bash
        run: |
          set -euo pipefail
          flutter create --platforms=android --project-name "${{ inputs.project }}" .
          python3 ../../scripts/configure-mobile-native.py --app "${{ inputs.app }}" --app-dir . --platform android
          rm -f test/widget_test.dart
          flutter pub get
      - name: Build Android release validation APK
        run: flutter build apk --release --build-number="$GITHUB_RUN_NUMBER" --dart-define=FOODEX_API_BASE_URL="$FOODEX_API_BASE_URL"
      - name: Verify production endpoint and native identity
        shell: bash
        run: |
          set -euo pipefail
          apk=build/app/outputs/flutter-apk/app-release.apk
          python3 ../../scripts/verify-mobile-runtime-endpoint.py "$apk"
          aapt_bin="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$aapt_bin"
          "$aapt_bin" dump permissions "$apk" > build/release-permissions.txt
          "$aapt_bin" dump badging "$apk" > build/release-badging.txt
          grep -Fx "uses-permission: name='android.permission.INTERNET'" build/release-permissions.txt
          case "${{ inputs.app }}" in
            customer)
              grep -Fx "application-label:'FOODEX'" build/release-badging.txt
              grep -F "package: name='com.fiftysolution.foodex.customer'" build/release-badging.txt
              ;;
            driver)
              grep -Fx "application-label:'FOODEX Driver'" build/release-badging.txt
              grep -F "package: name='com.fiftysolution.foodex.driver'" build/release-badging.txt
              grep -Fx "uses-permission: name='android.permission.ACCESS_COARSE_LOCATION'" build/release-permissions.txt
              grep -Fx "uses-permission: name='android.permission.ACCESS_FINE_LOCATION'" build/release-permissions.txt
              grep -Fx "uses-permission: name='android.permission.FOREGROUND_SERVICE'" build/release-permissions.txt
              grep -Fx "uses-permission: name='android.permission.FOREGROUND_SERVICE_LOCATION'" build/release-permissions.txt
              if grep -Fq "android.permission.ACCESS_BACKGROUND_LOCATION" build/release-permissions.txt; then
                echo "Driver active-delivery path must not request broad background-location permission." >&2
                exit 1
              fi
              ;;
            van)
              grep -Fx "application-label:'FOODEX Van'" build/release-badging.txt
              grep -F "package: name='com.foodex.van'" build/release-badging.txt
              test -f android/app/google-services.json
              grep -F '"package_name": "com.foodex.van"' android/app/google-services.json
              grep -Fx "uses-permission: name='android.permission.POST_NOTIFICATIONS'" build/release-permissions.txt
              ;;
            *) echo "Unsupported FOODEX mobile app: ${{ inputs.app }}" >&2; exit 2 ;;
          esac
      - name: Package Android validation evidence
        working-directory: .
        run: python3 scripts/package-mobile-artifact.py --app "${{ inputs.app }}" --platform android --input "apps/${{ inputs.app }}_app/build/app/outputs/flutter-apk/app-release.apk" --build-number "$GITHUB_RUN_NUMBER" --commit "$GITHUB_SHA" --output "artifacts/${{ inputs.app }}/android"
      - name: Upload Android validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: foodex-${{ inputs.app }}-android-release-validation
          path: artifacts/${{ inputs.app }}/android/
          if-no-files-found: error
          retention-days: 14

  web-preview:
    name: ${{ inputs.label }} Web preview validation
    if: ${{ inputs.run_web_preview }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/${{ inputs.app }}_app
    steps:
      - uses: actions/checkout@v7
      - name: Set up Flutter 3.47.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          cache: true
      - name: Prepare Web target
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f web/index.html ]]; then
            flutter create --platforms=web --project-name "${{ inputs.project }}" .
          fi
      - name: Resolve dependencies
        run: flutter pub get
      - name: Build shared preview runtime
        shell: bash
        run: |
          set -euo pipefail
          base="/preview/${{ inputs.app }}/"
          flutter build web --release --target=lib/preview_main.dart --base-href="$base" --dart-define=FOODEX_API_BASE_URL="$FOODEX_API_BASE_URL" --dart-define=FOODEX_PREVIEW_PARENT_ORIGIN="$FOODEX_API_BASE_URL" --dart-define=FOODEX_PREVIEW_CONTRACT_VERSION=shared-flutter-v1
          test -s build/web/index.html
          test -s build/web/main.dart.js
          test -s build/web/flutter_bootstrap.js
      - name: Upload Web validation runtime
        uses: actions/upload-artifact@v4
        with:
          name: foodex-${{ inputs.app }}-web-preview-validation
          path: apps/${{ inputs.app }}_app/build/web/
          if-no-files-found: error
          retention-days: 14

  ios:
    name: ${{ inputs.label }} iOS no-codesign validation
    if: ${{ inputs.run_ios }}
    runs-on: macos-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: apps/${{ inputs.app }}_app
    steps:
      - uses: actions/checkout@v7
      - name: Set up Flutter 3.47.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          cache: true
      - name: Cache CocoaPods
        uses: actions/cache@v5
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/.cocoapods/repos
          key: cocoapods-${{ runner.os }}-${{ inputs.app }}-${{ hashFiles('apps/**/pubspec.yaml', 'packages/**/pubspec.yaml') }}
          restore-keys: |
            cocoapods-${{ runner.os }}-${{ inputs.app }}-
            cocoapods-${{ runner.os }}-
      - name: Prepare iOS production identity
        shell: bash
        run: |
          set -euo pipefail
          flutter create --platforms=ios --project-name "${{ inputs.project }}" .
          python3 ../../scripts/configure-mobile-native.py --app "${{ inputs.app }}" --app-dir . --platform ios
          flutter pub get
      - name: Apply approved iOS display name
        shell: bash
        run: |
          set -euo pipefail
          case "${{ inputs.app }}" in
            customer) display='FOODEX'; bundle='com.fiftysolution.foodex.customer' ;;
            driver) display='FOODEX Driver'; bundle='com.fiftysolution.foodex.driver' ;;
            *) echo "iOS validation is unsupported for ${{ inputs.app }}" >&2; exit 2 ;;
          esac
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName $display" ios/Runner/Info.plist
          echo "EXPECTED_DISPLAY=$display" >> "$GITHUB_ENV"
          echo "EXPECTED_BUNDLE=$bundle" >> "$GITHUB_ENV"
      - name: Build iOS release without codesign
        run: flutter build ios --release --no-codesign --build-number="$GITHUB_RUN_NUMBER" --dart-define=FOODEX_API_BASE_URL="$FOODEX_API_BASE_URL"
      - name: Verify iOS native identity
        shell: bash
        run: |
          set -euo pipefail
          plist=build/ios/iphoneos/Runner.app/Info.plist
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$plist")" = "$EXPECTED_DISPLAY"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")" = "$EXPECTED_BUNDLE"
          if [[ "${{ inputs.app }}" == "driver" ]]; then
            location_usage="$(/usr/libexec/PlistBuddy -c 'Print :NSLocationWhenInUseUsageDescription' "$plist")"
            test -n "$location_usage"
            echo "$location_usage" | grep -F 'FOODEX Driver'
            /usr/libexec/PlistBuddy -c 'Print :UIBackgroundModes' "$plist" > build/ios-background-modes.txt
            grep -F 'location' build/ios-background-modes.txt
            if /usr/libexec/PlistBuddy -c 'Print :NSLocationAlwaysAndWhenInUseUsageDescription' "$plist" >/dev/null 2>&1; then
              echo "Driver active-delivery path must not request Always location unless technically required." >&2
              exit 1
            fi
          fi
      - name: Archive unsigned iOS app
        run: ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app build/ios/iphoneos/Runner.app.zip
      - name: Package iOS validation evidence
        working-directory: .
        run: python3 scripts/package-mobile-artifact.py --app "${{ inputs.app }}" --platform ios --input "apps/${{ inputs.app }}_app/build/ios/iphoneos/Runner.app.zip" --build-number "$GITHUB_RUN_NUMBER" --commit "$GITHUB_SHA" --output "artifacts/${{ inputs.app }}/ios"
      - name: Upload unsigned iOS validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: foodex-${{ inputs.app }}-ios-release-validation
          path: artifacts/${{ inputs.app }}/ios/
          if-no-files-found: error
          retention-days: 14
