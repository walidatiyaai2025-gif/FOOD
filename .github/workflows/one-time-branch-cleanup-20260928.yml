name: FOODEX One-Time Branch Cleanup 2026-09-30

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/one-time-branch-cleanup-20260928.yml"

permissions:
  contents: write

jobs:
  cleanup:
    name: Delete completed or superseded branches
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete obsolete branches
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            "chore/refresh-trial-bundle-1.0.34"
            "feat/retail-incoming-wholesale-orders"
            "feat/438-driver-status-cards"
            "fix/order-operations-null-dates"
            "fix/439-b2b-order-tracking-route"
            "fix/462-self-healing-update-runtime"
          )
          for branch in "${branches[@]}"; do
            if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null 2>&1; then
              echo "Deleting $branch"
              git push origin --delete "$branch"
            else
              echo "Already absent: $branch"
            fi
          done

      - name: Verify cleanup and protected keep-set
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          for branch in \
            "chore/refresh-trial-bundle-1.0.34" \
            "feat/retail-incoming-wholesale-orders" \
            "feat/438-driver-status-cards" \
            "fix/order-operations-null-dates" \
            "fix/439-b2b-order-tracking-route" \
            "fix/462-self-healing-update-runtime"; do
            if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null 2>&1; then
              echo "::error::Branch still exists: $branch"
              failed=1
            else
              echo "Confirmed deleted: $branch"
            fi
          done

          for branch in \
            "main" \
            "feat/436-customer-address-location-driver-navigation" \
            "feat/436-fresh-integration" \
            "feat/437-marketplace-camera-scanner" \
            "release/221-generated-trial-bundle"; do
            if ! git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null 2>&1; then
              echo "::error::Required branch missing: $branch"
              failed=1
            else
              echo "Confirmed retained: $branch"
            fi
          done

          test "$failed" -eq 0
