name: TEMP 1612 Dart format capture

on:
  push:
    branches:
      - fix/1612-mobile-login-field-errors

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Format and print Driver files
        shell: bash
        run: |
          set -euo pipefail
          cd apps/driver_app
          flutter pub get
          dart format lib/core/localization/driver_translations.dart lib/features/auth/driver_login.dart test/driver_login_persistence_test.dart
          echo '===BEGIN_DRIVER_TRANSLATIONS==='
          cat lib/core/localization/driver_translations.dart
          echo '===END_DRIVER_TRANSLATIONS==='
          echo '===BEGIN_DRIVER_LOGIN==='
          cat lib/features/auth/driver_login.dart
          echo '===END_DRIVER_LOGIN==='
          echo '===BEGIN_DRIVER_TEST==='
          cat test/driver_login_persistence_test.dart
          echo '===END_DRIVER_TEST==='
