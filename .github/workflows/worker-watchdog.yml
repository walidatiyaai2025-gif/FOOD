name: Worker Watchdog

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  issues:
    types: [opened, reopened, edited]
  issue_comment:
    types: [created, edited]
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, closed]
  workflow_run:
    workflows:
      - "FOODEX Required CI Gate"
      - "Repository Policy"
    types: [completed]

permissions:
  actions: read
  checks: read
  contents: read
  issues: write
  pull-requests: read
  statuses: read

# Do not use one global cancelling slot here. Watchdog events are advisory
# coordination signals, so cancelling an older run creates false-red history
# on otherwise healthy repository state. Scope serialization to the concrete
# event target and let each accepted run finish.
concurrency:
  group: worker-watchdog-${{ github.event_name }}-${{ github.event.workflow_run.id || github.event.pull_request.number || github.event.comment.id || github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  watchdog:
    name: Detect stale workers and external gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted default-branch policy
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Run worker watchdog
        uses: actions/github-script@v7
        with:
          script: |
            const watchdog = require('./.github/scripts/worker-watchdog.js');
            await watchdog.run({ github, context, core });
