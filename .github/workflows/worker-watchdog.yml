name: Worker Watchdog

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "AGENTS.md"
      - ".github/workflows/worker-watchdog.yml"
      - ".github/scripts/worker-watchdog.js"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/pull_request_template.md"
  issues:
    types: [opened, reopened, labeled, unlabeled, edited]
  issue_comment:
    types: [created, edited]
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, closed]
  workflow_run:
    workflows:
      - "FOODEX Required CI Gate"
      - "Repository Policy"
    types: [completed, requested, in_progress]

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: worker-watchdog
  cancel-in-progress: true

jobs:
  watchdog:
    name: Detect stale workers and external gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted default-branch policy
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Run worker watchdog
        uses: actions/github-script@v7
        with:
          script: |
            const watchdog = require('./.github/scripts/worker-watchdog.js');
            await watchdog.run({ github, context, core });
