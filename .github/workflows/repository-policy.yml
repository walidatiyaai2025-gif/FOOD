name: Repository Policy
on:
  pull_request:
  push:
    branches: ["chore/1-bootstrap-foundation"]
permissions:
  contents: read

concurrency:
  group: repository-policy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: ./scripts/validate-repo.sh

      - name: Syntax-check First-Run Green scripts
        shell: bash
        run: |
          bash -n scripts/worker-start.sh
          bash -n scripts/worker-preflight.sh
          bash -n scripts/detect-changed-areas.sh
          bash -n scripts/validate-premerge-release-version.sh
          test -s docs/worker-rules/FIRST_RUN_GREEN.md
          test -s docs/worker-rules/CI_FAILURE_PATTERNS.md
      - name: Prevent post-merge main release failures
        if: github.event_name == 'pull_request'
        shell: bash
        run: bash scripts/validate-premerge-release-version.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"

      - name: Validate Worker Watchdog policy logic
        run: node --test .github/scripts/worker-watchdog.test.js

      - name: Syntax-check Worker Watchdog
        run: node --check .github/scripts/worker-watchdog.js

      - name: Test FOODEX skill router
        run: python3 -m unittest discover -s scripts/tests -p 'test_foodex_skill_router.py'

      - name: Enforce FOODEX skill routing
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 scripts/foodex-skill-router.py \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}" \
            --strict \
            --github-summary \
            --report artifacts/foodex-skill-router.json

      - name: Require issue-style PR branch
        if: github.event_name == 'pull_request'
        run: |
          branch="${{ github.head_ref }}"
          base="${{ github.base_ref }}"

          # Allow the canonical baseline-sync topology from main into a versioned
          # release branch. main is still rejected as a PR head for every other base.
          if [[ "$branch" == "main" && "$base" =~ ^release/([0-9]+|[0-9]+\.[0-9]+\.[0-9]+)-[a-z0-9-]+$ ]]; then
            exit 0
          fi

          [[ "$branch" == "feat/assistant-v1-integration" || "$branch" == "chore/geography-reset-one-shot" || "$branch" =~ ^((feat|fix|chore|docs|refactor|test|ci)/[0-9]+-[a-z0-9-]+|release/([0-9]+|[0-9]+\.[0-9]+\.[0-9]+)-[a-z0-9-]+)$ ]]
