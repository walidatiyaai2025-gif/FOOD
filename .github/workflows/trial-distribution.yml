name: FOODEX Trial Distribution Bundle

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/trial-distribution.yml"
      - "VERSION"
      - "backend/**"
      - "apps/customer_app/**"
      - "apps/driver_app/**"
      - "scripts/configure-mobile-native.py"
      - "scripts/build-dashboard-update.sh"
      - "scripts/write-trial-bundle-manifest.py"
      - "Release/README.md"
      - "Release/INSTALL-FIRST.txt"
      - "Release/Updates/README.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: foodex-trial-distribution-main
  cancel-in-progress: true

jobs:
  detect-release-intent:
    name: Detect release intent
    runs-on: ubuntu-latest
    outputs:
      release_intent: ${{ steps.detect.outputs.release_intent }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect VERSION promotion or manual release
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "release_intent=true" >> "$GITHUB_OUTPUT"
            echo "Manual distribution requested."
            exit 0
          fi

          current_version="$(tr -d '[:space:]' < VERSION)"
          previous_version="$(git show HEAD^:VERSION 2>/dev/null | tr -d '[:space:]' || true)"

          if [[ -n "$previous_version" && "$current_version" != "$previous_version" ]]; then
            echo "release_intent=true" >> "$GITHUB_OUTPUT"
            echo "VERSION changed: $previous_version -> $current_version"
          else
            echo "release_intent=false" >> "$GITHUB_OUTPUT"
            echo "No release intent: normal main merge with unchanged VERSION=$current_version."
          fi

  build:
    needs: detect-release-intent
    if: needs.detect-release-intent.outputs.release_intent == 'true'
    name: Build tester distribution
    runs-on: ubuntu-latest
    timeout-minutes: 55

    env:
      FOODEX_API_BASE_URL: https://foodex.50sols.com
      CUSTOMER_FIREBASE_API_KEY: ${{ vars.FOODEX_CUSTOMER_FIREBASE_API_KEY }}
      CUSTOMER_FIREBASE_APP_ID: ${{ vars.FOODEX_CUSTOMER_FIREBASE_APP_ID }}
      CUSTOMER_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FOODEX_CUSTOMER_FIREBASE_MESSAGING_SENDER_ID }}
      CUSTOMER_FIREBASE_PROJECT_ID: ${{ vars.FOODEX_CUSTOMER_FIREBASE_PROJECT_ID }}
      DRIVER_FIREBASE_API_KEY: ${{ vars.FOODEX_DRIVER_FIREBASE_API_KEY }}
      DRIVER_FIREBASE_APP_ID: ${{ vars.FOODEX_DRIVER_FIREBASE_APP_ID }}
      DRIVER_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FOODEX_DRIVER_FIREBASE_MESSAGING_SENDER_ID }}
      DRIVER_FIREBASE_PROJECT_ID: ${{ vars.FOODEX_DRIVER_FIREBASE_PROJECT_ID }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce release versioning
        shell: bash
        run: |
          set -euo pipefail
          current_version="$(tr -d '[:space:]' < VERSION)"
          customer_identity="$(awk '/^version:/{print $2; exit}' apps/customer_app/pubspec.yaml | tr -d '"')"
          driver_identity="$(awk '/^version:/{print $2; exit}' apps/driver_app/pubspec.yaml | tr -d '"')"
          test "$customer_identity" = "$driver_identity"
          test "${driver_identity%%+*}" = "$current_version"
          mobile_build_number="${driver_identity##*+}"
          test -n "$mobile_build_number"
          test "$mobile_build_number" -gt 0
          head_previous_version="$(git show HEAD^:VERSION 2>/dev/null | tr -d '[:space:]' || true)"
          if [[ -z "$head_previous_version" ]]; then
            head_previous_version="$current_version"
          fi

          previous_tag="$(
            git tag --merged HEAD --list 'v*' --sort=-v:refname \
              | grep -vx "v${current_version}" \
              | head -n 1 \
              || true
          )"
          if [[ -n "$previous_tag" ]]; then
            previous_version="${previous_tag#v}"
            update_base_ref="$previous_tag"
          else
            previous_version="$head_previous_version"
            update_base_ref="$(git log --format=%H -- VERSION | sed -n '2p')"
            if [[ -z "$update_base_ref" ]]; then
              update_base_ref="HEAD^"
            fi
          fi

          echo "CURRENT_VERSION=$current_version" >> "$GITHUB_ENV"
          echo "MOBILE_BUILD_NUMBER=$mobile_build_number" >> "$GITHUB_ENV"
          echo "PREVIOUS_VERSION=$previous_version" >> "$GITHUB_ENV"
          echo "UPDATE_BASE_REF=$update_base_ref" >> "$GITHUB_ENV"

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_mysql, zip
          tools: composer:v2
          coverage: none

      - name: Set up Flutter 3.47.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          cache: true

      - name: Prepare release directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Release/Updates
          rm -f Release/FOODEX-Customer.apk Release/FOODEX-Driver.apk Release/FOODEX-Laravel-Setup.zip Release/BUILD_INFO.json

      - name: Build Customer Android tester APK
        shell: bash
        run: |
          set -euo pipefail
          cd apps/customer_app
          flutter create --platforms=android --project-name foodex_customer_app .
          python3 ../../scripts/configure-mobile-native.py --app customer --app-dir . --platform android
          rm -f test/widget_test.dart
          flutter pub get
          defines=(--dart-define=FOODEX_API_BASE_URL="$FOODEX_API_BASE_URL")
          if [[ -n "$CUSTOMER_FIREBASE_API_KEY" && -n "$CUSTOMER_FIREBASE_APP_ID" && -n "$CUSTOMER_FIREBASE_MESSAGING_SENDER_ID" && -n "$CUSTOMER_FIREBASE_PROJECT_ID" ]]; then
            defines+=(--dart-define=FOODEX_FIREBASE_API_KEY="$CUSTOMER_FIREBASE_API_KEY")
            defines+=(--dart-define=FOODEX_FIREBASE_APP_ID="$CUSTOMER_FIREBASE_APP_ID")
            defines+=(--dart-define=FOODEX_FIREBASE_MESSAGING_SENDER_ID="$CUSTOMER_FIREBASE_MESSAGING_SENDER_ID")
            defines+=(--dart-define=FOODEX_FIREBASE_PROJECT_ID="$CUSTOMER_FIREBASE_PROJECT_ID")
          fi
          flutter build apk --release --build-name="$CURRENT_VERSION" --build-number="$MOBILE_BUILD_NUMBER" "${defines[@]}"
          aapt_bin="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          apk=build/app/outputs/flutter-apk/app-release.apk
          "$aapt_bin" dump permissions "$apk" | grep -Fx "uses-permission: name='android.permission.INTERNET'"
          "$aapt_bin" dump badging "$apk" > build/trial-badging.txt
          grep -Fx "application-label:'FOODEX'" build/trial-badging.txt
          grep -F "package: name='com.fiftysolution.foodex.customer'" build/trial-badging.txt
          grep -F "versionCode='$MOBILE_BUILD_NUMBER'" build/trial-badging.txt
          grep -F "versionName='$CURRENT_VERSION'" build/trial-badging.txt
          cp "$apk" "$GITHUB_WORKSPACE/Release/FOODEX-Customer.apk"

      - name: Build Driver Android tester APK
        shell: bash
        run: |
          set -euo pipefail
          cd apps/driver_app
          flutter create --platforms=android --project-name foodex_driver_app .
          python3 ../../scripts/configure-mobile-native.py --app driver --app-dir . --platform android
          rm -f test/widget_test.dart
          flutter pub get
          defines=(--dart-define=FOODEX_API_BASE_URL="$FOODEX_API_BASE_URL")
          if [[ -n "$DRIVER_FIREBASE_API_KEY" && -n "$DRIVER_FIREBASE_APP_ID" && -n "$DRIVER_FIREBASE_MESSAGING_SENDER_ID" && -n "$DRIVER_FIREBASE_PROJECT_ID" ]]; then
            defines+=(--dart-define=FOODEX_FIREBASE_API_KEY="$DRIVER_FIREBASE_API_KEY")
            defines+=(--dart-define=FOODEX_FIREBASE_APP_ID="$DRIVER_FIREBASE_APP_ID")
            defines+=(--dart-define=FOODEX_FIREBASE_MESSAGING_SENDER_ID="$DRIVER_FIREBASE_MESSAGING_SENDER_ID")
            defines+=(--dart-define=FOODEX_FIREBASE_PROJECT_ID="$DRIVER_FIREBASE_PROJECT_ID")
          fi
          flutter build apk --release --build-name="$CURRENT_VERSION" --build-number="$MOBILE_BUILD_NUMBER" "${defines[@]}"
          aapt_bin="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          apk=build/app/outputs/flutter-apk/app-release.apk
          "$aapt_bin" dump permissions "$apk" | grep -Fx "uses-permission: name='android.permission.INTERNET'"
          "$aapt_bin" dump badging "$apk" > build/trial-badging.txt
          grep -Fx "application-label:'FOODEX Driver'" build/trial-badging.txt
          grep -F "package: name='com.fiftysolution.foodex.driver'" build/trial-badging.txt
          grep -F "versionCode='$MOBILE_BUILD_NUMBER'" build/trial-badging.txt
          grep -F "versionName='$CURRENT_VERSION'" build/trial-badging.txt
          cp "$apk" "$GITHUB_WORKSPACE/Release/FOODEX-Driver.apk"

      - name: Build Laravel first-install ZIP
        shell: bash
        run: |
          set -euo pipefail
          composer install --working-dir=backend --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress
          stage="$(mktemp -d)"
          mkdir -p "$stage/backend"
          rsync -a backend/ "$stage/backend/" --exclude='.env' --exclude='tests/' --exclude='docs/' --exclude='.phpunit.cache/' --exclude='storage/logs/*' --exclude='storage/app/system/*'
          rm -f "$stage/backend/bootstrap/cache/"*.php
          cp VERSION "$stage/VERSION"
          cp Release/INSTALL-FIRST.txt "$stage/INSTALL-FIRST.txt"
          cd "$stage"
          zip -qr "$GITHUB_WORKSPACE/Release/FOODEX-Laravel-Setup.zip" .
          cd "$GITHUB_WORKSPACE"
          setup_bytes="$(stat -c%s Release/FOODEX-Laravel-Setup.zip)"
          if (( setup_bytes >= 99000000 )); then
            echo "::error::Laravel setup ZIP is too large for normal GitHub storage ($setup_bytes bytes)."
            exit 1
          fi

      - name: Build dashboard Update Center package
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build-dashboard-update.sh Release/Updates "$PREVIOUS_VERSION" "$CURRENT_VERSION" "$UPDATE_BASE_REF"
          if [[ -f Release/Updates/FOODEX-Update.zip ]]; then
            update_sha="$(sha256sum Release/Updates/FOODEX-Update.zip | awk '{print $1}')"
            printf '%s  %s\n' "$update_sha" "FOODEX-Update.zip" > Release/Updates/FOODEX-Update.sha256.txt
            unzip -Z1 Release/Updates/FOODEX-Update.zip > Release/Updates/FOODEX-Update.files.txt
          fi

      - name: Write bundle manifest
        shell: bash
        run: |
          set -euo pipefail
          customer_firebase=false
          driver_firebase=false
          if [[ -n "$CUSTOMER_FIREBASE_API_KEY" && -n "$CUSTOMER_FIREBASE_APP_ID" && -n "$CUSTOMER_FIREBASE_MESSAGING_SENDER_ID" && -n "$CUSTOMER_FIREBASE_PROJECT_ID" ]]; then
            customer_firebase=true
          fi
          if [[ -n "$DRIVER_FIREBASE_API_KEY" && -n "$DRIVER_FIREBASE_APP_ID" && -n "$DRIVER_FIREBASE_MESSAGING_SENDER_ID" && -n "$DRIVER_FIREBASE_PROJECT_ID" ]]; then
            driver_firebase=true
          fi
          python3 scripts/write-trial-bundle-manifest.py --version "$CURRENT_VERSION" --source-commit "$GITHUB_SHA" --run-number "$GITHUB_RUN_NUMBER" --mobile-build-number "$MOBILE_BUILD_NUMBER" --api-base-url "$FOODEX_API_BASE_URL" --customer Release/FOODEX-Customer.apk --driver Release/FOODEX-Driver.apk --setup Release/FOODEX-Laravel-Setup.zip --customer-firebase "$customer_firebase" --driver-firebase "$driver_firebase" --output Release/BUILD_INFO.json

      - name: Guard immutable published release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v$CURRENT_VERSION"
          git fetch --force origin "refs/tags/$tag:refs/tags/$tag" 2>/dev/null || true
          published_sha="$(git rev-list -n 1 "$tag" 2>/dev/null || true)"
          if [[ -z "$published_sha" ]]; then
            echo "No immutable tag exists yet for $tag; current commit is eligible for publication."
            exit 0
          fi
          if [[ "$published_sha" != "$GITHUB_SHA" ]]; then
            echo "FOODEX $CURRENT_VERSION is already published from $published_sha; refusing to replace immutable assets from $GITHUB_SHA."
            echo "RELEASE_PUBLICATION_SKIPPED=true" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "Existing tag $tag already points to this commit; workspace artifacts may be reconciled safely."
      - name: Publish version-locked mobile APK assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v$CURRENT_VERSION"
          notes_file="$(mktemp)"
          cat > "$notes_file" <<EOF
          # FOODEX $CURRENT_VERSION

          Dashboard, Customer APK and Driver APK are synchronized to the same FOODEX version.

          Source commit: $GITHUB_SHA

          - Dashboard: $CURRENT_VERSION
          - Customer Android APK: $CURRENT_VERSION+$MOBILE_BUILD_NUMBER
          - Driver Android APK: $CURRENT_VERSION+$MOBILE_BUILD_NUMBER
          EOF

          # Version tags are immutable release identities. A workflow-only rerun
          # at the same VERSION must never move an already-published tag or replace
          # release assets with artifacts from a different source commit.
          git fetch --force origin "refs/tags/$tag:refs/tags/$tag" 2>/dev/null || true
          published_sha="$(git rev-list -n 1 "$tag" 2>/dev/null || true)"
          if [[ -n "$published_sha" && "$published_sha" != "$GITHUB_SHA" ]]; then
            echo "FOODEX $CURRENT_VERSION is already published from $published_sha; refusing to move $tag to $GITHUB_SHA."
            echo "RELEASE_PUBLICATION_SKIPPED=true" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "RELEASE_PUBLICATION_SKIPPED=false" >> "$GITHUB_ENV"

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --title "FOODEX $CURRENT_VERSION" \
              --notes-file "$notes_file"
          elif [[ -n "$published_sha" ]]; then
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "FOODEX $CURRENT_VERSION" \
              --notes-file "$notes_file"
          else
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "FOODEX $CURRENT_VERSION" \
              --notes-file "$notes_file"
          fi

          gh release upload "$tag" \
            Release/FOODEX-Customer.apk \
            Release/FOODEX-Driver.apk \
            Release/BUILD_INFO.json \
            Release/Updates/FOODEX-Update.zip \
            Release/Updates/FOODEX-Update.json \
            Release/Updates/FOODEX-Update.sha256.txt \
            Release/Updates/FOODEX-Update.files.txt \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

          assets="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          grep -Fx "FOODEX-Customer.apk" <<<"$assets"
          grep -Fx "FOODEX-Driver.apk" <<<"$assets"
          grep -Fx "BUILD_INFO.json" <<<"$assets"
          grep -Fx "FOODEX-Update.zip" <<<"$assets"
          grep -Fx "FOODEX-Update.json" <<<"$assets"
          grep -Fx "FOODEX-Update.sha256.txt" <<<"$assets"
          grep -Fx "FOODEX-Update.files.txt" <<<"$assets"

          rm -rf /tmp/foodex-published
          mkdir -p /tmp/foodex-published
          gh release download "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "FOODEX-Driver.apk" \
            --pattern "BUILD_INFO.json" \
            --dir /tmp/foodex-published \
            --clobber
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import os

          root = Path("/tmp/foodex-published")
          manifest = json.loads((root / "BUILD_INFO.json").read_text(encoding="utf-8"))
          driver = root / "FOODEX-Driver.apk"
          digest = hashlib.sha256(driver.read_bytes()).hexdigest()
          expected_version = os.environ["CURRENT_VERSION"]
          expected_build = int(os.environ["MOBILE_BUILD_NUMBER"])
          assert manifest["version"] == expected_version
          assert manifest["driver"]["version"] == expected_version
          assert manifest["driver"]["build_number"] == expected_build
          assert manifest["driver"]["application_id"] == "com.fiftysolution.foodex.driver"
          assert manifest["driver"]["sha256"] == digest
          assert manifest["android_signing"] == "flutter-template-debug-key-test-only"
          assert manifest["production_store_ready"] is False
          print("Verified published Driver artifact:", expected_version, expected_build, digest)
          PY

      - name: Finalize Dashboard update release assets
        if: env.RELEASE_PUBLICATION_SKIPPED != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v$CURRENT_VERSION"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null
          for file in \
            FOODEX-Update.zip \
            FOODEX-Update.json \
            FOODEX-Update.sha256.txt \
            FOODEX-Update.files.txt
          do
            test -s "Release/Updates/$file"
          done

          CURRENT_VERSION="$CURRENT_VERSION" python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path("Release/Updates")
          package = root / "FOODEX-Update.zip"
          manifest = json.loads((root / "FOODEX-Update.json").read_text(encoding="utf-8"))
          checksum = (root / "FOODEX-Update.sha256.txt").read_text(encoding="utf-8").strip().split()[0]
          digest = hashlib.sha256(package.read_bytes()).hexdigest()
          expected_version = os.environ["CURRENT_VERSION"]
          assert manifest["target_version"] == expected_version
          assert manifest["package"] == "FOODEX-Update.zip"
          assert manifest["sha256"] == digest
          assert checksum == digest
          print("Verified Dashboard update asset set:", expected_version, digest)
          PY

          gh release upload "$tag" \
            Release/Updates/FOODEX-Update.zip \
            Release/Updates/FOODEX-Update.json \
            Release/Updates/FOODEX-Update.sha256.txt \
            Release/Updates/FOODEX-Update.files.txt \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
      - name: Validate bundle files
        shell: bash
        run: |
          set -euo pipefail
          test -s Release/FOODEX-Customer.apk
          test -s Release/FOODEX-Driver.apk
          test -s Release/FOODEX-Laravel-Setup.zip
          test -s Release/BUILD_INFO.json
          test -s Release/Updates/README.md
          test -s Release/Updates/FOODEX-Update.json
          unzip -l Release/FOODEX-Laravel-Setup.zip | grep -F 'backend/artisan'
          unzip -l Release/FOODEX-Laravel-Setup.zip | grep -F 'VERSION'

      - name: Upload distribution artifact
        if: env.RELEASE_PUBLICATION_SKIPPED != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: foodex-trial-distribution-${{ env.CURRENT_VERSION }}
          path: Release/
          if-no-files-found: error
          retention-days: 30

      - name: Publish generated bundle branch
        if: env.RELEASE_PUBLICATION_SKIPPED != 'true'
        shell: bash
        run: |
          set -euo pipefail
          generated_branch="release/221-generated-trial-bundle"
          bundle_stage="$(mktemp -d)"
          mkdir -p "$bundle_stage/Release/Updates"
          cp Release/FOODEX-Customer.apk Release/FOODEX-Driver.apk Release/FOODEX-Laravel-Setup.zip Release/BUILD_INFO.json "$bundle_stage/Release/"
          cp Release/Updates/FOODEX-Update.json "$bundle_stage/Release/Updates/"
          if [[ -f Release/Updates/FOODEX-Update.zip ]]; then
            cp Release/Updates/FOODEX-Update.zip "$bundle_stage/Release/Updates/"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git reset --hard
          git clean -fdx Release
          if git ls-remote --exit-code --heads origin "refs/heads/$generated_branch" >/dev/null 2>&1; then
            git fetch origin "$generated_branch"
            git switch -C "$generated_branch" "origin/$generated_branch"
          else
            git switch -C "$generated_branch" "$GITHUB_SHA"
          fi

          mkdir -p Release/Updates
          cp "$bundle_stage/Release/FOODEX-Customer.apk" Release/FOODEX-Customer.apk
          cp "$bundle_stage/Release/FOODEX-Driver.apk" Release/FOODEX-Driver.apk
          cp "$bundle_stage/Release/FOODEX-Laravel-Setup.zip" Release/FOODEX-Laravel-Setup.zip
          cp "$bundle_stage/Release/BUILD_INFO.json" Release/BUILD_INFO.json
          cp "$bundle_stage/Release/Updates/FOODEX-Update.json" Release/Updates/FOODEX-Update.json
          if [[ -f "$bundle_stage/Release/Updates/FOODEX-Update.zip" ]]; then
            cp "$bundle_stage/Release/Updates/FOODEX-Update.zip" Release/Updates/FOODEX-Update.zip
          else
            rm -f Release/Updates/FOODEX-Update.zip
          fi

          git add -f Release/FOODEX-Customer.apk Release/FOODEX-Driver.apk Release/FOODEX-Laravel-Setup.zip Release/BUILD_INFO.json Release/Updates/FOODEX-Update.json
          if [[ -f Release/Updates/FOODEX-Update.zip ]]; then
            git add -f Release/Updates/FOODEX-Update.zip
          else
            git add -u -- Release/Updates/FOODEX-Update.zip 2>/dev/null || true
          fi
          if git diff --cached --quiet; then
            echo "Generated distribution matches the current branch; nothing to publish."
            exit 0
          fi
          git commit -m "release: refresh FOODEX trial distribution ${CURRENT_VERSION}"
          git push origin "HEAD:refs/heads/$generated_branch"
