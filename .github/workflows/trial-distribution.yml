      - name: Publish terminal artifacts to canonical final branch
        if: env.RELEASE_PUBLICATION_SKIPPED != 'true' && github.ref_name == 'release/1021-uiux-v42-final-real-build'
        shell: bash
        run: |
          set -euo pipefail
          final_branch="release/1021-uiux-v42-final-real-build"
          stage="$(mktemp -d)"
          mkdir -p "$stage/Release/Updates"
          cp             Release/FOODEX-Customer.apk             Release/FOODEX-Driver.apk             Release/FOODEX-Van.apk             "Release/FOODEX-Customer-${CURRENT_VERSION}.apk"             "Release/FOODEX-Driver-${CURRENT_VERSION}.apk"             "Release/FOODEX-Van-${CURRENT_VERSION}.apk"             Release/LATEST_RELEASE.json             Release/FOODEX-Laravel-Setup.zip             Release/BUILD_INFO.json             Release/FRESH_INSTALL_EVIDENCE.json             "$stage/Release/"
          cp Release/Updates/FOODEX-Update.json "$stage/Release/Updates/"
          cp Release/Updates/FOODEX-Update.sha256.txt "$stage/Release/Updates/"
          cp Release/Updates/FOODEX-Update.files.txt "$stage/Release/Updates/"
          if [[ -f Release/Updates/FOODEX-Update.zip ]]; then
            cp Release/Updates/FOODEX-Update.zip "$stage/Release/Updates/"
          fi

          git fetch origin "$final_branch"
          git switch -C "$final_branch" "origin/$final_branch"
          git merge-base --is-ancestor "$GITHUB_SHA" HEAD

          mkdir -p Release/Updates
          rm -f Release/FOODEX-Customer-*.apk Release/FOODEX-Driver-*.apk Release/FOODEX-Van-*.apk
          cp "$stage/Release/FOODEX-Customer.apk" Release/FOODEX-Customer.apk
          cp "$stage/Release/FOODEX-Driver.apk" Release/FOODEX-Driver.apk
          cp "$stage/Release/FOODEX-Van.apk" Release/FOODEX-Van.apk
          cp "$stage/Release/FOODEX-Customer-${CURRENT_VERSION}.apk" "Release/FOODEX-Customer-${CURRENT_VERSION}.apk"
          cp "$stage/Release/FOODEX-Driver-${CURRENT_VERSION}.apk" "Release/FOODEX-Driver-${CURRENT_VERSION}.apk"
          cp "$stage/Release/FOODEX-Van-${CURRENT_VERSION}.apk" "Release/FOODEX-Van-${CURRENT_VERSION}.apk"
          cp "$stage/Release/LATEST_RELEASE.json" Release/LATEST_RELEASE.json
          cp "$stage/Release/FOODEX-Laravel-Setup.zip" Release/FOODEX-Laravel-Setup.zip
          cp "$stage/Release/BUILD_INFO.json" Release/BUILD_INFO.json
          cp "$stage/Release/FRESH_INSTALL_EVIDENCE.json" Release/FRESH_INSTALL_EVIDENCE.json
          cp "$stage/Release/Updates/FOODEX-Update.json" Release/Updates/FOODEX-Update.json
          cp "$stage/Release/Updates/FOODEX-Update.sha256.txt" Release/Updates/FOODEX-Update.sha256.txt
          cp "$stage/Release/Updates/FOODEX-Update.files.txt" Release/Updates/FOODEX-Update.files.txt
          if [[ -f "$stage/Release/Updates/FOODEX-Update.zip" ]]; then
            cp "$stage/Release/Updates/FOODEX-Update.zip" Release/Updates/FOODEX-Update.zip
          else
            rm -f Release/Updates/FOODEX-Update.zip
          fi

          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path("Release")
          build = json.loads((root / "BUILD_INFO.json").read_text())
          latest = json.loads((root / "LATEST_RELEASE.json").read_text())
          evidence = json.loads((root / "FRESH_INSTALL_EVIDENCE.json").read_text())
          setup = root / "FOODEX-Laravel-Setup.zip"
          expected = os.environ["GITHUB_SHA"]
          version = os.environ["CURRENT_VERSION"]
          digest = hashlib.sha256(setup.read_bytes()).hexdigest()
          assert build["version"] == version
          assert build["source_commit"] == expected
          assert build["laravel_setup"]["sha256"] == digest
          assert latest["version"] == version
          assert latest["source_commit"] == expected
          assert evidence["version"] == version
          assert evidence["source_commit"] == expected
          print("Terminal branch provenance verified:", version, expected, digest)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f             Release/FOODEX-Customer.apk             Release/FOODEX-Driver.apk             Release/FOODEX-Van.apk             "Release/FOODEX-Customer-${CURRENT_VERSION}.apk"             "Release/FOODEX-Driver-${CURRENT_VERSION}.apk"             "Release/FOODEX-Van-${CURRENT_VERSION}.apk"             Release/LATEST_RELEASE.json             Release/FOODEX-Laravel-Setup.zip             Release/BUILD_INFO.json             Release/FRESH_INSTALL_EVIDENCE.json             Release/Updates/FOODEX-Update.json             Release/Updates/FOODEX-Update.sha256.txt             Release/Updates/FOODEX-Update.files.txt
