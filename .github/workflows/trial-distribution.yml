name: FOODEX Trial Distribution Bundle

on:
  push:
    branches:
      - main
      - "release/**"
    paths:
      - ".github/workflows/trial-distribution.yml"
      - "VERSION"
      - "backend/**"
      - "apps/customer_app/**"
      - "apps/driver_app/**"
      - "apps/van_app/**"
      - "scripts/configure-mobile-native.py"
      - "scripts/build-dashboard-update.sh"
      - "scripts/write-trial-bundle-manifest.py"
      - "scripts/validate_release_artifact_contract.py"
      - "scripts/tests/test_release_artifact_contract.py"
      - "Release/README.md"
      - "Release/INSTALL-FIRST.txt"
      - "Release/Updates/README.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: foodex-trial-distribution-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  detect-release-intent:
    name: Detect release intent
    runs-on: ubuntu-latest
    outputs:
      release_intent: ${{ steps.detect.outputs.release_intent }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect VERSION promotion or manual release
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "release_intent=true" >> "$GITHUB_OUTPUT"
            echo "Manual distribution requested."
            exit 0
          fi

          current_version="$(tr -d '[:space:]' < VERSION)"
          previous_version="$(git show HEAD^:VERSION 2>/dev/null | tr -d '[:space:]' || true)"

          if [[ "$GITHUB_REF_NAME" == "release/1021-uiux-v42-final-real-build" ]]; then
            changed_paths="$(git diff --name-only HEAD^ HEAD || true)"
            if [[ -n "$changed_paths" ]] && ! printf '%s\n' "$changed_paths" | grep -Ev '^Release/' >/dev/null; then
              echo "release_intent=false" >> "$GITHUB_OUTPUT"
              echo "Terminal generated-artifact-only publication detected; release rebuild is not required."
              exit 0
            fi
            echo "release_intent=true" >> "$GITHUB_OUTPUT"
            echo "Terminal #1021 release branch requests $current_version distribution from a source/workflow change."
            exit 0
          fi

          if [[ -n "$previous_version" && "$current_version" != "$previous_version" ]]; then
            echo "release_intent=true" >> "$GITHUB_OUTPUT"
            echo "VERSION changed: $previous_version -> $current_version"
          else
            echo "release_intent=false" >> "$GITHUB_OUTPUT"
            echo "No release intent: normal main merge with unchanged VERSION=$current_version."
          fi

  localization-quality:
    needs: detect-release-intent
    if: needs.detect-release-intent.outputs.release_intent == 'true'
    uses: ./.github/workflows/localization-quality-gate.yml
    with:
      base_sha: ${{ github.event.before }}
      head_sha: ${{ github.sha }}

  build:
    needs:
      - detect-release-intent
      - localization-quality
    if: needs.detect-release-intent.outputs.release_intent == 'true' && needs.localization-quality.result == 'success'
    name: Build tester distribution
    runs-on: ubuntu-latest
    timeout-minutes: 80

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: foodex_acceptance
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    env:
      FOODEX_API_BASE_URL: https://vanfoodex.50sols.com
      CUSTOMER_FIREBASE_API_KEY: ${{ vars.FOODEX_CUSTOMER_FIREBASE_API_KEY }}
      CUSTOMER_FIREBASE_APP_ID: ${{ vars.FOODEX_CUSTOMER_FIREBASE_APP_ID }}
      CUSTOMER_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FOODEX_CUSTOMER_FIREBASE_MESSAGING_SENDER_ID }}
      CUSTOMER_FIREBASE_PROJECT_ID: ${{ vars.FOODEX_CUSTOMER_FIREBASE_PROJECT_ID }}
      DRIVER_FIREBASE_API_KEY: ${{ vars.FOODEX_DRIVER_FIREBASE_API_KEY }}
      DRIVER_FIREBASE_APP_ID: ${{ vars.FOODEX_DRIVER_FIREBASE_APP_ID }}
      DRIVER_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FOODEX_DRIVER_FIREBASE_MESSAGING_SENDER_ID }}
      DRIVER_FIREBASE_PROJECT_ID: ${{ vars.FOODEX_DRIVER_FIREBASE_PROJECT_ID }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce release versioning
        shell: bash
        run: |
          set -euo pipefail
          current_version="$(tr -d '[:space:]' < VERSION)"
          customer_identity="$(awk '/^version:/{print $2; exit}' apps/customer_app/pubspec.yaml | tr -d '"')"
          driver_identity="$(awk '/^version:/{print $2; exit}' apps/driver_app/pubspec.yaml | tr -d '"')"
          van_identity="$(awk '/^version:/{print $2; exit}' apps/van_app/pubspec.yaml | tr -d '"')"
          test "$customer_identity" = "$driver_identity"
          test "$customer_identity" = "$van_identity"
          test "${driver_identity%%+*}" = "$current_version"
          mobile_build_number="${driver_identity##*+}"
          test -n "$mobile_build_number"
          test "$mobile_build_number" -gt 0
          head_previous_version="$(git show HEAD^:VERSION 2>/dev/null | tr -d '[:space:]' || true)"
          if [[ -z "$head_previous_version" ]]; then
            head_previous_version="$current_version"
          fi

          previous_tag="$(
            git tag --merged HEAD --list 'v*' --sort=-v:refname \
              | grep -vx "v${current_version}" \
              | head -n 1 \
              || true
          )"
          if [[ -n "$previous_tag" ]]; then
            previous_version="${previous_tag#v}"
            update_base_ref="$previous_tag"
          else
            previous_version="$head_previous_version"
            update_base_ref="$(git log --format=%H -- VERSION | sed -n '2p')"
            if [[ -z "$update_base_ref" ]]; then
              update_base_ref="HEAD^"
            fi
          fi

          echo "CURRENT_VERSION=$current_version" >> "$GITHUB_ENV"
          echo "MOBILE_BUILD_NUMBER=$mobile_build_number" >> "$GITHUB_ENV"
          echo "PREVIOUS_VERSION=$previous_version" >> "$GITHUB_ENV"
          echo "UPDATE_BASE_REF=$update_base_ref" >> "$GITHUB_ENV"

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_mysql, zip
          tools: composer:v2
          coverage: none

      - name: Set up Flutter 3.47.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          cache: true

      - name: Prepare release directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Release/Updates
          rm -f \
            Release/FOODEX-Customer.apk \
            Release/FOODEX-Driver.apk \
            Release/FOODEX-Van.apk \
            Release/FOODEX-Customer-*.apk \
            Release/FOODEX-Driver-*.apk \
            Release/FOODEX-Van-*.apk \
            Release/FOODEX-Laravel-Setup.zip \
            Release/BUILD_INFO.json \
            Release/LATEST_RELEASE.json

      - name: Build Customer Android tester APK
        shell: bash
        run: |
          set -euo pipefail
          cd apps/customer_app
          flutter create --platforms=android --project-name foodex_customer_app .
          python3 ../../scripts/configure-mobile-native.py --app customer --app-dir . --platform android
          rm -f test/widget_test.dart
          flutter pub get
          defines=(--dart-define=FOODEX_API_BASE_URL="$FOODEX_API_BASE_URL")
          if [[ -n "$CUSTOMER_FIREBASE_API_KEY" && -n "$CUSTOMER_FIREBASE_APP_ID" && -n "$CUSTOMER_FIREBASE_MESSAGING_SENDER_ID" && -n "$CUSTOMER_FIREBASE_PROJECT_ID" ]]; then
            defines+=(--dart-define=FOODEX_FIREBASE_API_KEY="$CUSTOMER_FIREBASE_API_KEY")
            defines+=(--dart-define=FOODEX_FIREBASE_APP_ID="$CUSTOMER_FIREBASE_APP_ID")
            defines+=(--dart-define=FOODEX_FIREBASE_MESSAGING_SENDER_ID="$CUSTOMER_FIREBASE_MESSAGING_SENDER_ID")
            defines+=(--dart-define=FOODEX_FIREBASE_PROJECT_ID="$CUSTOMER_FIREBASE_PROJECT_ID")
          fi
          flutter build apk --release --build-name="$CURRENT_VERSION" --build-number="$MOBILE_BUILD_NUMBER" "${defines[@]}"
          aapt_bin="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          apk=build/app/outputs/flutter-apk/app-release.apk
          "$aapt_bin" dump permissions "$apk" | grep -Fx "uses-permission: name='android.permission.INTERNET'"
          "$aapt_bin" dump badging "$apk" > build/trial-badging.txt
          grep -Fx "application-label:'FOODEX'" build/trial-badging.txt
          grep -F "package: name='com.fiftysolution.foodex.customer'" build/trial-badging.txt
          grep -F "versionCode='$MOBILE_BUILD_NUMBER'" build/trial-badging.txt
          grep -F "versionName='$CURRENT_VERSION'" build/trial-badging.txt
          cp "$apk" "$GITHUB_WORKSPACE/Release/FOODEX-Customer.apk"

      - name: Build Driver Android tester APK
        shell: bash
        run: |
          set -euo pipefail
          cd apps/driver_app
          flutter create --platforms=android --project-name foodex_driver_app .
          python3 ../../scripts/configure-mobile-native.py --app driver --app-dir . --platform android
          rm -f test/widget_test.dart
          flutter pub get
          defines=(--dart-define=FOODEX_API_BASE_URL="$FOODEX_API_BASE_URL")
          if [[ -n "$DRIVER_FIREBASE_API_KEY" && -n "$DRIVER_FIREBASE_APP_ID" && -n "$DRIVER_FIREBASE_MESSAGING_SENDER_ID" && -n "$DRIVER_FIREBASE_PROJECT_ID" ]]; then
            defines+=(--dart-define=FOODEX_FIREBASE_API_KEY="$DRIVER_FIREBASE_API_KEY")
            defines+=(--dart-define=FOODEX_FIREBASE_APP_ID="$DRIVER_FIREBASE_APP_ID")
            defines+=(--dart-define=FOODEX_FIREBASE_MESSAGING_SENDER_ID="$DRIVER_FIREBASE_MESSAGING_SENDER_ID")
            defines+=(--dart-define=FOODEX_FIREBASE_PROJECT_ID="$DRIVER_FIREBASE_PROJECT_ID")
          fi
          flutter build apk --release --build-name="$CURRENT_VERSION" --build-number="$MOBILE_BUILD_NUMBER" "${defines[@]}"
          aapt_bin="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          apk=build/app/outputs/flutter-apk/app-release.apk
          "$aapt_bin" dump permissions "$apk" | grep -Fx "uses-permission: name='android.permission.INTERNET'"
          "$aapt_bin" dump badging "$apk" > build/trial-badging.txt
          grep -Fx "application-label:'FOODEX Driver'" build/trial-badging.txt
          grep -F "package: name='com.fiftysolution.foodex.driver'" build/trial-badging.txt
          grep -F "versionCode='$MOBILE_BUILD_NUMBER'" build/trial-badging.txt
          grep -F "versionName='$CURRENT_VERSION'" build/trial-badging.txt
          cp "$apk" "$GITHUB_WORKSPACE/Release/FOODEX-Driver.apk"

      - name: Build Van Android tester APK
        shell: bash
        run: |
          set -euo pipefail
          cd apps/van_app
          flutter create --platforms=android --project-name foodex_van_app .
          python3 ../../scripts/configure-mobile-native.py --app van --app-dir . --platform android
          rm -f test/widget_test.dart
          flutter pub get
          flutter build apk --release \
            --build-name="$CURRENT_VERSION" \
            --build-number="$MOBILE_BUILD_NUMBER" \
            --dart-define=FOODEX_API_BASE_URL="$FOODEX_API_BASE_URL"
          aapt_bin="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          apk=build/app/outputs/flutter-apk/app-release.apk
          "$aapt_bin" dump permissions "$apk" | grep -Fx "uses-permission: name='android.permission.INTERNET'"
          "$aapt_bin" dump badging "$apk" > build/trial-badging.txt
          grep -Fx "application-label:'FOODEX Van'" build/trial-badging.txt
          grep -F "package: name='com.foodex.van'" build/trial-badging.txt
          grep -F "versionCode='$MOBILE_BUILD_NUMBER'" build/trial-badging.txt
          grep -F "versionName='$CURRENT_VERSION'" build/trial-badging.txt
          cp "$apk" "$GITHUB_WORKSPACE/Release/FOODEX-Van.apk"

      - name: Create versioned mobile APK filenames
        shell: bash
        run: |
          set -euo pipefail
          cp Release/FOODEX-Customer.apk "Release/FOODEX-Customer-${CURRENT_VERSION}.apk"
          cp Release/FOODEX-Driver.apk "Release/FOODEX-Driver-${CURRENT_VERSION}.apk"
          cp Release/FOODEX-Van.apk "Release/FOODEX-Van-${CURRENT_VERSION}.apk"

      - name: Build Laravel first-install ZIP
        shell: bash
        run: |
          set -euo pipefail
          composer install --working-dir=backend --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress
          stage="$(mktemp -d)"
          mkdir -p "$stage/backend"
          rsync -a backend/ "$stage/backend/" --exclude='.env' --exclude='tests/' --exclude='docs/' --exclude='.phpunit.cache/' --exclude='storage/logs/*' --exclude='storage/app/system/*'
          rm -f "$stage/backend/bootstrap/cache/"*.php
          cp VERSION "$stage/VERSION"
          cp Release/INSTALL-FIRST.txt "$stage/INSTALL-FIRST.txt"
          cd "$stage"
          zip -qr "$GITHUB_WORKSPACE/Release/FOODEX-Laravel-Setup.zip" .
          cd "$GITHUB_WORKSPACE"
          setup_bytes="$(stat -c%s Release/FOODEX-Laravel-Setup.zip)"
          if (( setup_bytes >= 99000000 )); then
            echo "::error::Laravel setup ZIP is too large for normal GitHub storage ($setup_bytes bytes)."
            exit 1
          fi

      - name: Set up Node for fresh-install visual QA
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Playwright Chromium for fresh-install visual QA
        shell: bash
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Validate clean install from ZIP only
        shell: bash
        run: |
          set -Eeuo pipefail
          report_failure() {
            local rc="$1"
            local line="$2"
            local cmd="$3"
            echo "::error::Fresh Setup failed at line $line with exit $rc: $cmd"
            cat /tmp/foodex-install-server.log 2>/dev/null || true
            cat /tmp/foodex-installed-server.log 2>/dev/null || true
            if [[ -n "${fresh:-}" ]]; then
              tail -n 200 "$fresh/backend/storage/logs/laravel.log" 2>/dev/null || true
            fi
            return "$rc"
          }
          trap 'report_failure "$?" "$LINENO" "$BASH_COMMAND"' ERR

          fresh="$(mktemp -d)"
          unzip -q Release/FOODEX-Laravel-Setup.zip -d "$fresh"
          test "$(tr -d '[:space:]' < "$fresh/VERSION")" = "1.0.59"
          test -d "$fresh/backend/public"
          test -s "$fresh/backend/vendor/autoload.php"
          test ! -e "$fresh/backend/.env"

          cp "$fresh/backend/.env.production.example" "$fresh/backend/.env"
          sed -i             -e 's|^APP_URL=.*|APP_URL=https://vanfoodex.50sols.com|'             -e 's|^DB_HOST=.*|DB_HOST=127.0.0.1|'             -e 's|^DB_PORT=.*|DB_PORT=3306|'             -e 's|^DB_DATABASE=.*|DB_DATABASE=foodex_acceptance|'             -e 's|^DB_USERNAME=.*|DB_USERNAME=root|'             -e 's|^DB_PASSWORD=.*|DB_PASSWORD=root|'             -e 's|^CACHE_STORE=.*|CACHE_STORE=redis|'             -e 's|^QUEUE_CONNECTION=.*|QUEUE_CONNECTION=redis|'             -e 's|^REDIS_HOST=.*|REDIS_HOST=127.0.0.1|'             "$fresh/backend/.env"

          cat > /tmp/foodex-fresh-install.php <<'PHP'
          <?php
          $root = getenv('FRESH_ROOT');
          require $root.'/backend/vendor/autoload.php';
          $app = require $root.'/backend/bootstrap/app.php';
          $kernel = $app->make(Illuminate\Contracts\Console\Kernel::class);
          $kernel->bootstrap();

          config([
              'foodex.scheduler_auto_provision' => false,
              'foodex.scheduler_heartbeat' => true,
          ]);

          $workflow = $app->make(App\Domain\Installer\InstallerWorkflow::class);
          $state = $app->make(App\Domain\Installer\InstallState::class);
          $mode = $argv[1] ?? '';

          if ($mode === 'prepare') {
              $workflow->saveDatabaseConfiguration([
                  'host' => '127.0.0.1',
                  'port' => 3306,
                  'database' => 'foodex_acceptance',
                  'username' => 'root',
                  'password' => 'root',
              ]);
              $workflow->savePlatformInformation([
                  'name' => 'FOODEX',
                  'url' => 'https://vanfoodex.50sols.com',
                  'locale' => 'ar',
              ]);
              $workflow->saveCacheQueueConfiguration([
                  'cache' => 'redis',
                  'queue' => 'redis',
                  'redis_host' => '127.0.0.1',
                  'redis_port' => 6379,
                  'redis_password' => 'null',
              ]);
              $workflow->saveMailConfiguration([
                  'mailer' => 'log',
                  'from_address' => 'noreply@50sols.com',
                  'from_name' => 'FOODEX',
              ]);
              $workflow->generateApplicationKey();
              $workflow->runMigrations();
              $workflow->seedRequiredCoreData();
              $workflow->saveStorageConfiguration('local');
              $checks = $workflow->healthCheck();
              if ($checks !== ['database'=>true,'storage'=>true,'cache'=>true,'queue'=>true]) {
                  throw new RuntimeException('Fresh installer health checks did not all pass.');
              }
              if ($state->isInstalled()) {
                  throw new RuntimeException('Install lock exists before Finish.');
              }
              exit(0);
          }

          if ($mode === 'finish') {
              $admin = $workflow->prepareSuperAdmin([
                  'name' => 'FOODEX Acceptance Owner',
                  'email' => 'acceptance-owner@example.test',
                  'password' => 'AcceptanceOnly!12345',
                  'locale' => 'en',
              ]);
              $version = $workflow->finish($admin);
              if ($version !== '1.0.59' || ! $state->isInstalled()) {
                  throw new RuntimeException('Installer Finish did not lock 1.0.59.');
              }
              $db = Illuminate\Support\Facades\DB::class;
              if (! $db::table('users')->where('email', 'acceptance-owner@example.test')->where('is_active', true)->exists()) {
                  throw new RuntimeException('First owner was not created.');
              }
              if (! $db::table('system_versions')->where('version', '1.0.59')->exists()) {
                  throw new RuntimeException('System version was not recorded.');
              }

              $owner = App\Models\User::query()
                  ->where('email', 'acceptance-owner@example.test')
                  ->firstOrFail();

              $expectedFlags = [
                  'commercial_rules_enabled' => true,
                  'flash_offers_enabled' => true,
                  'customer_flash_popup_enabled' => true,
                  'van_offers_enabled' => true,
              ];
              $actualFlags = $app->make(App\Services\CommercialFeatureFlags::class)->snapshot();
              if ($actualFlags !== $expectedFlags) {
                  throw new RuntimeException('Canonical Van release feature flags were not enabled on first install: '.json_encode($actualFlags));
              }

              foreach (['platform.manage','catalog.view','catalog.manage','promotions.view','promotions.manage','field_ops.manage','territories.manage','drivers.tracking.view','drivers.b2b.view','finance.view','customers.view'] as $permission) {
                  if (! $owner->hasPermission($permission)) {
                      throw new RuntimeException("Fresh Super Admin is missing required permission [{$permission}].");
                  }
              }

              $now = now();
              $b2bStoreTypeId = (int) $db::table('store_types')->where('code', 'B2B')->value('id');
              if ($b2bStoreTypeId <= 0) {
                  throw new RuntimeException('Expected seeded B2B store type was not returned after fresh setup.');
              }
              $b2bStoreId = (int) $db::table('stores')->insertGetId([
                  'store_type_id' => $b2bStoreTypeId,
                  'code' => 'FRESH-VAN-B2B',
                  'name' => 'Fresh Van B2B Operation',
                  'is_active' => true,
                  'created_at' => $now,
                  'updated_at' => $now,
              ]);
              if ($b2bStoreId <= 0 || ! $db::table('stores')->where('id', $b2bStoreId)->where('store_type_id', $b2bStoreTypeId)->where('is_active', true)->exists()) {
                  throw new RuntimeException('Expected seeded B2B store was not returned after fresh setup.');
              }

              $storeTypeId = (int) $db::table('store_types')->where('code', 'B2C')->value('id');
              if ($storeTypeId <= 0) {
                  throw new RuntimeException('Expected seeded B2C store type was not returned after fresh setup.');
              }
              $storeId = (int) $db::table('stores')->insertGetId([
                  'store_type_id' => $storeTypeId,
                  'code' => 'FRESH-VAN',
                  'name' => 'Fresh Van Acceptance Store',
                  'is_active' => true,
                  'created_at' => $now,
                  'updated_at' => $now,
              ]);
              if ($storeId <= 0 || ! $db::table('stores')->where('id', $storeId)->where('store_type_id', $storeTypeId)->where('is_active', true)->exists()) {
                  throw new RuntimeException('Expected seeded B2C store was not returned after fresh setup.');
              }

              $catalogId = (int) $db::table('catalogs')->insertGetId([
                  'store_id' => $storeId,
                  'channel' => 'b2c',
                  'code' => 'fresh-van',
                  'name' => 'Fresh Van Acceptance',
                  'is_active' => true,
                  'is_migration_quarantine' => false,
                  'created_at' => $now,
                  'updated_at' => $now,
              ]);
              $unitId = (int) $db::table('units')->insertGetId([
                  'store_id' => $storeId,
                  'scope' => 'store',
                  'scope_key' => 'store:'.$storeId,
                  'code' => 'EA',
                  'name' => 'Each',
                  'name_ar' => 'قطعة',
                  'name_en' => 'Each',
                  'decimal_places' => 0,
                  'is_active' => true,
                  'created_at' => $now,
                  'updated_at' => $now,
              ]);
              $productId = (int) $db::table('products')->insertGetId([
                  'catalog_id' => $catalogId,
                  'unit_id' => $unitId,
                  'sku' => 'FRESH-VAN-001',
                  'name' => 'Fresh Van Product',
                  'is_active' => true,
                  'created_at' => $now,
                  'updated_at' => $now,
              ]);
              $db::table('store_products')->insert([
                  'store_id' => $storeId,
                  'product_id' => $productId,
                  'price' => 10,
                  'is_active' => true,
                  'created_at' => $now,
                  'updated_at' => $now,
              ]);
              $db::table('product_selling_units')->insert([
                  'product_id' => $productId,
                  'unit_id' => $unitId,
                  'code' => 'EA',
                  'name' => 'Each',
                  'conversion_factor' => 1,
                  'price' => 10,
                  'sku' => 'FRESH-VAN-001',
                  'barcode' => null,
                  'is_base' => true,
                  'is_active' => true,
                  'created_at' => $now,
                  'updated_at' => $now,
              ]);
              $db::table('product_commercial_policies')->insert([
                  'product_id' => $productId,
                  'status' => 'OPEN',
                  'hide_when_closed' => false,
                  'override_allowed' => true,
                  'channels' => json_encode(['customer'=>true,'van'=>true,'admin'=>true], JSON_THROW_ON_ERROR),
                  'break_pack_policy' => 'mixed',
                  'business_timezone' => 'Asia/Kuwait',
                  'week_starts_on' => 1,
                  'created_at' => $now,
                  'updated_at' => $now,
              ]);

              $customerUser = App\Models\User::query()->create([
                  'name' => 'Fresh Van Customer',
                  'email' => 'fresh-van-customer@example.test',
                  'password' => Illuminate\Support\Facades\Hash::make('AcceptanceCustomer!12345'),
                  'locale' => 'en',
                  'is_active' => true,
              ]);
              $legacyCustomerId = (int) $db::table('customers')->insertGetId([
                  'user_id' => $customerUser->id,
                  'type' => 'b2c',
                  'name' => 'Fresh Van Customer',
                  'email' => $customerUser->email,
                  'created_at' => $now,
                  'updated_at' => $now,
              ]);
