      - name: Guard immutable published release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v$CURRENT_VERSION"
          git fetch --force origin "refs/tags/$tag:refs/tags/$tag" 2>/dev/null || true
          published_sha="$(git rev-list -n 1 "$tag" 2>/dev/null || true)"
          if [[ -z "$published_sha" ]]; then
            echo "No immutable tag exists yet for $tag; current commit is eligible for publication."
            exit 0
          fi
          if [[ "$published_sha" != "$GITHUB_SHA" ]]; then
            echo "FOODEX $CURRENT_VERSION is already published from $published_sha; refusing to replace immutable assets from $GITHUB_SHA."
            echo "RELEASE_PUBLICATION_SKIPPED=true" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "Existing tag $tag already points to this commit; workspace artifacts may be reconciled safely."
      - name: Publish version-locked mobile APK assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v$CURRENT_VERSION"
          notes_file="$(mktemp)"
          cat > "$notes_file" <<EOF
          # FOODEX $CURRENT_VERSION

          Dashboard, Customer APK, Driver APK and Van APK are synchronized to the same FOODEX version.

          Source commit: $GITHUB_SHA

          - Dashboard: $CURRENT_VERSION
          - Customer Android APK: $CURRENT_VERSION+$MOBILE_BUILD_NUMBER
          - Driver Android APK: $CURRENT_VERSION+$MOBILE_BUILD_NUMBER
          - Van Android APK: $CURRENT_VERSION+$MOBILE_BUILD_NUMBER
          EOF

          # Version tags are immutable release identities. A workflow-only rerun
          # at the same VERSION must never move an already-published tag or replace
          # release assets with artifacts from a different source commit.
          git fetch --force origin "refs/tags/$tag:refs/tags/$tag" 2>/dev/null || true
          published_sha="$(git rev-list -n 1 "$tag" 2>/dev/null || true)"
          if [[ -n "$published_sha" && "$published_sha" != "$GITHUB_SHA" ]]; then
            echo "FOODEX $CURRENT_VERSION is already published from $published_sha; refusing to move $tag to $GITHUB_SHA."
            echo "RELEASE_PUBLICATION_SKIPPED=true" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "RELEASE_PUBLICATION_SKIPPED=false" >> "$GITHUB_ENV"

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --title "FOODEX $CURRENT_VERSION" \
              --notes-file "$notes_file"
          elif [[ -n "$published_sha" ]]; then
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "FOODEX $CURRENT_VERSION" \
              --notes-file "$notes_file"
          else
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "FOODEX $CURRENT_VERSION" \
              --notes-file "$notes_file"
          fi

          gh release upload "$tag" \
            "Release/FOODEX-Customer-${CURRENT_VERSION}.apk" \
            "Release/FOODEX-Driver-${CURRENT_VERSION}.apk" \
            "Release/FOODEX-Van-${CURRENT_VERSION}.apk" \
            Release/LATEST_RELEASE.json \
            Release/BUILD_INFO.json \
            Release/FOODEX-Laravel-Setup.zip \
            Release/FRESH_INSTALL_EVIDENCE.json \
            Release/Updates/FOODEX-Update.zip \
            Release/Updates/FOODEX-Update.json \
            Release/Updates/FOODEX-Update.sha256.txt \
            Release/Updates/FOODEX-Update.files.txt \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

          assets="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          grep -Fx "FOODEX-Customer-${CURRENT_VERSION}.apk" <<<"$assets"
          grep -Fx "FOODEX-Driver-${CURRENT_VERSION}.apk" <<<"$assets"
          grep -Fx "FOODEX-Van-${CURRENT_VERSION}.apk" <<<"$assets"
          grep -Fx "LATEST_RELEASE.json" <<<"$assets"
          grep -Fx "BUILD_INFO.json" <<<"$assets"
          grep -Fx "FOODEX-Laravel-Setup.zip" <<<"$assets"
          grep -Fx "FRESH_INSTALL_EVIDENCE.json" <<<"$assets"
          grep -Fx "FOODEX-Update.zip" <<<"$assets"
          grep -Fx "FOODEX-Update.json" <<<"$assets"
          grep -Fx "FOODEX-Update.sha256.txt" <<<"$assets"
          grep -Fx "FOODEX-Update.files.txt" <<<"$assets"

          rm -rf /tmp/foodex-published
          mkdir -p /tmp/foodex-published
          gh release download "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "FOODEX-Driver-${CURRENT_VERSION}.apk" \
            --pattern "FOODEX-Van-${CURRENT_VERSION}.apk" \
            --pattern "LATEST_RELEASE.json" \
            --pattern "BUILD_INFO.json" \
            --pattern "FOODEX-Laravel-Setup.zip" \
            --pattern "FRESH_INSTALL_EVIDENCE.json" \
            --dir /tmp/foodex-published \
            --clobber
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import os

          root = Path("/tmp/foodex-published")
          manifest = json.loads((root / "BUILD_INFO.json").read_text(encoding="utf-8"))
          expected_version = os.environ["CURRENT_VERSION"]
          driver = root / f"FOODEX-Driver-{expected_version}.apk"
          van = root / f"FOODEX-Van-{expected_version}.apk"
          latest = json.loads((root / "LATEST_RELEASE.json").read_text(encoding="utf-8"))
          setup = root / "FOODEX-Laravel-Setup.zip"
          evidence = json.loads((root / "FRESH_INSTALL_EVIDENCE.json").read_text(encoding="utf-8"))
          digest = hashlib.sha256(driver.read_bytes()).hexdigest()
          van_digest = hashlib.sha256(van.read_bytes()).hexdigest()
          expected_build = int(os.environ["MOBILE_BUILD_NUMBER"])
          assert manifest["version"] == expected_version
          assert manifest["driver"]["version"] == expected_version
          assert manifest["driver"]["build_number"] == expected_build
          assert manifest["driver"]["application_id"] == "com.fiftysolution.foodex.driver"
          assert manifest["driver"]["sha256"] == digest
          assert manifest["van"]["version"] == expected_version
          assert manifest["van"]["build_number"] == expected_build
          assert manifest["van"]["application_id"] == "com.foodex.van"
          assert manifest["van"]["sha256"] == van_digest
          assert latest["version"] == expected_version
          assert {item["app"] for item in latest["android_apps"]} == {"customer", "driver", "van"}
          assert manifest["source_commit"] == os.environ["GITHUB_SHA"]
          assert manifest["laravel_setup"]["sha256"] == hashlib.sha256(setup.read_bytes()).hexdigest()
          assert evidence["version"] == expected_version
          assert evidence["source_commit"] == os.environ["GITHUB_SHA"]
          assert manifest["android_signing"] == "flutter-template-debug-key-test-only"
          assert manifest["production_store_ready"] is False
          print("Verified published Driver artifact:", expected_version, expected_build, digest)
          PY

