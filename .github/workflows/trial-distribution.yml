            git add -f Release/Updates/FOODEX-Update.zip
          else
            git add -u -- Release/Updates/FOODEX-Update.zip 2>/dev/null || true
          fi
          if git diff --cached --quiet; then
            echo "Terminal branch already contains the exact generated release artifacts."
            exit 0
          fi
          git commit -m "release: publish terminal FOODEX ${CURRENT_VERSION} artifacts"
          git push origin "HEAD:refs/heads/$final_branch"

