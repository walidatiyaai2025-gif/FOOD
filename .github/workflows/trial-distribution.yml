            local pid_file="$1"
            [[ -f "$pid_file" ]] || return 0
            local pid
            pid="$(cat "$pid_file")"
            if kill -0 "$pid" 2>/dev/null; then
              kill "$pid" 2>/dev/null || true
              for _ in {1..20}; do
                kill -0 "$pid" 2>/dev/null || break
                sleep 0.25
