name: FOODEX Update Bundle

on:
  push:
    branches:
      - "release/**-update"
    paths-ignore:
      - "Release/Updates/**"
      - "docs/release/RELEASE_NOTES.md"
      - "docs/release/UPDATE_NOTES_*.md"
      - "docs/release/RELEASE_REGISTRY.json"
  pull_request:
    branches:
      - main
    paths:
      - VERSION
      - "backend/**"
      - "apps/customer_app/**"
      - "apps/driver_app/**"
      - CHANGELOG.md
      - docs/release/RELEASE_NOTES.md
      - scripts/build-update-bundle.py
      - .github/workflows/release-update-bundle.yml
      - docs/release/RELEASE_REGISTRY.json
      - .github/scripts/release-registry.js

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-update:
    name: Build dashboard update package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject reuse of a version already registered on main
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          node .github/scripts/release-registry.js assert-unpublished origin/main

      - name: Checkout pinned TCPDF runtime
        uses: actions/checkout@v4
        with:
          repository: tecnickcom/TCPDF
          ref: b18f6119161019916c5bb07cb8da5205ae5c1b63
          path: .foodex-thirdparty/tcpdf-source
          persist-credentials: false

      - name: Stage self-contained invoice PDF runtime
        shell: bash
        run: |
          set -euo pipefail
          rm -rf backend/app/ThirdParty/tcpdf
          mkdir -p backend/app/ThirdParty/tcpdf
          rsync -a             --exclude='.git'             --exclude='examples'             --exclude='tests'             --exclude='test'             .foodex-thirdparty/tcpdf-source/             backend/app/ThirdParty/tcpdf/

          # The bundled copy is an invoice-only fallback. TCPDF 6.8+ declares
          # cURL option constants at class-load time. Remove the unused default
          # option arrays so local-only invoice PDF rendering also works when
          # ext-curl is unavailable on a restricted/shared host.
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("backend/app/ThirdParty/tcpdf/include/tcpdf_static.php")
          source = path.read_text(encoding="utf-8")
          source, defaults = re.subn(
              r"protected const CURLOPT_DEFAULT = \[.*?\n    \];",
              "protected const CURLOPT_DEFAULT = [];",
              source,
              count=1,
              flags=re.DOTALL,
          )
          source, fixed = re.subn(
              r"protected const CURLOPT_FIXED = \[.*?\n    \];",
              "protected const CURLOPT_FIXED = [];",
              source,
              count=1,
              flags=re.DOTALL,
          )
          if defaults != 1 or fixed != 1:
              raise SystemExit("Could not patch TCPDF cURL defaults deterministically.")
          path.write_text(source, encoding="utf-8")
          PY

          test -f backend/app/ThirdParty/tcpdf/tcpdf.php
          test -f backend/app/ThirdParty/tcpdf/LICENSE.TXT
          test -f backend/app/ThirdParty/tcpdf/fonts/dejavusans.php
          test -f backend/app/ThirdParty/tcpdf/fonts/dejavusans.z

      - name: Set up Flutter 3.47.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          cache: true

      - name: Build and stage same-origin shared preview runtimes
        shell: bash
        run: |
          set -euo pipefail
          rm -rf backend/public/preview/customer backend/public/preview/driver

          pushd apps/customer_app
          flutter pub get
          flutter build web \
            --release \
            --target=lib/preview_main.dart \
            --base-href=/preview/customer/ \
            --dart-define=FOODEX_PREVIEW_CONTRACT_VERSION=shared-flutter-v1
          popd

          pushd apps/driver_app
          flutter create --platforms=web --project-name foodex_driver_app .
          flutter pub get
          flutter build web \
            --release \
            --target=lib/preview_main.dart \
            --base-href=/preview/driver/ \
            --dart-define=FOODEX_PREVIEW_CONTRACT_VERSION=shared-flutter-v1
          popd

          mkdir -p backend/public/preview
          cp -a apps/customer_app/build/web backend/public/preview/customer
          cp -a apps/driver_app/build/web backend/public/preview/driver

          for runtime in customer driver; do
            test -s "backend/public/preview/${runtime}/index.html"
            test -s "backend/public/preview/${runtime}/main.dart.js"
            test -s "backend/public/preview/${runtime}/flutter_bootstrap.js"
            test -d "backend/public/preview/${runtime}/assets"
            find "backend/public/preview/${runtime}/assets" -type f -print -quit | grep -q .
          done

      - name: Resolve cumulative update boundary
        shell: bash
        env:
          FOODEX_UPDATE_MINIMUM_VERSION: "1.0.6"
        run: |
          set -euo pipefail
          current_version="$(tr -d '[:space:]' < VERSION)"
          minimum_version="$FOODEX_UPDATE_MINIMUM_VERSION"
          update_base_ref=""

          while read -r candidate; do
            candidate_version="$(git show "$candidate":VERSION 2>/dev/null | tr -d '[:space:]' || true)"
            if [[ "$candidate_version" == "$minimum_version" ]]; then
              update_base_ref="$candidate"
              break
            fi
          done < <(git log --format=%H -- VERSION)

          if [[ -z "$update_base_ref" ]]; then
            echo "::error::Cannot resolve VERSION boundary for cumulative minimum $minimum_version."
            exit 1
          fi

          echo "CURRENT_VERSION=$current_version" >> "$GITHUB_ENV"
          echo "MINIMUM_VERSION=$minimum_version" >> "$GITHUB_ENV"
          echo "UPDATE_BASE_REF=$update_base_ref" >> "$GITHUB_ENV"

      - name: Build deterministic FOODEX update
        shell: bash
        run: |
          set -euo pipefail
          release_notes="$(python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ["CURRENT_VERSION"]
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          match = re.search(
              rf"^## {re.escape(version)} - [^\n]+\n(?P<body>.*?)(?=^## |\Z)",
              changelog,
              flags=re.MULTILINE | re.DOTALL,
          )
          if match is None:
              raise SystemExit(f"Missing CHANGELOG entry for {version}")

          bullets = [
              line[2:].strip()
              for line in match.group("body").splitlines()
              if line.startswith("- ")
          ]
          if not bullets:
              raise SystemExit(f"CHANGELOG entry for {version} has no release-note bullets")

          print(f"FOODEX {version}: " + " ".join(bullets))
          PY
          )"

          python3 scripts/build-update-bundle.py \
            --base "$UPDATE_BASE_REF" \
            --target-version "$CURRENT_VERSION" \
            --minimum-current-version "$MINIMUM_VERSION" \
            --output-dir dist/update \
            --release-notes "$release_notes"

      - name: Verify package metadata and recovery contract
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, zipfile
          root = pathlib.Path("dist/update")
          package = root / "FOODEX-Update.zip"
          manifest = json.loads((root / "FOODEX-Update.json").read_text())
          digest = hashlib.sha256(package.read_bytes()).hexdigest()
          import os
          assert manifest["target_version"] == os.environ["CURRENT_VERSION"]
          assert manifest["minimum_current_version"] == os.environ["MINIMUM_VERSION"]
          assert manifest["requires_full_redeploy"] is False
          assert manifest["sha256"] == digest
          mandatory = {
              "backend/app/Domain/Installer/InstallerWorkflow.php",
              "backend/app/Domain/Updater/LaravelUpdateRuntime.php",
              "backend/app/Http/Middleware/RunSchedulerHeartbeat.php",
              "backend/app/Services/SchedulerRuntime.php",
              "backend/app/ThirdParty/tcpdf/tcpdf.php",
              "backend/app/ThirdParty/tcpdf/LICENSE.TXT",
              "backend/app/ThirdParty/tcpdf/fonts/dejavusans.php",
              "backend/app/ThirdParty/tcpdf/fonts/dejavusans.z",
              "backend/bootstrap/app.php",
              "backend/config/foodex.php",
              "backend/public/.htaccess",
              "backend/public/assets/admin/driver-live-map.css",
              "backend/public/assets/admin/driver-live-map.js",
              "backend/public/assets/leaflet/1.9.4/leaflet.css",
              "backend/public/assets/leaflet/1.9.4/leaflet.js",
              "backend/public/assets/leaflet/1.9.4/images/layers-2x.png",
              "backend/public/assets/leaflet/1.9.4/images/layers.png",
              "backend/public/assets/leaflet/1.9.4/images/marker-icon-2x.png",
              "backend/public/assets/leaflet/1.9.4/images/marker-icon.png",
              "backend/public/assets/leaflet/1.9.4/images/marker-shadow.png",
              "backend/public/brand/foodex-economical-group.webp",
              "assets/admin/driver-live-map.css",
              "assets/admin/driver-live-map.js",
              "assets/leaflet/1.9.4/leaflet.css",
              "assets/leaflet/1.9.4/leaflet.js",
              "assets/leaflet/1.9.4/images/layers-2x.png",
              "assets/leaflet/1.9.4/images/layers.png",
              "assets/leaflet/1.9.4/images/marker-icon-2x.png",
              "assets/leaflet/1.9.4/images/marker-icon.png",
              "assets/leaflet/1.9.4/images/marker-shadow.png",
              "brand/foodex-economical-group.webp",
              "backend/routes/console.php",
          }
          with zipfile.ZipFile(package) as archive:
              names = set(archive.namelist())
              assert "VERSION" in names
              missing = sorted(mandatory - names)
              assert not missing, f"Update bundle is missing recovery-critical files: {missing}"
              for runtime in ("customer", "driver"):
                  for prefix in (
                      f"backend/public/preview/{runtime}",
                      f"preview/{runtime}",
                  ):
                      required = {
                          f"{prefix}/index.html",
                          f"{prefix}/main.dart.js",
                          f"{prefix}/flutter_bootstrap.js",
                      }
                      runtime_missing = sorted(required - names)
                      assert not runtime_missing, (
                          f"Update bundle is missing {runtime} preview files at {prefix}: {runtime_missing}"
                      )
                      assert any(
                          name.startswith(f"{prefix}/assets/") and not name.endswith("/")
                          for name in names
                      ), f"Update bundle is missing {runtime} preview assets at {prefix}"
              has_migrations = any(name.startswith("backend/database/migrations/") for name in names)
              assert manifest["contains_migrations"] is has_migrations
              assert not any(name.startswith(("apps/", "Release/", "docs/", ".github/")) for name in names)
              assert not any("/tests/" in name or name.startswith("backend/tests/") for name in names)
          print("Update bundle verified:", digest)
          PY

      - name: Publish generated package to source branch
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        shell: bash
        run: |
          set -euo pipefail
          target_branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          test -n "$target_branch"

          cp dist/update/FOODEX-Update.zip Release/Updates/FOODEX-Update.zip
          cp dist/update/FOODEX-Update.json Release/Updates/FOODEX-Update.json
          cp dist/update/FOODEX-Update.sha256.txt Release/Updates/FOODEX-Update.sha256.txt
          cp dist/update/FOODEX-Update.files.txt Release/Updates/FOODEX-Update.files.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Release/Updates/FOODEX-Update.zip \
                  Release/Updates/FOODEX-Update.json \
                  Release/Updates/FOODEX-Update.sha256.txt \
                  Release/Updates/FOODEX-Update.files.txt
          if git diff --cached --quiet; then
            echo "Generated update package is already published on $target_branch."
          else
            git commit -m "release: publish generated FOODEX ${CURRENT_VERSION} cumulative update bundle"
            git push origin "HEAD:$target_branch"
          fi

      - name: Upload FOODEX update artifact
        uses: actions/upload-artifact@v4
        with:
          name: FOODEX-Update-${{ env.CURRENT_VERSION }}
          path: |
            dist/update/FOODEX-Update.zip
            dist/update/FOODEX-Update.json
            dist/update/FOODEX-Update.sha256.txt
            dist/update/FOODEX-Update.files.txt
          if-no-files-found: error
          retention-days: 30
