name: FOODEX Update Bundle

on:
  push:
    branches:
      - "release/**-update"
    paths-ignore:
      - "Release/Updates/**"
  pull_request:
    branches:
      - main
    paths:
      - VERSION
      - "backend/**"
      - CHANGELOG.md
      - docs/release/RELEASE_NOTES.md
      - scripts/build-update-bundle.py
      - .github/workflows/release-update-bundle.yml

permissions:
  contents: write

jobs:
  build-update:
    name: Build dashboard update package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve cumulative update boundary
        shell: bash
        env:
          FOODEX_UPDATE_MINIMUM_VERSION: "1.0.6"
        run: |
          set -euo pipefail
          current_version="$(tr -d '[:space:]' < VERSION)"
          minimum_version="$FOODEX_UPDATE_MINIMUM_VERSION"
          update_base_ref=""

          while read -r candidate; do
            candidate_version="$(git show "$candidate":VERSION 2>/dev/null | tr -d '[:space:]' || true)"
            if [[ "$candidate_version" == "$minimum_version" ]]; then
              update_base_ref="$candidate"
              break
            fi
          done < <(git log --format=%H -- VERSION)

          if [[ -z "$update_base_ref" ]]; then
            echo "::error::Cannot resolve VERSION boundary for cumulative minimum $minimum_version."
            exit 1
          fi

          echo "CURRENT_VERSION=$current_version" >> "$GITHUB_ENV"
          echo "MINIMUM_VERSION=$minimum_version" >> "$GITHUB_ENV"
          echo "UPDATE_BASE_REF=$update_base_ref" >> "$GITHUB_ENV"

      - name: Build deterministic FOODEX update
        shell: bash
        run: |
          set -euo pipefail
          release_notes="$(python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ["CURRENT_VERSION"]
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          match = re.search(
              rf"^## {re.escape(version)} - [^\n]+\n(?P<body>.*?)(?=^## |\Z)",
              changelog,
              flags=re.MULTILINE | re.DOTALL,
          )
          if match is None:
              raise SystemExit(f"Missing CHANGELOG entry for {version}")

          bullets = [
              line[2:].strip()
              for line in match.group("body").splitlines()
              if line.startswith("- ")
          ]
          if not bullets:
              raise SystemExit(f"CHANGELOG entry for {version} has no release-note bullets")

          print(f"FOODEX {version}: " + " ".join(bullets))
          PY
          )"

          python3 scripts/build-update-bundle.py \
            --base "$UPDATE_BASE_REF" \
            --target-version "$CURRENT_VERSION" \
            --minimum-current-version "$MINIMUM_VERSION" \
            --output-dir dist/update \
            --release-notes "$release_notes"

      - name: Verify package metadata and recovery contract
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, zipfile
          root = pathlib.Path("dist/update")
          package = root / "FOODEX-Update.zip"
          manifest = json.loads((root / "FOODEX-Update.json").read_text())
          digest = hashlib.sha256(package.read_bytes()).hexdigest()
          import os
          assert manifest["target_version"] == os.environ["CURRENT_VERSION"]
          assert manifest["minimum_current_version"] == os.environ["MINIMUM_VERSION"]
          assert manifest["requires_full_redeploy"] is False
          assert manifest["sha256"] == digest
          mandatory = {
              "backend/app/Domain/Installer/InstallerWorkflow.php",
              "backend/app/Domain/Updater/LaravelUpdateRuntime.php",
              "backend/app/Http/Middleware/RunSchedulerHeartbeat.php",
              "backend/app/Services/SchedulerRuntime.php",
              "backend/bootstrap/app.php",
              "backend/config/foodex.php",
              "backend/public/brand/foodex-economical-group.webp",
              "backend/routes/console.php",
          }
          with zipfile.ZipFile(package) as archive:
              names = set(archive.namelist())
              assert "VERSION" in names
              missing = sorted(mandatory - names)
              assert not missing, f"Update bundle is missing recovery-critical files: {missing}"
              has_migrations = any(name.startswith("backend/database/migrations/") for name in names)
              assert manifest["contains_migrations"] is has_migrations
              assert not any(name.startswith(("apps/", "Release/", "docs/", ".github/")) for name in names)
              assert not any("/tests/" in name or name.startswith("backend/tests/") for name in names)
          print("Update bundle verified:", digest)
          PY

      - name: Publish generated package to release branch
        if: github.event_name == 'push'
        run: |
          cp dist/update/FOODEX-Update.zip Release/Updates/FOODEX-Update.zip
          cp dist/update/FOODEX-Update.json Release/Updates/FOODEX-Update.json
          cp dist/update/FOODEX-Update.sha256.txt Release/Updates/FOODEX-Update.sha256.txt
          cp dist/update/FOODEX-Update.files.txt Release/Updates/FOODEX-Update.files.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Release/Updates/FOODEX-Update.zip \
                  Release/Updates/FOODEX-Update.json \
                  Release/Updates/FOODEX-Update.sha256.txt \
                  Release/Updates/FOODEX-Update.files.txt
          if git diff --cached --quiet; then
            echo "Generated update package is already published."
          else
            git commit -m "release: publish generated FOODEX ${CURRENT_VERSION} cumulative update bundle"
            git push origin "HEAD:release/${CURRENT_VERSION}-update"
          fi

      - name: Upload FOODEX update artifact
        uses: actions/upload-artifact@v4
        with:
          name: FOODEX-Update-${{ env.CURRENT_VERSION }}
          path: |
            dist/update/FOODEX-Update.zip
            dist/update/FOODEX-Update.json
            dist/update/FOODEX-Update.sha256.txt
            dist/update/FOODEX-Update.files.txt
          if-no-files-found: error
          retention-days: 30
