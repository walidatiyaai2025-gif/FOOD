name: Customer Hotfix APK 1375

on:
  push:
    branches:
      - fix/1375-customer-hotfix-apk
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build verified Customer hotfix APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/customer_app
    steps:
      - uses: actions/checkout@v7

      - name: Set up Flutter 3.47.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          cache: true

      - name: Prepare Android production identity
        shell: bash
        run: |
          set -euo pipefail
          flutter create --platforms=android --project-name foodex_customer_app .
          python3 ../../scripts/configure-mobile-native.py --app customer --app-dir . --platform android
          rm -f test/widget_test.dart
          flutter pub get

      - name: Format hotfix working tree
        shell: bash
        run: |
          set -euo pipefail
          dart format \
            lib/core/api/customer_action_api.dart \
            lib/core/network/customer_data_mode.dart \
            lib/core/network/customer_low_data_http_client.dart \
            lib/core/routing/customer_router.dart \
            lib/features/auth/unified_customer_auth_screen.dart \
            lib/features/storefront/wholesale_multistore_screens.dart

      - name: Verify hotfix source contract
        shell: bash
        run: |
          set -euo pipefail
          grep -F "crossAxisCount: gridMode ? 3 : 1" lib/features/storefront/wholesale_multistore_screens.dart
          grep -F "user['retail_store_ids']" lib/core/api/customer_action_api.dart
          grep -F "CustomerRouteLocations.retailHome" lib/features/auth/unified_customer_auth_screen.dart
          grep -F "mode == CustomerDataMode.normal ? '0' : '1'" lib/core/network/customer_low_data_http_client.dart

      - name: Analyze Customer app
        run: flutter analyze --no-fatal-infos

      - name: Build Customer release APK
        shell: bash
        env:
          CUSTOMER_FIREBASE_API_KEY: ${{ vars.FOODEX_CUSTOMER_FIREBASE_API_KEY }}
          CUSTOMER_FIREBASE_APP_ID: ${{ vars.FOODEX_CUSTOMER_FIREBASE_APP_ID }}
          CUSTOMER_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FOODEX_CUSTOMER_FIREBASE_MESSAGING_SENDER_ID }}
          CUSTOMER_FIREBASE_PROJECT_ID: ${{ vars.FOODEX_CUSTOMER_FIREBASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          defines=(--dart-define=FOODEX_API_BASE_URL=https://foodex.50sols.com)
          if [[ -n "$CUSTOMER_FIREBASE_API_KEY" && -n "$CUSTOMER_FIREBASE_APP_ID" && -n "$CUSTOMER_FIREBASE_MESSAGING_SENDER_ID" && -n "$CUSTOMER_FIREBASE_PROJECT_ID" ]]; then
            defines+=(--dart-define=FOODEX_FIREBASE_API_KEY="$CUSTOMER_FIREBASE_API_KEY")
            defines+=(--dart-define=FOODEX_FIREBASE_APP_ID="$CUSTOMER_FIREBASE_APP_ID")
            defines+=(--dart-define=FOODEX_FIREBASE_MESSAGING_SENDER_ID="$CUSTOMER_FIREBASE_MESSAGING_SENDER_ID")
            defines+=(--dart-define=FOODEX_FIREBASE_PROJECT_ID="$CUSTOMER_FIREBASE_PROJECT_ID")
          fi
          flutter build apk --release --build-name=1.0.75 --build-number="$GITHUB_RUN_NUMBER" "${defines[@]}"

      - name: Verify APK identity and endpoint
        shell: bash
        run: |
          set -euo pipefail
          apk=build/app/outputs/flutter-apk/app-release.apk
          test -s "$apk"
          python3 ../../scripts/verify-mobile-runtime-endpoint.py "$apk"
          aapt_bin="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          "$aapt_bin" dump badging "$apk" > build/hotfix-badging.txt
          grep -F "package: name='com.fiftysolution.foodex.customer'" build/hotfix-badging.txt
          cp "$apk" build/app/outputs/flutter-apk/FOODEX-Customer-1.0.75-hotfix-1375.apk
          sha256sum build/app/outputs/flutter-apk/FOODEX-Customer-1.0.75-hotfix-1375.apk > build/app/outputs/flutter-apk/FOODEX-Customer-1.0.75-hotfix-1375.apk.sha256

      - name: Upload Customer APK
        uses: actions/upload-artifact@v4
        with:
          name: FOODEX-Customer-1.0.75-hotfix-1375
          path: |
            apps/customer_app/build/app/outputs/flutter-apk/FOODEX-Customer-1.0.75-hotfix-1375.apk
            apps/customer_app/build/app/outputs/flutter-apk/FOODEX-Customer-1.0.75-hotfix-1375.apk.sha256
          if-no-files-found: error
          retention-days: 3
