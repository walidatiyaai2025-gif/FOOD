name: Temporary 1328 Package-Context Dart Formatter

on:
  push:
    branches:
      - feat/1328-orders-tracking
    paths:
      - .github/workflows/format-1328-temporary.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/1328-orders-tracking
          fetch-depth: 0
      - name: Set up Flutter 3.47.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          cache: true
      - name: Canonicalize #1328 test in package context
        shell: bash
        run: |
          set -euo pipefail
          cd apps/customer_app
          dart format test/customer_orders_ui_v3_test.dart
          cd ../..
          git diff -- apps/customer_app/test/customer_orders_ui_v3_test.dart || true
      - name: Commit exact package-context formatter output
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- apps/customer_app/test/customer_orders_ui_v3_test.dart; then
            echo "No formatter delta."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/customer_app/test/customer_orders_ui_v3_test.dart
          git commit -m "style(1328): apply package-context Dart formatter"
          git push origin HEAD:feat/1328-orders-tracking
