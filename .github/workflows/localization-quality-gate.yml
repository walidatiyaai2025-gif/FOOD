name: FOODEX Localization Quality Gate

on:
  workflow_call:
    inputs:
      base_sha:
        required: false
        type: string
      head_sha:
        required: false
        type: string
  pull_request:
    paths:
      - "apps/**"
      - "backend/resources/views/**"
      - "backend/lang/**"
      - "backend/config/ui_translations.php"
      - "scripts/localization-quality-gate.py"
      - "scripts/tests/test_localization_quality_gate.py"
      - ".github/workflows/localization-quality-gate.yml"
  push:
    branches:
      - main
      - "release/**"
    paths:
      - "apps/**"
      - "backend/resources/views/**"
      - "backend/lang/**"
      - "backend/config/ui_translations.php"
      - "scripts/localization-quality-gate.py"
      - "scripts/tests/test_localization_quality_gate.py"
      - ".github/workflows/localization-quality-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: localization-quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  localization-quality:
    name: Arabic / English localization quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up PHP for backend language parity
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none

      - name: Resolve comparison range
        id: range
        shell: bash
        env:
          INPUT_BASE: ${{ inputs.base_sha }}
          INPUT_HEAD: ${{ inputs.head_sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail

          head="${INPUT_HEAD:-}"
          base="${INPUT_BASE:-}"

          if [[ -z "$head" ]]; then
            head="${PR_HEAD:-}"
          fi
          if [[ -z "$head" ]]; then
            head="$GITHUB_SHA"
          fi

          if [[ -z "$base" ]]; then
            base="${PR_BASE:-}"
          fi
          if [[ -z "$base" && -n "${PUSH_BEFORE:-}" && ! "${PUSH_BEFORE}" =~ ^0+$ ]]; then
            base="$PUSH_BEFORE"
          fi
          if [[ -z "$base" ]]; then
            base="$(git rev-parse "$head^" 2>/dev/null || git rev-parse "$head")"
          fi

          git cat-file -e "$base^{commit}"
          git cat-file -e "$head^{commit}"

          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "head=$head" >> "$GITHUB_OUTPUT"
          echo "Localization comparison: $base..$head"

      - name: Test localization gate
        run: python3 -m unittest discover -s scripts/tests -p 'test_localization_quality_gate.py'

      - name: Enforce AR/EN localization contract
        run: |
          python3 scripts/localization-quality-gate.py \
            --base "${{ steps.range.outputs.base }}" \
            --head "${{ steps.range.outputs.head }}"
