name: Driver App CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  flutter:
    name: Driver Flutter validation
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: apps/driver_app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter 3.47.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          cache: true

      - name: Prepare Android/iOS scaffolding
        run: flutter create --platforms=android,ios --project-name foodex_driver_app .

      - name: Remove generated default widget test
        run: rm -f test/widget_test.dart

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Android release-mode validation build
        run: flutter build apk --release --build-number="$GITHUB_RUN_NUMBER" --dart-define=FOODEX_API_BASE_URL=https://foodex-validation.invalid

      - name: Package Android validation evidence
        working-directory: .
        run: python3 scripts/package-mobile-artifact.py --app driver --platform android --input apps/driver_app/build/app/outputs/flutter-apk/app-release.apk --build-number "$GITHUB_RUN_NUMBER" --commit "$GITHUB_SHA" --output artifacts

      - name: Upload Android validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: foodex-driver-android-release-validation
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

  ios-validate:
    name: Driver iOS no-codesign validation
    runs-on: macos-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: apps/driver_app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter 3.47.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          cache: true

      - name: Prepare iOS scaffolding
        run: flutter create --platforms=ios --project-name foodex_driver_app .

      - name: Resolve dependencies
        run: flutter pub get

      - name: iOS release-mode validation without codesign
        run: flutter build ios --release --no-codesign --build-number="$GITHUB_RUN_NUMBER" --dart-define=FOODEX_API_BASE_URL=https://foodex-validation.invalid

      - name: Archive unsigned iOS app
        run: ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app build/ios/iphoneos/Runner.app.zip

      - name: Package iOS validation evidence
        working-directory: .
        run: python3 scripts/package-mobile-artifact.py --app driver --platform ios --input apps/driver_app/build/ios/iphoneos/Runner.app.zip --build-number "$GITHUB_RUN_NUMBER" --commit "$GITHUB_SHA" --output artifacts

      - name: Upload unsigned iOS validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: foodex-driver-ios-release-validation
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
