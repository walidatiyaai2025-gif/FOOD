name: Driver App CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  scope:
    name: Driver build scope
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.scope.outputs.android }}
      ios: ${{ steps.scope.outputs.ios }}
      web_preview: ${{ steps.scope.outputs.web_preview }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: scope
        name: Resolve changed platform scope
        run: python3 scripts/mobile-ci-scope.py --app driver --base "${{ github.event.pull_request.base.sha }}" --head "${{ github.event.pull_request.head.sha }}" --github-output "$GITHUB_OUTPUT"

  fast:
    name: Driver Flutter fast-fail
    runs-on: ubuntu-latest
    timeout-minutes: 18
    defaults:
      run:
        working-directory: apps/driver_app
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Flutter 3.47.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Strict changed-file Dart analysis
        shell: bash
        run: bash ../../scripts/flutter-changed-analysis.sh driver "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
      - name: Analyze first
        run: flutter analyze --no-fatal-infos
      - name: Test before builds
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tests < <(find test -type f -name '*_test.dart' ! -name 'screenshot_evidence_test.dart' -print)
          if (("${#tests[@]}" > 0)); then
            flutter test "${tests[@]}"
          fi

  build:
    name: Driver platform builds
    needs: [scope, fast]
    uses: ./.github/workflows/mobile-build-validation.yml
    with:
      app: driver
      project: foodex_driver_app
      label: Driver
      run_android: ${{ needs.scope.outputs.android == 'true' }}
      run_ios: ${{ needs.scope.outputs.ios == 'true' }}
      run_web_preview: ${{ needs.scope.outputs.web_preview == 'true' }}
