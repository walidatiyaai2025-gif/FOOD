name: Driver App CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  fast:
    name: Driver Flutter fast-fail
    runs-on: ubuntu-latest
    timeout-minutes: 18
    defaults:
      run:
        working-directory: apps/driver_app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter 3.47.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze first
        run: flutter analyze

      - name: Test before builds
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tests < <(find test -type f -name '*_test.dart' ! -name 'screenshot_evidence_test.dart' -print)
          if (("${#tests[@]}" > 0)); then
            flutter test "${tests[@]}"
          fi

  flutter:
    name: Driver Android validation
    needs: fast
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: apps/driver_app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter 3.47.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          cache: true

      - name: Prepare Android/iOS scaffolding
        run: |
          flutter create --platforms=android,ios --project-name foodex_driver_app .
          python3 ../../scripts/configure-mobile-native.py --app driver --app-dir . --platform all

      - name: Remove generated default widget test
        run: rm -f test/widget_test.dart

      - name: Resolve dependencies
        run: flutter pub get

      - name: Android release-mode validation build
        run: flutter build apk --release --build-number="$GITHUB_RUN_NUMBER" --dart-define=FOODEX_API_BASE_URL=https://foodex.50sols.com

      - name: Verify embedded production API endpoint
        working-directory: .
        run: python3 scripts/verify-mobile-runtime-endpoint.py apps/driver_app/build/app/outputs/flutter-apk/app-release.apk

      - name: Verify Android release network permission and native brand
        shell: bash
        run: |
          set -euo pipefail
          aapt_bin="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$aapt_bin"
          apk=build/app/outputs/flutter-apk/app-release.apk
          "$aapt_bin" dump permissions "$apk" > build/release-permissions.txt
          grep -Fx "uses-permission: name='android.permission.INTERNET'" build/release-permissions.txt
          grep -Fx "uses-permission: name='android.permission.ACCESS_COARSE_LOCATION'" build/release-permissions.txt
          grep -Fx "uses-permission: name='android.permission.ACCESS_FINE_LOCATION'" build/release-permissions.txt
          grep -Fx "uses-permission: name='android.permission.FOREGROUND_SERVICE'" build/release-permissions.txt
          grep -Fx "uses-permission: name='android.permission.FOREGROUND_SERVICE_LOCATION'" build/release-permissions.txt
          if grep -Fq "android.permission.ACCESS_BACKGROUND_LOCATION" build/release-permissions.txt; then
            echo "Driver active-delivery background path must not request broad background-location permission." >&2
            exit 1
          fi
          "$aapt_bin" dump xmltree "$apk" AndroidManifest.xml > build/release-manifest-tree.txt
          grep -F "com.baseflow.geolocator.GeolocatorLocationService" build/release-manifest-tree.txt
          grep -F "android:foregroundServiceType" build/release-manifest-tree.txt | grep -F "0x8"
          "$aapt_bin" dump badging "$apk" > build/release-badging.txt
          grep -Fx "application-label:'FOODEX Driver'" build/release-badging.txt
          grep -F "package: name='com.fiftysolution.foodex.driver'" build/release-badging.txt

      - name: Package Android validation evidence
        working-directory: .
        run: python3 scripts/package-mobile-artifact.py --app driver --platform android --input apps/driver_app/build/app/outputs/flutter-apk/app-release.apk --build-number "$GITHUB_RUN_NUMBER" --commit "$GITHUB_SHA" --output artifacts

      - name: Upload Android validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: foodex-driver-android-release-validation
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

  ios-validate:
    name: Driver iOS no-codesign validation
    needs: fast
    runs-on: macos-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: apps/driver_app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter 3.47.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          cache: true

      - name: Prepare iOS scaffolding
        run: |
          flutter create --platforms=ios --project-name foodex_driver_app .
          python3 ../../scripts/configure-mobile-native.py --app driver --app-dir . --platform ios

      - name: Apply approved iOS native display name
        run: /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName FOODEX Driver" ios/Runner/Info.plist

      - name: Resolve dependencies
        run: flutter pub get

      - name: iOS release-mode validation without codesign
        run: flutter build ios --release --no-codesign --build-number="$GITHUB_RUN_NUMBER" --dart-define=FOODEX_API_BASE_URL=https://foodex.50sols.com

      - name: Verify iOS native brand
        shell: bash
        run: |
          set -euo pipefail
          plist=build/ios/iphoneos/Runner.app/Info.plist
          test -f "$plist"
          actual="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$plist")"
          test "$actual" = "FOODEX Driver"
          bundle="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")"
          test "$bundle" = "com.fiftysolution.foodex.driver"
          location_usage="$(/usr/libexec/PlistBuddy -c 'Print :NSLocationWhenInUseUsageDescription' "$plist")"
          test -n "$location_usage"
          echo "$location_usage" | grep -F "FOODEX Driver"
          /usr/libexec/PlistBuddy -c 'Print :UIBackgroundModes' "$plist" > build/ios-background-modes.txt
          grep -F "location" build/ios-background-modes.txt
          if /usr/libexec/PlistBuddy -c 'Print :NSLocationAlwaysAndWhenInUseUsageDescription' "$plist" >/dev/null 2>&1; then
            echo "Driver active-delivery path must not request Always location unless it becomes technically required." >&2
            exit 1
          fi

      - name: Archive unsigned iOS app
        run: ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app build/ios/iphoneos/Runner.app.zip

      - name: Package iOS validation evidence
        working-directory: .
        run: python3 scripts/package-mobile-artifact.py --app driver --platform ios --input apps/driver_app/build/ios/iphoneos/Runner.app.zip --build-number "$GITHUB_RUN_NUMBER" --commit "$GITHUB_SHA" --output artifacts

      - name: Upload unsigned iOS validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: foodex-driver-ios-release-validation
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
