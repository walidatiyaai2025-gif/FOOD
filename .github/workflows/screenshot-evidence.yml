name: FOODEX Runtime Screenshot Evidence
# Dedicated runtime evidence workflow for issue #175

on:
  workflow_call:
  workflow_dispatch:


permissions:
  contents: write

jobs:
  capture:
    if: ${{ !contains(github.event.head_commit.message || '', '[screenshots generated]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout evidence branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Detect committed runtime evidence
        id: committed-evidence
        shell: bash
        run: |
          set -euo pipefail
          png_count="$(git ls-tree -r --name-only HEAD ScreenShots | grep -c '\.png
      - name: Remove stale runtime PNGs
        shell: bash
        run: find ScreenShots -type f -name '*.png' -delete

      - name: Set up Flutter 3.47.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          cache: true

      - name: Capture Customer runtime screenshots
        working-directory: apps/customer_app
        run: |
          flutter pub get
          flutter test test/screenshot_evidence_test.dart --timeout 45s --reporter expanded

      - name: Capture Driver runtime screenshots
        working-directory: apps/driver_app
        run: |
          flutter pub get
          flutter test test/screenshot_evidence_test.dart

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, intl, pdo_sqlite
          coverage: none

      - name: Install backend dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare deterministic web evidence database
        working-directory: backend
        shell: bash
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
          CACHE_STORE: array
          QUEUE_CONNECTION: sync
          SESSION_DRIVER: file
        run: |
          cp .env.example .env
          php artisan key:generate
          rm -f database/database.sqlite
          touch database/database.sqlite
          php artisan migrate:fresh --force
          php artisan db:seed --class=Database\\Seeders\\ScreenshotEvidenceSeeder --force

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start FOODEX web runtime
        working-directory: backend
        shell: bash
        env:
          APP_ENV: local
          APP_URL: http://127.0.0.1:8000
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
          CACHE_STORE: array
          QUEUE_CONNECTION: sync
          SESSION_DRIVER: file
        run: |
          php artisan serve --host=127.0.0.1 --port=8000 > /tmp/foodex-screenshot-server.log 2>&1 &
          echo $! > /tmp/foodex-screenshot-server.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/foodex-screenshot-server.log
          exit 1

      - name: Capture Web runtime screenshots
        working-directory: backend
        env:
          FOODEX_SCREENSHOT_BASE_URL: http://127.0.0.1:8000
        run: node ../scripts/capture_web_screenshots.mjs

      - name: Build evidence manifest and verify branding
        shell: bash
        run: |
          python3 -m pip install --disable-pip-version-check pillow
          GITHUB_SHA="$GITHUB_SHA" python3 scripts/update_screenshot_manifest.py

      - name: Upload screenshot evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: foodex-runtime-screenshots
          path: ScreenShots/
          if-no-files-found: error
          retention-days: 30

      - name: Commit generated runtime evidence
        if: ${{ github.event_name == 'pull_request' && steps.committed-evidence.outputs.present != 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          # The evidence commit triggers one final PR validation run. That run
          # must validate the regenerated screenshots without creating a loop.
          if git log -1 --pretty=%B | grep -Fq '[screenshots generated]'; then
            echo "Current PR head is already the generated evidence commit; validation-only run."
            exit 0
          fi

          git config user.name "foodex-screenshot-bot"
          git config user.email "foodex-screenshot-bot@users.noreply.github.com"
          git add ScreenShots
          if git diff --cached --quiet; then
            echo "No screenshot evidence changes."
            exit 0
          fi
          git commit -m "test: add verified runtime screenshot evidence [screenshots generated]"
          git push origin "HEAD:${{ github.head_ref }}"
 || true)"
          if [[ "$png_count" -ge 110 ]] && git cat-file -e HEAD:ScreenShots/AUDIT.md && git cat-file -e HEAD:ScreenShots/SCREENSHOT_MANIFEST.csv; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Committed runtime PNG count: $png_count"


      - name: Remove stale runtime PNGs
        shell: bash
        run: find ScreenShots -type f -name '*.png' -delete

      - name: Set up Flutter 3.47.5
