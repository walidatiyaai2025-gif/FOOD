name: FOODEX Platform Customer Commerce E2E

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-validation:
    name: Backend + MySQL commerce validation
    if: ${{ github.event_name == 'workflow_dispatch' || github.head_ref == 'test/414-platform-customer-commerce-e2e' || startsWith(github.head_ref, 'feat/436-') || startsWith(github.head_ref, 'test/682-') || startsWith(github.head_ref, 'feat/683-') || startsWith(github.head_ref, 'test/725-') || startsWith(github.head_ref, 'test/743-') || startsWith(github.head_ref, 'test/775-') || startsWith(github.head_ref, 'test/873-') }}
    uses: ./.github/workflows/backend-ci.yml

  customer-validation:
    name: Customer Android/iOS commerce validation
    if: ${{ github.event_name == 'workflow_dispatch' || github.head_ref == 'test/414-platform-customer-commerce-e2e' || startsWith(github.head_ref, 'feat/436-') || startsWith(github.head_ref, 'test/682-') || startsWith(github.head_ref, 'feat/683-') || startsWith(github.head_ref, 'test/725-') || startsWith(github.head_ref, 'test/743-') || startsWith(github.head_ref, 'test/775-') || startsWith(github.head_ref, 'test/873-') }}
    uses: ./.github/workflows/customer-app-ci.yml

  driver-validation:
    name: Driver Android/iOS commerce validation
    if: ${{ github.event_name == 'workflow_dispatch' || github.head_ref == 'test/414-platform-customer-commerce-e2e' || startsWith(github.head_ref, 'feat/436-') || startsWith(github.head_ref, 'test/682-') || startsWith(github.head_ref, 'feat/683-') || startsWith(github.head_ref, 'test/725-') || startsWith(github.head_ref, 'test/743-') || startsWith(github.head_ref, 'test/775-') || startsWith(github.head_ref, 'test/873-') }}
    uses: ./.github/workflows/driver-app-ci.yml

  runtime-evidence:
    name: Runtime screenshot evidence
    if: ${{ github.event_name == 'workflow_dispatch' || github.head_ref == 'test/414-platform-customer-commerce-e2e' || startsWith(github.head_ref, 'feat/436-') || startsWith(github.head_ref, 'test/682-') || startsWith(github.head_ref, 'feat/683-') || startsWith(github.head_ref, 'test/725-') || startsWith(github.head_ref, 'test/743-') || startsWith(github.head_ref, 'test/775-') || startsWith(github.head_ref, 'test/873-') }}
    uses: ./.github/workflows/screenshot-evidence.yml

  release-gate:
    name: Platform Customer commerce release gate
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || github.head_ref == 'test/414-platform-customer-commerce-e2e' || startsWith(github.head_ref, 'feat/436-') || startsWith(github.head_ref, 'test/682-') || startsWith(github.head_ref, 'feat/683-') || startsWith(github.head_ref, 'test/725-') || startsWith(github.head_ref, 'test/743-') || startsWith(github.head_ref, 'test/775-') || startsWith(github.head_ref, 'test/873-')) }}
    needs:
      - backend-validation
      - customer-validation
      - driver-validation
      - runtime-evidence
    runs-on: ubuntu-latest
    steps:
      - name: Require every release surface to pass
        shell: bash
        env:
          BACKEND_RESULT: ${{ needs.backend-validation.result }}
          CUSTOMER_RESULT: ${{ needs.customer-validation.result }}
          DRIVER_RESULT: ${{ needs.driver-validation.result }}
          EVIDENCE_RESULT: ${{ needs.runtime-evidence.result }}
        run: |
          set -euo pipefail
          for pair in             "backend:$BACKEND_RESULT"             "customer:$CUSTOMER_RESULT"             "driver:$DRIVER_RESULT"             "runtime-evidence:$EVIDENCE_RESULT"; do
            name="${pair%%:*}"
            result="${pair#*:}"
            if [[ "$result" != "success" ]]; then
              echo "::error::$name release evidence did not pass (result: $result)"
              exit 1
            fi
          done

      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release identity and journey evidence contracts
        shell: bash
        run: |
          set -euo pipefail
          bash ./scripts/release-readiness.sh

          grep -Fq 'test_retail_origin_registration_materializes_source_retail_and_wholesale_with_store_default_tier' backend/tests/Feature/PlatformCustomerRegistrationOriginTest.php
          grep -Fq 'test_platform_customer_orders_aggregate_wholesale_and_retail_with_store_provenance' backend/tests/Feature/PlatformCustomerUnifiedOrdersTest.php
          grep -Fq 'test_platform_customer_order_detail_rejects_foreign_customer_and_store_channel_tampering' backend/tests/Feature/PlatformCustomerUnifiedOrdersTest.php
          grep -Fq 'test_checkout_reprices_live_price_and_historical_snapshot_does_not_drift' backend/tests/Feature/AuthoritativePricingQuoteTest.php
          grep -Fq 'test_wholesale_order_keeps_tier_and_price_snapshot_after_tier_changes' backend/tests/Feature/AuthoritativePricingQuoteTest.php
          grep -Fq 'test_super_admin_sees_exact_origin_and_all_materialized_retail_stores' backend/tests/Feature/DashboardCustomer360Test.php
          grep -Fq 'test_retail_dashboard_quote_and_multiline_invoice_are_authoritative' backend/tests/Feature/DashboardOrderManagementTest.php
          grep -Fq 'test_wholesale_dashboard_quote_uses_selected_warehouse_and_tier_for_multiple_lines' backend/tests/Feature/DashboardOrderManagementTest.php
          grep -Fq 'test_assigned_driver_receives_safe_invoice_and_note_timeline_only_for_own_assignment' backend/tests/Feature/DriverInvoiceNotificationTest.php
          grep -Fq 'test_retail_operational_notifications_are_store_scoped_deduplicated_and_have_authorized_deep_links' backend/tests/Feature/DriverInvoiceNotificationTest.php
          grep -Fq "B2B product details render authoritative account pricing and inventory" apps/customer_app/test/b2b_journey_test.dart
          grep -Fq "NEW Retail home keeps explicit store context in every intent" apps/customer_app/test/retail_catalog_new_only_test.dart
          grep -Fq "new detail preserves assigned invoice access" apps/driver_app/test/driver_active_journey_test.dart
          grep -Fq "new journey keeps the backend channel boundary" apps/driver_app/test/driver_active_journey_test.dart
          grep -Fq "customer app renders English LTR from the bilingual catalog" apps/customer_app/test/localization_test.dart
          grep -Fq "driver app renders English LTR from the bilingual catalog" apps/driver_app/test/localization_test.dart

      - name: Verify Customer UI V3 full-journey convergence evidence
        if: ${{ startsWith(github.head_ref, 'test/725-') || startsWith(github.head_ref, 'test/743-') || startsWith(github.head_ref, 'test/775-') || startsWith(github.head_ref, 'test/873-') }}
        shell: bash
        run: |
          set -euo pipefail

          test -f apps/customer_app/test/customer_ui_v3_visual_acceptance_inventory_test.dart
          grep -Fq 'locks AR/EN, phone widths, text scale, state and motion coverage' apps/customer_app/test/customer_ui_v3_visual_acceptance_inventory_test.dart

          grep -Fq 'Customer UI V3 exposes the approved central visual tokens' apps/customer_app/test/customer_ui_v3_design_system_test.dart
          grep -Fq 'reduced-motion media settings collapse V3 motion durations' apps/customer_app/test/customer_ui_v3_design_system_test.dart
          grep -Fq 'Customer UI V3 home keeps store-scoped actions usable on narrow RTL layout' apps/customer_app/test/customer_ui_v3_shell_home_test.dart
          grep -Fq 'V3 product browse is RTL-safe at 360px and preserves store/query intents' apps/customer_app/test/customer_ui_v3_browse_test.dart
          grep -Fq 'cart V3 fits narrow RTL layout with larger text' apps/customer_app/test/retail_commerce_test.dart
          grep -Fq 'orders tabs keep V3 hierarchy under RTL and larger text' apps/customer_app/test/customer_orders_ui_v3_test.dart
          grep -Fq 'notification and address empty states use V3 state primitives' apps/customer_app/test/customer_account_surfaces_test.dart

          grep -Fq 'CustomerRetailShell(' apps/customer_app/lib/features/retail/retail_customer_journey_screen.dart
          grep -Fq 'RetailHomeV3Screen(' apps/customer_app/lib/features/retail/retail_customer_journey_screen.dart
          grep -Fq 'CustomerProductCard(' apps/customer_app/lib/features/retail/catalog/retail_catalog_screens.dart

          grep -Fq '/home?channel=retail&store_id=7' apps/customer_app/test/screenshot_evidence_test.dart
          grep -Fq '/products?channel=retail&store_id=7' apps/customer_app/test/screenshot_evidence_test.dart
          grep -Fq '/cart?channel=retail&store_id=7' apps/customer_app/test/screenshot_evidence_test.dart
          grep -Fq '/orders/101/track?channel=retail&store_id=7' apps/customer_app/test/screenshot_evidence_test.dart
          grep -Fq '/profile?channel=retail&store_id=7' apps/customer_app/test/screenshot_evidence_test.dart

      - name: Verify Commerce Isolation A-H/J convergence evidence
        if: ${{ startsWith(github.head_ref, 'test/743-') || startsWith(github.head_ref, 'test/775-') || startsWith(github.head_ref, 'test/873-') }}
        shell: bash
        run: |
          set -euo pipefail

          # A — authoritative Retail Merchant identity + self-store guard.
          grep -Fq 'test_self_store_guard_blocks_existing_customer_cart_profile_and_checkout_paths' backend/tests/Feature/RetailMerchantIdentityIsolationTest.php
          grep -Fq 'test_owned_store_block_is_multi_store_scoped_and_platform_customer_identity_is_not_duplicated' backend/tests/Feature/RetailMerchantIdentityIsolationTest.php

          # B — Platform Home Retail placement and exact Retail entry.
          grep -Fq 'test_retail_merchant_own_store_is_hidden_and_direct_browse_is_forbidden' backend/tests/Feature/PlatformCustomerMarketplaceTest.php
          grep -Fq 'marketplace loads guest platform storefront and opens exact retail store' apps/customer_app/test/platform_marketplace_home_test.dart
          grep -Fq 'authenticated retail browse carries bearer token without changing guest routes' apps/customer_app/test/guest_browsing_policy_test.dart

          # C — authoritative order ownership and operational inbox isolation.
          grep -Fq 'test_super_admin_operational_inbox_defaults_to_wholesale_and_requires_explicit_retail_channel' backend/tests/Feature/OrderOperationsIsolationTest.php
          grep -Fq 'test_retail_admin_cannot_operate_foreign_order_but_can_transition_own_order' backend/tests/Feature/OrderOperationsIsolationTest.php

          # D — B2B/B2C address books and checkout options do not cross.
          grep -Fq 'test_b2b_and_b2c_address_books_and_checkout_options_do_not_cross_over' backend/tests/Feature/PlatformCustomerAddressTest.php
          grep -Fq 'address books are separate authenticated B2B and B2C routes' apps/customer_app/test/multistore_route_partition_test.dart

          # E — authoritative Wholesale order history and delivery timeline.
          grep -Fq 'test_b2b_order_detail_exposes_authoritative_customer_safe_delivery_timeline' backend/tests/Feature/OrderDomainTest.php
          grep -Fq 'test_b2b_failed_delivery_exposes_reason_code_without_driver_note' backend/tests/Feature/OrderDomainTest.php
          grep -Fq 'B2B wholesale orders list renders seller state and opens exact detail' apps/customer_app/test/b2b_journey_test.dart
          grep -Fq 'B2B order timeline renders only authoritative events and refreshes state' apps/customer_app/test/b2b_journey_test.dart

          # F — Driver channel/store tenant isolation.
          grep -Fq 'test_retail_driver_cannot_cross_store_even_when_channel_matches' backend/tests/Feature/DriverAssignmentLifecycleTest.php
          grep -Fq 'test_cross_channel_assignment_and_execution_are_denied' backend/tests/Feature/DriverAssignmentLifecycleTest.php
          grep -Fq 'HTTP auth derives exact driver channel from backend roles' apps/driver_app/test/driver_runtime_integration_test.dart
          grep -Fq 'retail preview context enforces exact store and channel scope' apps/driver_app/test/driver_preview_runtime_test.dart

          # G — converged production Driver shell + authoritative Assignment Details actions.
          grep -Fq 'Assignment Details drives authoritative accepted pickup and delivery-start states' apps/driver_app/test/driver_active_journey_test.dart
          grep -Fq 'new journey keeps the backend channel boundary' apps/driver_app/test/driver_active_journey_test.dart
          grep -Fq 'production Driver runtime is new-only and legacy cannot be rewired' apps/driver_app/test/driver_new_only_wiring_test.dart

          # H — exact notification audience, scope, dedupe and deep-link reauthorization.
          grep -Fq 'test_retail_operational_events_reach_exact_store_audience_not_platform_super_admin' backend/tests/Feature/NotificationAudienceIsolationTest.php
          grep -Fq 'test_unified_customer_reads_exact_b2b_and_b2c_lifecycle_contexts' backend/tests/Feature/NotificationAudienceIsolationTest.php
          grep -Fq 'test_revoked_driver_notification_is_visible_but_cannot_authorize_assignment_open' backend/tests/Feature/NotificationAudienceIsolationTest.php
          grep -Fq 'revoked assignment notification never opens order detail' apps/driver_app/test/driver_notification_page_test.dart

          # J — App Preview auto-launches Published Guest and exact first eligible Driver.
          grep -Fq 'test_preview_center_defaults_to_customer_published_auto_launch_contract' backend/tests/Feature/AppPreviewDashboardTest.php
          grep -Fq 'test_driver_discovery_is_deterministic_and_exact_store_scoped_for_auto_launch' backend/tests/Feature/AppPreviewDashboardBridgeTest.php

      - name: Verify #734 release identity and independent acceptance guard
        if: ${{ startsWith(github.head_ref, 'test/743-') || startsWith(github.head_ref, 'test/775-') || startsWith(github.head_ref, 'test/873-') }}
        shell: bash
        run: |
          set -euo pipefail
          bash ./scripts/commerce-isolation-acceptance.sh

      - name: Verify PCX-09 address and lifecycle evidence contracts
        if: ${{ startsWith(github.head_ref, 'feat/436-') || startsWith(github.ref_name, 'feat/436-') }}
        shell: bash
        run: |
          set -euo pipefail

          test -f backend/database/migrations/2026_09_29_180000_unify_platform_customer_addresses.php
          test -f backend/database/migrations/2026_09_29_190000_snapshot_order_delivery_addresses.php
          test -f backend/database/migrations/2026_09_29_200000_link_push_delivery_logs_to_notifications.php

          grep -Fq 'test_platform_customer_has_one_cross_channel_address_book_with_precise_location' backend/tests/Feature/PlatformCustomerAddressTest.php
          grep -Fq 'test_geographic_location_sources_require_real_coordinate_pairs' backend/tests/Feature/PlatformCustomerAddressTest.php
          grep -Fq 'test_platform_customer_cannot_access_another_platform_customers_address' backend/tests/Feature/PlatformCustomerAddressTest.php
          grep -Fq 'test_retail_admin_can_fully_manage_visible_customer_addresses_only' backend/tests/Feature/DashboardCustomer360Test.php
          grep -Fq 'test_order_detail_shows_immutable_delivery_address_and_map_action' backend/tests/Feature/OrderOperationsIsolationTest.php
          grep -Fq 'test_driver_payload_uses_immutable_order_delivery_snapshot' backend/tests/Feature/DriverAssignmentLifecycleTest.php
          grep -Fq 'test_dashboard_status_transition_notifies_the_order_customer' backend/tests/Feature/OrderOperationsIsolationTest.php
          grep -Fq 'test_dashboard_cancellation_revokes_driver_and_notifies_customer_and_driver' backend/tests/Feature/OrderOperationsIsolationTest.php
          grep -Fq 'test_customer_and_driver_notifications_are_user_scoped_deduplicated_and_queued' backend/tests/Feature/OrderLifecycleNotificationTest.php
          grep -Fq 'test_order_routing_metadata_is_forwarded_to_fcm_data_payload' backend/tests/Feature/PushLifecyclePayloadTest.php
          grep -Fq 'test_transient_failure_retries_without_resending_after_success' backend/tests/Feature/PushLifecyclePayloadTest.php
          grep -Fq 'test_unregistered_fcm_token_is_revoked_and_not_retried' backend/tests/Feature/PushLifecyclePayloadTest.php
          grep -Fq 'test_push_token_refresh_revokes_only_the_previous_token_for_same_installation' backend/tests/Feature/EngagementOpsIsolationTest.php

          grep -Fq 'B2B profile is the complete visible account and finance hub' apps/customer_app/test/b2b_journey_test.dart
          grep -Fq 'address book saves authoritative GPS location with address' apps/customer_app/test/customer_account_surfaces_test.dart
          grep -Fq "customer-address-map" apps/customer_app/lib/features/customer_account/customer_address_book_screen.dart
          grep -Fq "location_source': source" apps/customer_app/lib/features/customer_account/customer_address_book_screen.dart
          grep -Fq 'B2C account API posts explicit set-default address action' apps/customer_app/test/b2c_account_api_test.dart
          grep -Fq 'notification routes are constrained to authorized customer destinations' apps/customer_app/test/firebase_push_service_test.dart
          grep -Fq 'device registry revokes authenticated customer push device' apps/customer_app/test/firebase_push_service_test.dart

          grep -Fq 'detail renders authoritative data and immutable navigation target' apps/driver_app/test/driver_active_journey_test.dart
          grep -Fq 'push focus refetches and opens only the exact assignment' apps/driver_app/test/driver_active_journey_test.dart
          grep -Fq 'driver local notification payload restores safe assignment routing' apps/driver_app/test/firebase_push_service_test.dart
          grep -Fq 'device registry revokes authenticated driver push device' apps/driver_app/test/firebase_push_service_test.dart

          grep -Fq 'capture My Addresses edit with location' apps/customer_app/test/screenshot_evidence_test.dart

      - name: Verify CJ-V2 Guest integrated acceptance
        if: ${{ startsWith(github.head_ref, 'test/682-') || startsWith(github.head_ref, 'feat/683-') || startsWith(github.head_ref, 'test/725-') || startsWith(github.head_ref, 'test/743-') || startsWith(github.head_ref, 'test/775-') || startsWith(github.head_ref, 'test/873-') }}
        shell: bash
        run: |
          set -euo pipefail
          test -f apps/customer_app/test/e2e/guest_customer_journey_contract_test.dart
          if grep -Fq 'skip:' apps/customer_app/test/e2e/guest_customer_journey_contract_test.dart; then
            echo "::error::CJ-V2 Guest integrated acceptance still contains skipped gates"
            exit 1
          fi

          grep -Fq 'catalog requests keep exact Retail store context at every boundary' apps/customer_app/test/e2e/guest_customer_journey_contract_test.dart
          grep -Fq 'guest cart tokens never cross Retail stores' apps/customer_app/test/e2e/guest_customer_journey_contract_test.dart
          grep -Fq 'guest session restores the same store cart after app restart' apps/customer_app/test/e2e/guest_customer_journey_contract_test.dart
          grep -Fq 'guest Login or Register returns to checkout and merges cart exactly once' apps/customer_app/test/e2e/guest_customer_journey_contract_test.dart
          grep -Fq 'checkout uses backend-supported address and payment options' apps/customer_app/test/e2e/guest_customer_journey_contract_test.dart
          grep -Fq 'checkout retry keeps one order identity and stable idempotency key' apps/customer_app/test/e2e/guest_customer_journey_contract_test.dart
          grep -Fq 'order lifecycle push refetches authoritative order state' apps/customer_app/test/e2e/guest_customer_journey_contract_test.dart
          grep -Fq 'authenticated multi-store and Wholesale smoke regressions stay isolated' apps/customer_app/test/e2e/guest_customer_journey_contract_test.dart
          grep -Fq 'test_checkout_idempotency_replays_same_order_and_rejects_changed_payload' backend/tests/Feature/CheckoutDomainTest.php
          grep -Fq 'test_retail_registration_notifies_only_authorized_store_audience_and_is_deduplicated' backend/tests/Feature/PlatformCustomerOperationalNotificationTest.php
          grep -Fq 'test_wholesale_registration_notifies_b2b_audience_and_login_never_reemits_registration' backend/tests/Feature/PlatformCustomerOperationalNotificationTest.php
          grep -Fq 'test_platform_customer_orders_aggregate_wholesale_and_retail_with_store_provenance' backend/tests/Feature/PlatformCustomerUnifiedOrdersTest.php
          grep -Fq 'B2B checkout with order id navigates to B2B details and uses B2B API' apps/customer_app/test/b2b_journey_test.dart
      - name: Verify C13 integrated 13-screen acceptance
        if: ${{ startsWith(github.head_ref, 'test/873-') }}
        shell: bash
        run: |
          set -euo pipefail
          bash ./scripts/c13-integrated-acceptance.sh

      - name: Write exact release evidence manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          version="$(tr -d '\r\n' < VERSION)"
          {
            echo "FOODEX Platform Customer Commerce E2E"
            echo "candidate_commit=$GITHUB_SHA"
            echo "version=$version"
            echo "backend_validation=${{ needs.backend-validation.result }}"
            echo "customer_validation=${{ needs.customer-validation.result }}"
            echo "driver_validation=${{ needs.driver-validation.result }}"
            echo "runtime_evidence=${{ needs.runtime-evidence.result }}"
            echo "journeys=12"
            echo "pcx09_address_lifecycle_contracts=${{ startsWith(github.head_ref, 'feat/436-') || startsWith(github.ref_name, 'feat/436-') }}"
            echo "commerce_isolation_convergence=${{ startsWith(github.head_ref, 'test/743-') || startsWith(github.head_ref, 'test/775-') || startsWith(github.head_ref, 'test/873-') }}"
            echo "commerce_isolation_734_final=${{ startsWith(github.head_ref, 'test/743-') || startsWith(github.head_ref, 'test/775-') || startsWith(github.head_ref, 'test/873-') }}"
            echo "commerce_isolation_734_next_release=1.0.46"
            echo "corrective_customer_commerce_v4=${{ startsWith(github.head_ref, 'test/775-') }}"
            echo "corrective_release_target=1.0.48"
            echo "c13_integrated_e2e=${{ startsWith(github.head_ref, 'test/873-') }}"
            echo "c13_parent_issue=858"
            echo "c13_gate_issue=873"
            echo "c13_integrated_main_sha=${{ github.event.pull_request.base.sha }}"
            echo "c13_route_inventory=13"
            echo "release_gate=PASS"
          } > artifacts/platform-customer-commerce-e2e.txt

      - name: Upload release evidence manifest
        uses: actions/upload-artifact@v4
        with:
          name: platform-customer-commerce-e2e-${{ github.sha }}
          path: artifacts/platform-customer-commerce-e2e.txt
          if-no-files-found: error
          retention-days: 30
