name: TEMP 1633 Exact Dart Format v2

on:
  push:
    branches:
      - fix/1633-dashboard-contrast-tokens

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[dartfmt-1633-v2]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/1633-dashboard-contrast-tokens
      - name: Set up Flutter 3.47.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
      - name: Resolve packages and apply exact formatter
        shell: bash
        run: |
          set -euo pipefail
          pushd apps/driver_app
          flutter pub get
          dart format             lib/core/theme/foodex_theme.dart             lib/features/auth/driver_login.dart             lib/navigation.dart
          popd
          pushd apps/van_app
          flutter pub get
          dart format             lib/features/orders/van_order_detail_page.dart             lib/features/orders/van_orders_page.dart             lib/features/orders/van_product_catalog_page.dart             lib/features/wallet/van_remittance_page.dart             lib/shared/van_action_button.dart             test/foodex_van_theme_test.dart
          popd
          if git diff --quiet --exit-code -- apps/driver_app apps/van_app; then
            exit 0
          fi
          git config user.name "foodex-ci"
          git config user.email "actions@users.noreply.github.com"
          git add             apps/driver_app/lib/core/theme/foodex_theme.dart             apps/driver_app/lib/features/auth/driver_login.dart             apps/driver_app/lib/navigation.dart             apps/van_app/lib/features/orders/van_order_detail_page.dart             apps/van_app/lib/features/orders/van_orders_page.dart             apps/van_app/lib/features/orders/van_product_catalog_page.dart             apps/van_app/lib/features/wallet/van_remittance_page.dart             apps/van_app/lib/shared/van_action_button.dart             apps/van_app/test/foodex_van_theme_test.dart
          git commit -m "style(1633): exact package-context Dart formatting [dartfmt-1633-v2]"
          git push origin HEAD:fix/1633-dashboard-contrast-tokens
