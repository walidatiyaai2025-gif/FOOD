          test -s "ScreenShots/02_Web/Responsive/B2C_Admin/erp-wms-responsive__mobile-390__en.png"
          for surface in erp-procurement-responsive erp-finance-responsive erp-treasury-responsive erp-customer-service-responsive erp-bi-responsive erp-my-work-responsive; do
            for locale in ar en; do
