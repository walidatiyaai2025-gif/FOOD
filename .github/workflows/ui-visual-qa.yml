      - name: Upload visual-QA evidence
        uses: actions/upload-artifact@v4
        with:
          name: foodex-ui-visual-qa-${{ github.event.pull_request.number }}
          path: ScreenShots/02_Web/
          if-no-files-found: error
          retention-days: 14
