name: FOODEX UI Visual QA

on:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  capture-web:
    name: Capture real Web runtime evidence
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, intl, pdo_sqlite
          coverage: none

      - name: Install backend dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Prepare deterministic visual-QA database
        working-directory: backend
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
          CACHE_STORE: array
          QUEUE_CONNECTION: sync
          SESSION_DRIVER: file
        run: |
          cp .env.example .env
          php artisan key:generate
          rm -f database/database.sqlite
          touch database/database.sqlite
          php artisan migrate:fresh --force
          php artisan db:seed --class=Database\\Seeders\\ScreenshotEvidenceSeeder --force
          php artisan db:seed --class=Database\\Seeders\\RefreshTimeSensitiveVisualEvidenceSeeder --force

      - name: Start FOODEX runtime
        working-directory: backend
        env:
          APP_ENV: local
          APP_URL: http://127.0.0.1:8000
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
          CACHE_STORE: array
          QUEUE_CONNECTION: sync
          SESSION_DRIVER: file
        run: |
          php artisan serve --host=127.0.0.1 --port=8000 > /tmp/foodex-ui-qa-server.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/foodex-ui-qa-server.log
          exit 1

      - name: Choose responsive evidence profile
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          if [ -n "$base" ] && [ -n "$head" ]; then
            range="$base...$head"
          else
            range="HEAD^...HEAD"
          fi
          if git diff --name-only "$range" | grep -Eq '^(backend/public/assets/admin/|backend/resources/views/admin/(layouts|components)/|backend/resources/views/admin/_brand-components\.blade\.php|scripts/capture_web_screenshots\.mjs|\.ai/uiux/visual-evidence-matrix\.json|\.github/workflows/ui-visual-qa\.yml)'; then
            profile=full
          else
            profile=representative
          fi
          echo "FOODEX_RESPONSIVE_PROFILE=$profile" >> "$GITHUB_ENV"
          echo "Responsive evidence profile: $profile"

      - name: Capture Arabic and English Admin runtime screenshots
        working-directory: backend
        env:
          APP_ENV: local
          APP_URL: http://127.0.0.1:8000
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
          CACHE_STORE: array
          QUEUE_CONNECTION: sync
          SESSION_DRIVER: file
          FOODEX_SCREENSHOT_BASE_URL: http://127.0.0.1:8000
        run: |
          if ! node ../scripts/capture_web_screenshots.mjs; then
            echo "::group::FOODEX runtime server log"
            cat /tmp/foodex-ui-qa-server.log || true
            echo "::endgroup::"
            exit 1
          fi

      - name: Verify Web evidence pack
        run: |
          set -euo pipefail
          count="$(find ScreenShots/02_Web -type f -name '*.png' | wc -l | tr -d ' ')"
          responsive_count="$(find ScreenShots/02_Web/Responsive -type f -name '*.png' | wc -l | tr -d ' ')"
          test "$count" -ge 106
          if [ "${FOODEX_RESPONSIVE_PROFILE:-representative}" = "full" ]; then
            test "$responsive_count" -ge 352
            test -n "$(find ScreenShots/02_Web/Responsive -type f -name '*__mobile-430__ar.png' -print -quit)"
            test -n "$(find ScreenShots/02_Web/Responsive -type f -name '*__mobile-412__en.png' -print -quit)"
            test -n "$(find ScreenShots/02_Web/Responsive -type f -name '*__mobile-360__ar.png' -print -quit)"
          else
            test "$responsive_count" -ge 220
          fi
          test -n "$(find ScreenShots/02_Web/Responsive -type f -name '*__mobile-320__ar.png' -print -quit)"
          test -n "$(find ScreenShots/02_Web/Responsive -type f -name '*__mobile-320__en.png' -print -quit)"
          test -s "ScreenShots/02_Web/Responsive/B2C_Admin/dashboard__desktop-1280__ar.png"
          test -s "ScreenShots/02_Web/Responsive/B2C_Admin/dashboard__compact-1024__en.png"
          test -s "ScreenShots/02_Web/Responsive/B2C_Admin/treasury-master__desktop-1280__ar.png"
          test -s "ScreenShots/02_Web/Responsive/B2C_Admin/treasury-master__compact-1024__ar.png"
          test -s "ScreenShots/02_Web/Responsive/B2C_Admin/treasury-master__tablet-768__ar.png"
          test -s "ScreenShots/02_Web/Responsive/B2C_Admin/treasury-master__mobile-390__ar.png"
          test -s "ScreenShots/02_Web/Responsive/B2C_Admin/treasury-master__desktop-1280__en.png"
          test -s "ScreenShots/02_Web/Responsive/B2C_Admin/treasury-master__compact-1024__en.png"
          test -s "ScreenShots/02_Web/Responsive/B2C_Admin/treasury-master__tablet-768__en.png"
          test -s "ScreenShots/02_Web/Responsive/B2C_Admin/treasury-master__mobile-390__en.png"
          test -s "ScreenShots/02_Web/Responsive/B2C_Admin/smart-ordering__desktop-1280__ar.png"
          test -s "ScreenShots/02_Web/Responsive/B2C_Admin/smart-ordering__compact-1024__ar.png"
          test -s "ScreenShots/02_Web/Responsive/B2C_Admin/smart-ordering__tablet-768__ar.png"
          test -s "ScreenShots/02_Web/Responsive/B2C_Admin/smart-ordering__mobile-390__ar.png"
          test -s "ScreenShots/02_Web/Responsive/B2C_Admin/smart-ordering-payments__desktop-1280__ar.png"
          test -s "ScreenShots/02_Web/Responsive/B2C_Admin/smart-ordering-payments__compact-1024__ar.png"
          test -s "ScreenShots/02_Web/Responsive/B2C_Admin/smart-ordering-payments__tablet-768__ar.png"
          test -s "ScreenShots/02_Web/Responsive/B2C_Admin/smart-ordering-payments__mobile-390__ar.png"
          test -s "ScreenShots/02_Web/Responsive/B2C_Admin/smart-ordering-payments__desktop-1280__en.png"
          test -s "ScreenShots/02_Web/Responsive/B2C_Admin/smart-ordering-payments__compact-1024__en.png"
          test -s "ScreenShots/02_Web/Responsive/B2C_Admin/smart-ordering-payments__tablet-768__en.png"
          test -s "ScreenShots/02_Web/Responsive/B2C_Admin/smart-ordering-payments__mobile-390__en.png"
          test -s "ScreenShots/02_Web/Responsive/B2C_Admin/smart-ordering-tables__desktop-1280__ar.png"
          test -s "ScreenShots/02_Web/Responsive/B2C_Admin/smart-ordering-tables__compact-1024__ar.png"
          test -s "ScreenShots/02_Web/Responsive/B2C_Admin/smart-ordering-tables__tablet-768__ar.png"
          test -s "ScreenShots/02_Web/Responsive/B2C_Admin/smart-ordering-tables__mobile-390__ar.png"
          test -s "ScreenShots/02_Web/Responsive/B2C_Admin/smart-ordering-tables__desktop-1280__en.png"
          test -s "ScreenShots/02_Web/Responsive/B2C_Admin/smart-ordering-tables__compact-1024__en.png"
          test -s "ScreenShots/02_Web/Responsive/B2C_Admin/smart-ordering-tables__tablet-768__en.png"
          test -s "ScreenShots/02_Web/Responsive/B2C_Admin/smart-ordering-tables__mobile-390__en.png"
          smart_ordering_surfaces="smart-ordering-workforce smart-ordering-reservations smart-ordering-waitlist smart-ordering-guest-book"
          smart_ordering_viewports="desktop-1280 compact-1024 tablet-768 mobile-390 mobile-320"
          if [ "${FOODEX_RESPONSIVE_PROFILE:-representative}" = "full" ]; then
            smart_ordering_viewports="$smart_ordering_viewports mobile-430 mobile-412 mobile-360"
          fi
          for surface in $smart_ordering_surfaces; do
            for locale in ar en; do
              for viewport in $smart_ordering_viewports; do
                test -s "ScreenShots/02_Web/Responsive/B2C_Admin/${surface}__${viewport}__${locale}.png"
              done
            done
