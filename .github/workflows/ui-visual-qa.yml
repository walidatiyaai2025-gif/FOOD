          test -s "ScreenShots/02_Web/B2C_Admin/15_مركز_الإدارة__populated__ar.png"
          test -s "ScreenShots/02_Web/B2C_Admin/15_مركز_الإدارة__populated__en.png"
          test -s "ScreenShots/02_Web/B2C_Admin/16_administration_runtime_contract__populated__ar.png"
          test -s "ScreenShots/02_Web/B2C_Admin/16_administration_runtime_contract__populated__en.png"
