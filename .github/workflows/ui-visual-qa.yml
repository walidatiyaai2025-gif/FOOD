          test -s "ScreenShots/02_Web/B2C_Admin/18_campaign_actions__mobile-390__ar.png"
          test -s "ScreenShots/02_Web/B2C_Admin/18_campaign_actions__mobile-390__en.png"
          test -s "ScreenShots/02_Web/B2C_Admin/19_mobile_settings_van_structured__desktop__ar.png"
          test -s "ScreenShots/02_Web/B2C_Admin/19_mobile_settings_van_structured__desktop__en.png"
          test -s "ScreenShots/02_Web/B2C_Admin/20_van_finance_support__desktop__ar.png"
          test -s "ScreenShots/02_Web/B2C_Admin/20_van_finance_support__desktop__en.png"
          test -s "ScreenShots/02_Web/B2C_Admin/21_security_permissions_review__desktop__ar.png"
