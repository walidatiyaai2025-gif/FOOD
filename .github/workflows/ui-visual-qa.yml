          test -s "ScreenShots/02_Web/Responsive/B2C_Admin/smart-ordering-qr__desktop-1280__ar.png"
          test -s "ScreenShots/02_Web/Responsive/B2C_Admin/smart-ordering-qr__mobile-390__en.png"
          test -s "ScreenShots/02_Web/Responsive/B2C_Admin/sales-control__desktop-1280__ar.png"
          test -s "ScreenShots/02_Web/Responsive/B2C_Admin/sales-control__mobile-390__en.png"
          test -s "ScreenShots/02_Web/Responsive/B2C_Admin/flash-offers__desktop-1280__ar.png"
          test -s "ScreenShots/02_Web/Responsive/B2C_Admin/flash-offers__mobile-390__en.png"
          test -s "ScreenShots/02_Web/B2C_Admin/15_العروض_السريعة__populated__ar.png"
