          test -s "ScreenShots/02_Web/Responsive/B2C_Admin/smart-ordering-analytics__desktop-1280__ar.png"
          test -s "ScreenShots/02_Web/Responsive/B2C_Admin/smart-ordering-analytics__mobile-390__en.png"
          test -s "ScreenShots/02_Web/Responsive/B2C_Admin/smart-ordering-supply__desktop-1280__ar.png"
          test -s "ScreenShots/02_Web/Responsive/B2C_Admin/smart-ordering-supply__mobile-390__en.png"
          test -s "ScreenShots/02_Web/Responsive/B2C_Admin/smart-ordering__desktop-1280__en.png"
          test -s "ScreenShots/02_Web/Responsive/B2C_Admin/smart-ordering__compact-1024__en.png"
          test -s "ScreenShots/02_Web/Responsive/B2C_Admin/smart-ordering__tablet-768__en.png"
          test -s "ScreenShots/02_Web/Responsive/B2C_Admin/smart-ordering__mobile-390__en.png"
          test -s "ScreenShots/02_Web/Responsive/B2C_Admin/smart-ordering-supply__desktop-1280__ar.png"
