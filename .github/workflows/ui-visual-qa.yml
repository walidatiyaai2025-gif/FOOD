          test -s "ScreenShots/02_Web/Responsive/B2C_Admin/erp-wms-responsive__tablet-768__ar.png"
          test -s "ScreenShots/02_Web/Responsive/B2C_Admin/erp-wms-responsive__mobile-390__ar.png"
          test -s "ScreenShots/02_Web/Responsive/B2C_Admin/erp-wms-responsive__desktop-1280__en.png"
          test -s "ScreenShots/02_Web/Responsive/B2C_Admin/erp-wms-responsive__compact-1024__en.png"
