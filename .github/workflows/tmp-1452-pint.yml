name: Temporary #1452 Pint formatter

on:
  push:
    branches:
      - feat/1452-smart-ordering-customer-growth

permissions:
  contents: write

jobs:
  pint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/1452-smart-ordering-customer-growth
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_sqlite, pdo_mysql
          coverage: none
          tools: composer:v2
      - name: Install backend dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Apply canonical Pint formatting
        working-directory: backend
        run: vendor/bin/pint app/Domain/SmartOrdering/RepeatOrderService.php routes/console.php
      - name: Commit formatter result
        run: |
          if git diff --quiet -- backend/app/Domain/SmartOrdering/RepeatOrderService.php backend/routes/console.php; then
            echo "No formatter changes required."
            exit 0
          fi
          git config user.name "foodex-ci"
          git config user.email "actions@users.noreply.github.com"
          git add backend/app/Domain/SmartOrdering/RepeatOrderService.php backend/routes/console.php
          git commit -m "style(#1452): apply exact Pint formatting"
          git push origin HEAD:feat/1452-smart-ordering-customer-growth
