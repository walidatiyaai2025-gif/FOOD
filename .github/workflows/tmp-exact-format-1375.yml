name: Temporary exact Customer formatter 1375

on:
  push:
    branches:
      - fix/1375-customer-hotfix-apk
    paths:
      - .github/workflows/tmp-exact-format-1375.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/customer_app
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Flutter 3.47.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          cache: true
      - name: Resolve Customer package
        run: flutter pub get
      - name: Canonical Customer format
        run: |
          dart format \
            lib/core/api/customer_action_api.dart \
            lib/core/network/customer_data_mode.dart \
            lib/core/network/customer_low_data_http_client.dart \
            lib/core/routing/customer_router.dart \
            lib/features/auth/unified_customer_auth_screen.dart \
            lib/features/storefront/wholesale_multistore_screens.dart
      - name: Commit exact formatting
        shell: bash
        run: |
          if git diff --quiet -- lib; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib/core/api/customer_action_api.dart \
            lib/core/network/customer_data_mode.dart \
            lib/core/network/customer_low_data_http_client.dart \
            lib/core/routing/customer_router.dart \
            lib/features/auth/unified_customer_auth_screen.dart \
            lib/features/storefront/wholesale_multistore_screens.dart
          git commit -m "style(customer): match Flutter CI formatting (#1375)"
          git push origin "HEAD:${GITHUB_REF_NAME}"
