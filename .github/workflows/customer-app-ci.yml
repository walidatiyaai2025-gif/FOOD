name: Customer App CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  flutter:
    name: Customer Flutter validation
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: apps/customer_app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter 3.47.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          cache: true

      - name: Prepare Android/iOS scaffolding
        run: |
          flutter create --platforms=android,ios --project-name foodex_customer_app .
          python3 ../../scripts/configure-mobile-native.py --app customer --app-dir . --platform all

      - name: Remove generated default widget test
        run: rm -f test/widget_test.dart

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: |
          mapfile -t tests < <(find test -type f -name '*_test.dart' ! -name 'screenshot_evidence_test.dart' -print)
          flutter test "${tests[@]}"

      - name: Capture dashboard trial before and after runtime
        if: ${{ github.head_ref == 'feat/920-foodex-login-visual-trial' }}
        shell: bash
        run: |
          set -euo pipefail
          flutter test test/dashboard_single_screen_test.dart
          source_file=lib/features/b2b/b2b_journey_screen.dart
          backup="$(mktemp)"
          cp "$source_file" "$backup"
          trap 'cp "$backup" "$source_file"; rm -f "$backup"' EXIT
          git fetch --depth=1 origin d3119fef145725c89b04e012b1484a893daec5a0
          git show d3119fef145725c89b04e012b1484a893daec5a0:apps/customer_app/lib/features/b2b/b2b_journey_screen.dart > "$source_file"
          DASHBOARD_CAPTURE_PHASE=before flutter test test/dashboard_single_screen_test.dart

      - name: Upload dashboard trial runtime proof
        if: ${{ github.head_ref == 'feat/920-foodex-login-visual-trial' && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: foodex-dashboard-single-screen-runtime
          path: apps/customer_app/build/dashboard-evidence/
          if-no-files-found: error
          retention-days: 14

      - name: Customer preview Flutter Web validation build
        run: |
          flutter build web \
            --release \
            --target=lib/preview_main.dart \
            --dart-define=FOODEX_API_BASE_URL=https://foodex.50sols.com \
            --dart-define=FOODEX_PREVIEW_PARENT_ORIGIN=https://foodex.50sols.com \
            --dart-define=FOODEX_PREVIEW_CONTRACT_VERSION=shared-flutter-v1
          test -f build/web/index.html
          test -f build/web/main.dart.js

      - name: Android release-mode validation build
        run: flutter build apk --release --build-number="$GITHUB_RUN_NUMBER" --dart-define=FOODEX_API_BASE_URL=https://foodex.50sols.com

      - name: Verify Android release network permission and native brand
        shell: bash
        run: |
          set -euo pipefail
          aapt_bin="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$aapt_bin"
          apk=build/app/outputs/flutter-apk/app-release.apk
          "$aapt_bin" dump permissions "$apk" > build/release-permissions.txt
          grep -Fx "uses-permission: name='android.permission.INTERNET'" build/release-permissions.txt
          "$aapt_bin" dump badging "$apk" > build/release-badging.txt
          grep -Fx "application-label:'FOODEX'" build/release-badging.txt
          grep -F "package: name='com.fiftysolution.foodex.customer'" build/release-badging.txt

      - name: Package Android validation evidence
        working-directory: .
        run: python3 scripts/package-mobile-artifact.py --app customer --platform android --input apps/customer_app/build/app/outputs/flutter-apk/app-release.apk --build-number "$GITHUB_RUN_NUMBER" --commit "$GITHUB_SHA" --output artifacts

      - name: Upload Android validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: foodex-customer-android-release-validation
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

  ios-validate:
    name: Customer iOS no-codesign validation
    runs-on: macos-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: apps/customer_app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter 3.47.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          cache: true

      - name: Prepare iOS scaffolding
        run: |
          flutter create --platforms=ios --project-name foodex_customer_app .
          python3 ../../scripts/configure-mobile-native.py --app customer --app-dir . --platform ios

      - name: Apply approved iOS native display name
        run: /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName FOODEX" ios/Runner/Info.plist

      - name: Resolve dependencies
        run: flutter pub get

      - name: iOS release-mode validation without codesign
        run: flutter build ios --release --no-codesign --build-number="$GITHUB_RUN_NUMBER" --dart-define=FOODEX_API_BASE_URL=https://foodex.50sols.com

      - name: Verify iOS native brand
        shell: bash
        run: |
          set -euo pipefail
          plist=build/ios/iphoneos/Runner.app/Info.plist
          test -f "$plist"
          actual="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$plist")"
          test "$actual" = "FOODEX"
          bundle="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")"
          test "$bundle" = "com.fiftysolution.foodex.customer"

      - name: Archive unsigned iOS app
        run: ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app build/ios/iphoneos/Runner.app.zip

      - name: Package iOS validation evidence
        working-directory: .
        run: python3 scripts/package-mobile-artifact.py --app customer --platform ios --input apps/customer_app/build/ios/iphoneos/Runner.app.zip --build-number "$GITHUB_RUN_NUMBER" --commit "$GITHUB_SHA" --output artifacts

      - name: Upload unsigned iOS validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: foodex-customer-ios-release-validation
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
