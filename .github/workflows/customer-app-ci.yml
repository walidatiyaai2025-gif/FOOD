name: Customer App CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  flutter:
    name: Customer Flutter validation
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: apps/customer_app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter 3.47.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          cache: true

      - name: Prepare Android/iOS scaffolding
        run: flutter create --platforms=android,ios --project-name foodex_customer_app .

      - name: Remove generated default widget test
        run: rm -f test/widget_test.dart

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Android debug build
        run: flutter build apk --debug

  ios-validate:
    name: Customer iOS no-codesign validation
    runs-on: macos-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: apps/customer_app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter 3.47.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          cache: true

      - name: Prepare iOS scaffolding
        run: flutter create --platforms=ios --project-name foodex_customer_app .

      - name: Resolve dependencies
        run: flutter pub get

      - name: iOS debug build without codesign
        run: flutter build ios --debug --no-codesign
