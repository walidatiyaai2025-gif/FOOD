name: FOODEX Mobile Screenshot Capture

on:
  pull_request:
    paths:
      - "apps/customer_app/lib/app.dart"
      - "apps/customer_app/lib/core/theme/foodex_theme.dart"
      - "apps/customer_app/test/screenshot_evidence_test.dart"
      - "apps/driver_app/lib/app.dart"
      - "apps/driver_app/lib/core/theme/foodex_theme.dart"
      - "apps/driver_app/test/screenshot_evidence_test.dart"
      - ".github/workflows/mobile-screenshot-capture.yml"

permissions:
  contents: read

jobs:
  capture-mobile:
    name: Capture readable portrait mobile evidence
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Install Arabic-capable evidence font
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core

      - name: Set up Flutter 3.47.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          cache: true

      - name: Capture Customer evidence
        working-directory: apps/customer_app
        run: |
          flutter pub get
          flutter test test/screenshot_evidence_test.dart

      - name: Capture Driver evidence
        working-directory: apps/driver_app
        run: |
          flutter pub get
          flutter test test/screenshot_evidence_test.dart

      - name: Verify portrait geometry
        run: |
          python -m pip install --disable-pip-version-check pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          paths = sorted(Path("ScreenShots/01_Mobile").rglob("*.png"))
          assert paths, "No mobile screenshots generated"
          for path in paths:
              with Image.open(path) as image:
                  width, height = image.size
              assert (width, height) == (430, 932), f"{path}: {width}x{height}"
              assert height / width >= 1.6, f"{path}: invalid portrait ratio"
          print(f"Validated {len(paths)} mobile screenshots at 430x932")
          PY

      - name: Upload regenerated mobile evidence
        uses: actions/upload-artifact@v4
        with:
          name: foodex-mobile-screenshot-qa-${{ github.event.pull_request.number }}
          path: ScreenShots/01_Mobile/
          if-no-files-found: error
          retention-days: 14
