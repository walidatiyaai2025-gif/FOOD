name: Cleanup Consolidated Mockup Branches

on:
  push:
    branches:
      - archive/uiux-approved-mockups

permissions:
  contents: write
  pull-requests: read

jobs:
  delete-original-prototype-branches:
    if: "github.event.head_commit.message == 'chore(mockups): remove consolidated prototype branches'"
    runs-on: ubuntu-latest
    steps:
      - name: Verify archive and delete original branches
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const archiveRef = 'archive/uiux-approved-mockups';

            const targets = [
              {
                branch: 'prototype/driver-uiux-mockup',
                sourcePath: 'prototypes/driver_uiux_mockup/lib/main.dart',
                expectedBlob: 'd831982a106d82f8cb001b060bd4247437001bd5',
              },
              {
                branch: 'prototype/customer-uiux-mockup',
                sourcePath: 'prototypes/customer_uiux_mockup/lib/main.dart',
                expectedBlob: '12f2eccd53b0d09eb9b0c0963cd83d7641514426',
              },
              {
                branch: 'prototype/van-uiux-mockup',
                sourcePath: 'prototypes/van_uiux_mockup/lib/main.dart',
                expectedBlob: '4063e058b2c5426eaf2cdbf8bd826245fcbe1b44',
              },
            ];

            for (const target of targets) {
              const [{ data: sourceFile }, { data: archivedFile }] = await Promise.all([
                github.rest.repos.getContent({
                  owner,
                  repo,
                  path: target.sourcePath,
                  ref: target.branch,
                }),
                github.rest.repos.getContent({
                  owner,
                  repo,
                  path: target.sourcePath,
                  ref: archiveRef,
                }),
              ]);

              if (Array.isArray(sourceFile) || Array.isArray(archivedFile)) {
                core.setFailed(`Expected files, got directory data for ${target.sourcePath}`);
                return;
              }

              if (sourceFile.sha !== target.expectedBlob) {
                core.setFailed(
                  `Refusing to delete ${target.branch}: source changed after consolidation (${sourceFile.sha} != ${target.expectedBlob})`,
                );
                return;
              }

              if (archivedFile.sha !== sourceFile.sha) {
                core.setFailed(
                  `Refusing to delete ${target.branch}: archive blob does not match source`,
                );
                return;
              }

              const { data: branch } = await github.rest.repos.getBranch({
                owner,
                repo,
                branch: target.branch,
              });

              if (branch.protected) {
                core.setFailed(`Refusing to delete protected branch ${target.branch}`);
                return;
              }

              const { data: openPulls } = await github.rest.pulls.list({
                owner,
                repo,
                state: 'open',
                head: `${owner}:${target.branch}`,
                per_page: 100,
              });

              if (openPulls.length) {
                core.setFailed(`Refusing to delete ${target.branch}: open PR exists`);
                return;
              }
            }

            for (const target of targets) {
              try {
                await github.rest.git.deleteRef({
                  owner,
                  repo,
                  ref: `heads/${target.branch}`,
                });
                core.notice(`Deleted ${target.branch}`);
              } catch (error) {
                if (error.status === 404) {
                  core.info(`${target.branch} already deleted`);
                  continue;
                }
                throw error;
              }
            }
