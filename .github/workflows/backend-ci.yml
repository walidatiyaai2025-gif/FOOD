name: Backend CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  fast:
    name: Backend fast-fail
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, intl, pdo_sqlite, pdo_mysql
          coverage: none
          tools: composer:v2

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Validate Composer manifest
        run: composer validate --strict --no-check-lock

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Syntax-check application PHP
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file" >/dev/null
          done < <(find app routes tests -type f -name '*.php' -print0)

      - name: Run backend lint first
        run: composer lint

      - name: Run backend static analysis
        run: composer analyse

      - name: Run Composer security audit
        run: composer audit

      - name: Validate OpenAPI contract
        working-directory: .
        env:
          REDOCLY_TELEMETRY: "off"
          REDOCLY_SUPPRESS_UPDATE_NOTICE: "true"
        run: npx --yes @redocly/cli@2.59.0 lint docs/api/openapi.yaml

  backend:
    name: Backend tests
    needs: fast
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, intl, pdo_sqlite, pdo_mysql
          coverage: none
          tools: composer:v2

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite

      - name: Validate fresh migrations
        run: php artisan migrate:fresh --force
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite

      - name: Validate deterministic seed data
        run: php artisan db:seed --force
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite

      - name: Set up Node for live-map runtime tests
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Test live-map runtime and local static assets
        run: node --test tests/Browser/driver-live-map.test.cjs

      - name: Probe production public document-root assets over HTTP
        shell: bash
        run: |
          set -euo pipefail
          php -S 127.0.0.1:8099 -t public >/tmp/foodex-public-assets.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for _ in {1..20}; do
            if curl --fail --silent --show-error http://127.0.0.1:8099/assets/admin/driver-live-map.js >/dev/null; then
              break
            fi
            sleep 0.25
          done

          assets=(
            assets/admin/driver-live-map.js
            assets/admin/driver-live-map.css
            assets/leaflet/1.9.4/leaflet.js
            assets/leaflet/1.9.4/leaflet.css
            assets/leaflet/1.9.4/images/marker-icon.png
            assets/leaflet/1.9.4/images/marker-shadow.png
            brand/foodex-economical-group.webp
          )

          for asset in "${assets[@]}"; do
            status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "http://127.0.0.1:8099/$asset")"
            test "$status" = "200" || {
              echo "::error::$asset returned HTTP $status from backend/public document root"
              cat /tmp/foodex-public-assets.log
              exit 1
            }
          done

          grep -F 'RewriteCond %{REQUEST_FILENAME} !-f' public/.htaccess
          grep -F 'RewriteCond %{REQUEST_FILENAME} !-d' public/.htaccess

      - name: Run backend tests
        run: composer test

  production-services:
    name: MySQL Redis deployment acceptance
    needs: fast
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: foodex_acceptance
          MYSQL_USER: foodex
          MYSQL_PASSWORD: ci-only-password
          MYSQL_ROOT_PASSWORD: ci-root-password
        ports:
          - 3306:3306
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: foodex_acceptance
      DB_USERNAME: foodex
      DB_PASSWORD: ci-only-password
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      FOODEX_DISPOSABLE_SERVICES: 'true'
      FOODEX_MYSQL_DUMP_BINARY: /usr/bin/mysqldump
      FOODEX_MYSQL_CLIENT_BINARY: /usr/bin/mysql
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_mysql, redis, zip
          coverage: none
          tools: composer:v2

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-
      - name: Verify preinstalled MySQL client tools
        run: |
          test -x /usr/bin/mysql
          test -x /usr/bin/mysqladmin
          test -x /usr/bin/mysqldump
          mysql --version
          mysqladmin --version
          mysqldump --version
      - name: Wait for MySQL
        run: |
          for attempt in {1..30}; do
            if mysqladmin ping --host=127.0.0.1 --port=3306 --user=foodex --password=ci-only-password --silent; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Install backend dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare disposable configuration
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Run real install upgrade and recovery acceptance
        run: vendor/bin/phpunit tests/Deployment --log-junit deployment-results.xml
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-services-acceptance
          path: backend/deployment-results.xml
          if-no-files-found: warn
