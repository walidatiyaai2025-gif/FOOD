name: FOODEX Van 1.0.58 Fresh Setup

on:
  push:
    branches:
      - release/1.0.58-van-complete
    paths:
      - ".github/workflows/van-complete-fresh-setup.yml"
      - "VERSION"
      - "backend/**"
      - "apps/customer_app/**"
      - "apps/driver_app/**"
      - "apps/van_app/**"
      - "scripts/build-dashboard-update.sh"
      - "scripts/build-update-bundle.py"
      - "Release/INSTALL-FIRST.txt"
      - "store/submission/metadata.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: foodex-van-1-0-58-fresh-setup
  cancel-in-progress: true

jobs:
  fresh-setup:
    name: Fresh Install / Setup validation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: foodex_acceptance
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    env:
      FOODEX_API_BASE_URL: https://foodex.50sols.com

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify canonical release identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '[:space:]' < VERSION)" = "1.0.58"
          grep -Fq "defaultValue: 'https://foodex.50sols.com'" apps/customer_app/lib/core/config/foodex_environment.dart
          grep -Fq "defaultValue: 'https://foodex.50sols.com'" apps/driver_app/lib/core/config/foodex_environment.dart
          grep -Fq "defaultValue: 'https://foodex.50sols.com'" apps/van_app/lib/core/config/foodex_environment.dart
          grep -Fq "APP_URL=https://foodex.50sols.com" backend/.env.production.example
          grep -Fq '"production_base_url": "https://foodex.50sols.com"' store/submission/metadata.json

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_mysql, zip, redis
          tools: composer:v2
          coverage: none

      - name: Build fresh Laravel Setup ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -f Release/FOODEX-Laravel-Setup.zip Release/BUILD_INFO.json
          composer install --working-dir=backend --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress

          stage="$(mktemp -d)"
          mkdir -p "$stage/backend"
          rsync -a backend/ "$stage/backend/"             --exclude='.env'             --exclude='tests/'             --exclude='docs/'             --exclude='.phpunit.cache/'             --exclude='storage/logs/*'             --exclude='storage/app/system/*'
          rm -f "$stage/backend/bootstrap/cache/"*.php
          cp VERSION "$stage/VERSION"
          cp Release/INSTALL-FIRST.txt "$stage/INSTALL-FIRST.txt"

          test -s "$stage/backend/vendor/autoload.php"
          test -s "$stage/backend/artisan"
          test -s "$stage/backend/public/index.php"
          test ! -e "$stage/backend/.env"

          if find "$stage" -type f \( -name '*.jks' -o -name '*.keystore' -o -name '*.p12' -o -name '*.pfx' -o -name 'auth.json' -o -name '.env' \) -print -quit | grep -q .; then
            echo "::error::Setup stage contains a forbidden secret/signing file."
            exit 1
          fi

          (cd "$stage" && zip -qr "$GITHUB_WORKSPACE/Release/FOODEX-Laravel-Setup.zip" .)
          setup_bytes="$(stat -c%s Release/FOODEX-Laravel-Setup.zip)"
          test "$setup_bytes" -gt 1000000
          test "$setup_bytes" -lt 99000000

          unzip -Z1 Release/FOODEX-Laravel-Setup.zip | grep -Fx 'VERSION'
          unzip -Z1 Release/FOODEX-Laravel-Setup.zip | grep -Fx 'backend/artisan'
          unzip -Z1 Release/FOODEX-Laravel-Setup.zip | grep -Fx 'backend/vendor/autoload.php'
          ! unzip -Z1 Release/FOODEX-Laravel-Setup.zip | grep -Eq '(^|/)\.env$|\.jks$|\.keystore$|\.p12$|\.pfx$|(^|/)auth\.json$'

      - name: Set up Node for fresh-install visual QA
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Playwright Chromium for fresh-install visual QA
        shell: bash
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Validate clean install from ZIP only
        shell: bash
        run: |
          set -Eeuo pipefail
          report_failure() {
            local rc="$1"
            local line="$2"
            local cmd="$3"
            echo "::error::Fresh Setup failed at line $line with exit $rc: $cmd"
            cat /tmp/foodex-install-server.log 2>/dev/null || true
            cat /tmp/foodex-installed-server.log 2>/dev/null || true
            if [[ -n "${fresh:-}" ]]; then
              tail -n 200 "$fresh/backend/storage/logs/laravel.log" 2>/dev/null || true
            fi
            return "$rc"
          }
          trap 'report_failure "$?" "$LINENO" "$BASH_COMMAND"' ERR

          fresh="$(mktemp -d)"
          unzip -q Release/FOODEX-Laravel-Setup.zip -d "$fresh"
          test "$(tr -d '[:space:]' < "$fresh/VERSION")" = "1.0.58"
          test -d "$fresh/backend/public"
          test -s "$fresh/backend/vendor/autoload.php"
          test ! -e "$fresh/backend/.env"

          cp "$fresh/backend/.env.production.example" "$fresh/backend/.env"
          sed -i             -e 's|^APP_URL=.*|APP_URL=https://foodex.50sols.com|'             -e 's|^DB_HOST=.*|DB_HOST=127.0.0.1|'             -e 's|^DB_PORT=.*|DB_PORT=3306|'             -e 's|^DB_DATABASE=.*|DB_DATABASE=foodex_acceptance|'             -e 's|^DB_USERNAME=.*|DB_USERNAME=root|'             -e 's|^DB_PASSWORD=.*|DB_PASSWORD=root|'             -e 's|^CACHE_STORE=.*|CACHE_STORE=redis|'             -e 's|^QUEUE_CONNECTION=.*|QUEUE_CONNECTION=redis|'             -e 's|^REDIS_HOST=.*|REDIS_HOST=127.0.0.1|'             "$fresh/backend/.env"

          cat > /tmp/foodex-fresh-install.php <<'PHP'
          <?php
          $root = getenv('FRESH_ROOT');
          require $root.'/backend/vendor/autoload.php';
          $app = require $root.'/backend/bootstrap/app.php';
          $kernel = $app->make(Illuminate\Contracts\Console\Kernel::class);
          $kernel->bootstrap();

          config([
              'foodex.scheduler_auto_provision' => false,
              'foodex.scheduler_heartbeat' => true,
          ]);

          $workflow = $app->make(App\Domain\Installer\InstallerWorkflow::class);
          $state = $app->make(App\Domain\Installer\InstallState::class);
          $mode = $argv[1] ?? '';

          if ($mode === 'prepare') {
              $workflow->saveDatabaseConfiguration([
                  'host' => '127.0.0.1',
                  'port' => 3306,
                  'database' => 'foodex_acceptance',
                  'username' => 'root',
                  'password' => 'root',
              ]);
              $workflow->savePlatformInformation([
                  'name' => 'FOODEX',
                  'url' => 'https://foodex.50sols.com',
                  'locale' => 'ar',
              ]);
              $workflow->saveCacheQueueConfiguration([
                  'cache' => 'redis',
                  'queue' => 'redis',
                  'redis_host' => '127.0.0.1',
                  'redis_port' => 6379,
                  'redis_password' => 'null',
              ]);
              $workflow->saveMailConfiguration([
                  'mailer' => 'log',
                  'from_address' => 'noreply@50sols.com',
                  'from_name' => 'FOODEX',
              ]);
              $workflow->generateApplicationKey();
              $workflow->runMigrations();
              $workflow->seedRequiredCoreData();
              $workflow->saveStorageConfiguration('local');
              $checks = $workflow->healthCheck();
              if ($checks !== ['database'=>true,'storage'=>true,'cache'=>true,'queue'=>true]) {
                  throw new RuntimeException('Fresh installer health checks did not all pass.');
              }
              if ($state->isInstalled()) {
                  throw new RuntimeException('Install lock exists before Finish.');
              }
              exit(0);
          }

          if ($mode === 'finish') {
              $admin = $workflow->prepareSuperAdmin([
                  'name' => 'FOODEX Acceptance Owner',
                  'email' => 'acceptance-owner@example.test',
                  'password' => 'AcceptanceOnly!12345',
                  'locale' => 'en',
              ]);
              $version = $workflow->finish($admin);
              if ($version !== '1.0.58' || ! $state->isInstalled()) {
                  throw new RuntimeException('Installer Finish did not lock 1.0.58.');
              }
              $db = Illuminate\Support\Facades\DB::class;
              if (! $db::table('users')->where('email', 'acceptance-owner@example.test')->where('is_active', true)->exists()) {
                  throw new RuntimeException('First owner was not created.');
              }
              if (! $db::table('system_versions')->where('version', '1.0.58')->exists()) {
                  throw new RuntimeException('System version was not recorded.');
              }

              $owner = App\Models\User::query()
                  ->where('email', 'acceptance-owner@example.test')
                  ->firstOrFail();

              $expectedFlags = [
                  'commercial_rules_enabled' => true,
                  'flash_offers_enabled' => true,
                  'customer_flash_popup_enabled' => true,
                  'van_offers_enabled' => true,
              ];
              $actualFlags = $app->make(App\Services\CommercialFeatureFlags::class)->snapshot();
              if ($actualFlags !== $expectedFlags) {
                  throw new RuntimeException('Canonical Van release feature flags were not enabled on first install: '.json_encode($actualFlags));
              }

              foreach (['platform.manage','catalog.view','catalog.manage','promotions.view','promotions.manage','field_ops.manage','territories.manage','drivers.tracking.view','drivers.b2b.view','finance.view','customers.view'] as $permission) {
                  if (! $owner->hasPermission($permission)) {
                      throw new RuntimeException("Fresh Super Admin is missing required permission [{$permission}].");
                  }
              }

              $now = now();
              $b2bStoreTypeId = (int) $db::table('store_types')->where('code', 'B2B')->value('id');
              if ($b2bStoreTypeId <= 0) {
                  throw new RuntimeException('Expected seeded B2B store type was not returned after fresh setup.');
              }
              $b2bStoreId = (int) $db::table('stores')->insertGetId([
                  'store_type_id' => $b2bStoreTypeId,
                  'code' => 'FRESH-VAN-B2B',
                  'name' => 'Fresh Van B2B Operation',
                  'is_active' => true,
                  'created_at' => $now,
                  'updated_at' => $now,
              ]);
              if ($b2bStoreId <= 0 || ! $db::table('stores')->where('id', $b2bStoreId)->where('store_type_id', $b2bStoreTypeId)->where('is_active', true)->exists()) {
                  throw new RuntimeException('Expected seeded B2B store was not returned after fresh setup.');
              }

              $storeTypeId = (int) $db::table('store_types')->where('code', 'B2C')->value('id');
              if ($storeTypeId <= 0) {
                  throw new RuntimeException('Expected seeded B2C store type was not returned after fresh setup.');
              }
              $storeId = (int) $db::table('stores')->insertGetId([
                  'store_type_id' => $storeTypeId,
                  'code' => 'FRESH-VAN',
                  'name' => 'Fresh Van Acceptance Store',
                  'is_active' => true,
                  'created_at' => $now,
                  'updated_at' => $now,
              ]);
              if ($storeId <= 0 || ! $db::table('stores')->where('id', $storeId)->where('store_type_id', $storeTypeId)->where('is_active', true)->exists()) {
                  throw new RuntimeException('Expected seeded B2C store was not returned after fresh setup.');
              }

              $catalogId = (int) $db::table('catalogs')->insertGetId([
                  'store_id' => $storeId,
                  'channel' => 'b2c',
                  'code' => 'fresh-van',
                  'name' => 'Fresh Van Acceptance',
                  'is_active' => true,
                  'is_migration_quarantine' => false,
                  'created_at' => $now,
                  'updated_at' => $now,
              ]);
              $unitId = (int) $db::table('units')->insertGetId([
                  'store_id' => $storeId,
                  'scope' => 'store',
                  'scope_key' => 'store:'.$storeId,
                  'code' => 'EA',
                  'name' => 'Each',
                  'name_ar' => 'قطعة',
                  'name_en' => 'Each',
                  'decimal_places' => 0,
                  'is_active' => true,
                  'created_at' => $now,
                  'updated_at' => $now,
              ]);
              $productId = (int) $db::table('products')->insertGetId([
                  'catalog_id' => $catalogId,
                  'unit_id' => $unitId,
                  'sku' => 'FRESH-VAN-001',
                  'name' => 'Fresh Van Product',
                  'is_active' => true,
                  'created_at' => $now,
                  'updated_at' => $now,
              ]);
              $db::table('store_products')->insert([
                  'store_id' => $storeId,
                  'product_id' => $productId,
                  'price' => 10,
                  'is_active' => true,
                  'created_at' => $now,
                  'updated_at' => $now,
              ]);
              $db::table('product_selling_units')->insert([
                  'product_id' => $productId,
                  'unit_id' => $unitId,
                  'code' => 'EA',
                  'name' => 'Each',
                  'conversion_factor' => 1,
                  'price' => 10,
                  'sku' => 'FRESH-VAN-001',
                  'barcode' => null,
                  'is_base' => true,
                  'is_active' => true,
                  'created_at' => $now,
                  'updated_at' => $now,
              ]);
              $db::table('product_commercial_policies')->insert([
                  'product_id' => $productId,
                  'status' => 'OPEN',
                  'hide_when_closed' => false,
                  'override_allowed' => true,
                  'channels' => json_encode(['customer'=>true,'van'=>true,'admin'=>true], JSON_THROW_ON_ERROR),
                  'break_pack_policy' => 'mixed',
                  'business_timezone' => 'Asia/Kuwait',
                  'week_starts_on' => 1,
                  'created_at' => $now,
                  'updated_at' => $now,
              ]);

              $customerUser = App\Models\User::query()->create([
                  'name' => 'Fresh Van Customer',
                  'email' => 'fresh-van-customer@example.test',
                  'password' => Illuminate\Support\Facades\Hash::make('AcceptanceCustomer!12345'),
                  'locale' => 'en',
                  'is_active' => true,
              ]);
              $legacyCustomerId = (int) $db::table('customers')->insertGetId([
                  'user_id' => $customerUser->id,
                  'type' => 'b2c',
                  'name' => 'Fresh Van Customer',
                  'email' => $customerUser->email,
                  'created_at' => $now,
                  'updated_at' => $now,
              ]);
              $domainCustomerId = (int) $db::table('b2c_customers')->insertGetId([
                  'legacy_customer_id' => $legacyCustomerId,
                  'store_id' => $storeId,
                  'user_id' => $customerUser->id,
                  'name' => 'Fresh Van Customer',
                  'email' => $customerUser->email,
                  'created_at' => $now,
                  'updated_at' => $now,
              ]);
              $db::table('van_visits')->insert([
                  'actor_user_id' => $owner->id,
                  'customer_type' => 'b2c',
                  'customer_id' => $domainCustomerId,
                  'store_id' => $storeId,
                  'status' => 'planned',
                  'idempotency_key' => 'fresh-van-acceptance-visit',
                  'metadata' => json_encode(['route_code'=>'FRESH-ROUTE'], JSON_THROW_ON_ERROR),
                  'created_at' => $now,
                  'updated_at' => $now,
              ]);
              $db::table('promotions')->insert([
                  'store_id' => $storeId,
                  'name' => 'Fresh Normal Offer',
                  'type' => 'percentage',
                  'value' => 5,
                  'starts_at' => $now->copy()->subMinute(),
                  'ends_at' => $now->copy()->addHour(),
                  'is_active' => true,
                  'created_at' => $now,
                  'updated_at' => $now,
              ]);
              $offerId = (int) $db::table('flash_offers')->insertGetId([
                  'store_id' => $storeId,
                  'name' => 'Fresh Flash Offer',
                  'title_ar' => 'عرض فلاش',
                  'title_en' => 'Fresh Flash Offer',
                  'body_ar' => null,
                  'body_en' => 'Fresh-install acceptance',
                  'status' => 'active',
                  'starts_at' => $now->copy()->subMinute(),
                  'ends_at' => $now->copy()->addHour(),
                  'timezone' => 'Asia/Kuwait',
                  'channels' => json_encode(['customer','van'], JSON_THROW_ON_ERROR),
                  'allocation_mode' => 'shared',
                  'total_allocation_base' => 100,
                  'per_customer_limit_base' => 10,
                  'reservation_seconds' => 300,
                  'retry_count' => 0,
                  'cooldown_seconds' => 0,
                  'priority' => 100,
                  'popup_frequency' => 'once_per_session',
                  'counts_toward_normal_quota' => true,
                  'stackable' => false,
                  'kill_switch' => false,
                  'created_by' => $owner->id,
                  'created_at' => $now,
                  'updated_at' => $now,
              ]);
              $offerProductId = (int) $db::table('flash_offer_products')->insertGetId([
                  'flash_offer_id' => $offerId,
                  'product_id' => $productId,
                  'selling_unit_id' => $unitId,
                  'selling_unit_code' => 'EA',
                  'conversion_factor' => 1,
                  'flash_price' => 8,
                  'allocation_base' => 100,
                  'created_at' => $now,
                  'updated_at' => $now,
              ]);

              file_put_contents('/tmp/foodex-fresh-fixture.json', json_encode([
                  'store_id' => $storeId,
                  'b2b_store_id' => $b2bStoreId,
                  'owner_id' => $owner->id,
                  'product_id' => $productId,
                  'customer_id' => $domainCustomerId,
                  'flash_offer_id' => $offerId,
                  'flash_offer_product_id' => $offerProductId,
                  'owner_token' => $owner->createToken('fresh-install-van')->plainTextToken,
                  'customer_token' => $customerUser->createToken('fresh-install-customer')->plainTextToken,
                  'flags' => $actualFlags,
              ], JSON_THROW_ON_ERROR));
              exit(0);
          }

          throw new RuntimeException('Unknown acceptance mode.');
          PHP

          FRESH_ROOT="$fresh" php /tmp/foodex-fresh-install.php prepare

          stop_server() {
            local pid_file="$1"
            [[ -f "$pid_file" ]] || return 0
            local pid
            pid="$(cat "$pid_file")"
            if kill -0 "$pid" 2>/dev/null; then
              kill "$pid" 2>/dev/null || true
              for _ in {1..20}; do
                kill -0 "$pid" 2>/dev/null || break
                sleep 0.25
              done
              if kill -0 "$pid" 2>/dev/null; then
                kill -9 "$pid" 2>/dev/null || true
              fi
            fi
            rm -f "$pid_file"
          }

          wait_for_http() {
            local label="$1"
            local pid_file="$2"
            local log_file="$3"
            local url="$4"
            local output_file="$5"
            local expected_code="$6"
            local pid code
            pid="$(cat "$pid_file")"

            for _ in {1..45}; do
              if ! kill -0 "$pid" 2>/dev/null; then
                echo "::error::$label server exited before becoming ready."
                cat "$log_file" || true
                tail -n 200 "$fresh/backend/storage/logs/laravel.log" 2>/dev/null || true
                return 1
              fi
              code="$(curl -s -o "$output_file" -w '%{http_code}' "$url" || true)"
              if [[ "$code" == "$expected_code" ]]; then
                return 0
              fi
              sleep 1
            done

            echo "::error::$label readiness timed out; expected HTTP $expected_code from $url."
            cat "$log_file" || true
            tail -n 200 "$fresh/backend/storage/logs/laravel.log" 2>/dev/null || true
            return 1
          }

          wait_for_port_free() {
            for _ in {1..40}; do
              if ! (exec 3<>/dev/tcp/127.0.0.1/8099) 2>/dev/null; then
                return 0
              fi
              exec 3>&- 3<&- || true
              sleep 0.25
            done
            echo "::error::Port 8099 is still occupied after stopping the acceptance server."
            ss -ltnp 2>/dev/null | grep ':8099' || true
            return 1
          }

          rm -f /tmp/foodex-install-server.log /tmp/foodex-install-server.pid
          (
            cd "$fresh/backend"
            php artisan serve --host=127.0.0.1 --port=8099 >/tmp/foodex-install-server.log 2>&1 &
            echo $! >/tmp/foodex-install-server.pid
          )
          trap 'stop_server /tmp/foodex-install-server.pid; stop_server /tmp/foodex-installed-server.pid' EXIT

          wait_for_http             "Pre-finish installer"             /tmp/foodex-install-server.pid             /tmp/foodex-install-server.log             http://127.0.0.1:8099/install             /tmp/install-before.html             200
          grep -Fq 'FOODEX' /tmp/install-before.html

          # Finish mutates installer/environment state. Do not let Artisan's development
          # server hot-reload in the middle of acceptance requests: stop it completely,
          # wait for the socket to be released, then start a fresh post-install process.
          stop_server /tmp/foodex-install-server.pid
          wait_for_port_free

          FRESH_ROOT="$fresh" php /tmp/foodex-fresh-install.php finish

          rm -f /tmp/foodex-installed-server.log /tmp/foodex-installed-server.pid
          (
            cd "$fresh/backend"
            php artisan serve --host=127.0.0.1 --port=8099 >/tmp/foodex-installed-server.log 2>&1 &
            echo $! >/tmp/foodex-installed-server.pid
          )

          wait_for_http             "Post-finish dashboard"             /tmp/foodex-installed-server.pid             /tmp/foodex-installed-server.log             'http://127.0.0.1:8099/admin/b2c/login?locale=en'             /tmp/login.html             200

          rm -f /tmp/foodex-cookies.txt
          code="$(curl -sS -c /tmp/foodex-cookies.txt -o /tmp/login.html -w '%{http_code}' 'http://127.0.0.1:8099/admin/b2c/login?locale=en')"
          test "$code" = "200"

          csrf="$(python3 - <<'PY'
          import html, re
          text = open('/tmp/login.html', encoding='utf-8').read()
          match = re.search(r'name="_token"\s+value="([^"]+)"', text)
          assert match, 'CSRF token missing from login page.'
          print(html.unescape(match.group(1)))
          PY
          )"
          login_code="$(curl -sS -b /tmp/foodex-cookies.txt -c /tmp/foodex-cookies.txt -o /tmp/login-post.html -w '%{http_code}' -X POST             --data-urlencode "_token=$csrf"             --data-urlencode "email=acceptance-owner@example.test"             --data-urlencode "password=AcceptanceOnly!12345"             --data-urlencode "locale=en"             http://127.0.0.1:8099/admin/b2c/login)"
          test "$login_code" = "302"

          eval "$(python3 - <<'PY'
          import json, shlex
          path='/tmp/foodex-fresh-fixture.json'
          data=json.load(open(path))
          required=['store_id','b2b_store_id','owner_id','product_id','customer_id','flash_offer_id','flash_offer_product_id','owner_token','customer_token','flags']
          missing=[key for key in required if key not in data]
          if missing:
              detail=' Expected seeded B2B store was not returned after fresh setup.' if 'b2b_store_id' in missing else ''
              raise SystemExit(f"Fresh-install fixture missing required keys: {missing}.{detail}")
          for key in ['store_id','b2b_store_id','owner_id','product_id','customer_id','flash_offer_id','flash_offer_product_id']:
              try:
                  value=int(data[key])
              except (TypeError, ValueError):
                  raise SystemExit(f"Fresh-install fixture key {key} is not a valid integer ID: {data[key]!r}")
              if value <= 0:
                  raise SystemExit(f"Fresh-install fixture key {key} is not a real positive ID: {value}")
          for key in ['store_id','b2b_store_id','owner_id','product_id','customer_id','flash_offer_id','flash_offer_product_id','owner_token','customer_token']:
              print(f"{key.upper()}={shlex.quote(str(data[key]))}")
          flags=data['flags']
          assert all(flags.get(k) is True for k in [
              'commercial_rules_enabled','flash_offers_enabled','customer_flash_popup_enabled','van_offers_enabled'
          ]), flags
          PY
          )"

