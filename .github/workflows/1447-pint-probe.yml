name: 1447 Pint Probe

on:
  push:
    branches:
      - feat/1447-smart-ordering-menu

permissions:
  contents: read

jobs:
  pint-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, intl, pdo_sqlite, pdo_mysql
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Format target files
        run: |
          vendor/bin/pint             app/Domain/SmartOrdering/SmartOrderingMenuReadService.php             app/Domain/SmartOrdering/SmartOrderingMenuWriteService.php             app/Domain/SmartOrdering/SmartOrderingModifierService.php             app/Http/Controllers/Admin/SmartOrderingMenuAdminController.php             app/Http/Controllers/Api/V1/SmartOrderingMenuController.php             tests/Feature/SmartOrderingMenuDomainTest.php
      - name: Emit exact Pint diff
        working-directory: .
        run: git diff --no-color -- backend/app/Domain/SmartOrdering backend/app/Http/Controllers/Admin/SmartOrderingMenuAdminController.php backend/app/Http/Controllers/Api/V1/SmartOrderingMenuController.php backend/tests/Feature/SmartOrderingMenuDomainTest.php
