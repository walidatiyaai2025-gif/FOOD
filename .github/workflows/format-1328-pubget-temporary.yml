name: Temporary 1328 PubGet Formatter

on:
  push:
    branches:
      - feat/1328-orders-tracking
    paths:
      - .github/workflows/format-1328-pubget-temporary.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/1328-orders-tracking
          fetch-depth: 0
      - name: Set up Flutter 3.47.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          cache: true
      - name: Resolve Customer dependencies exactly like Required CI
        working-directory: apps/customer_app
        run: flutter pub get
      - name: Apply and verify canonical Dart formatting
        working-directory: apps/customer_app
        run: |
          set -euo pipefail
          dart format test/customer_orders_ui_v3_test.dart
          dart format --output=none --set-exit-if-changed test/customer_orders_ui_v3_test.dart
      - name: Commit formatter output and remove this one-shot workflow
        run: |
          set -euo pipefail
          git rm .github/workflows/format-1328-pubget-temporary.yml
          git add apps/customer_app/test/customer_orders_ui_v3_test.dart
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(1328): format orders tests after Customer pub get"
          git push origin HEAD:feat/1328-orders-tracking
