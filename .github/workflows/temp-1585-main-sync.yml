name: TEMP 1585 Main Sync

on:
  push:
    branches:
      - fix/1585-order-submit-idempotency

permissions:
  contents: write

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[sync-main-1585]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/1585-order-submit-idempotency
          fetch-depth: 0
      - name: Merge current main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "foodex-ci"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
          git commit --amend -m "sync(1585): merge current main [sync-main-1585]" || true
          git push origin HEAD:fix/1585-order-submit-idempotency
