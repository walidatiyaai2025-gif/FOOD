name: Diagnostic 2268 Production API

on:
  push:
    branches:
      - fix/2268-customer-startup-first-frame
    paths:
      - .github/workflows/diagnostic-2268-production-api.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve and probe production API
        shell: bash
        run: |
          set -u
          echo "=== DNS ==="
          getent ahosts foodex.50sols.com || true
          echo "=== TLS/HTTP ==="
          set +e
          http_code="$(curl --connect-timeout 10 --max-time 20 -sS             -o /tmp/foodex-login-response.txt             -w '%{http_code}'             -H 'Accept: application/json'             -H 'Content-Type: application/json'             -X POST             --data '{"email":"diagnostic@example.invalid","password":"not-a-real-password","app":"customer"}'             https://foodex.50sols.com/api/v1/auth/login)"
          curl_status=$?
          set -e
          echo "curl_status=$curl_status"
          echo "http_code=$http_code"
          sed -n '1,20p' /tmp/foodex-login-response.txt 2>/dev/null || true
          if [[ "$curl_status" -ne 0 ]]; then
            exit "$curl_status"
          fi
          if [[ "$http_code" != "422" && "$http_code" != "401" ]]; then
            echo "::error::Unexpected production auth response: HTTP $http_code"
            exit 1
          fi
