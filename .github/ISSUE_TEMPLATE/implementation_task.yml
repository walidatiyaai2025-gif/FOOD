name: FOODEX implementation task
description: One Task = One Owner = One Branch
title: "[TASK] "
body:
  - type: textarea
    id: objective
    attributes: { label: Objective }
    validations: { required: true }
  - type: textarea
    id: scope
    attributes: { label: Scope }
    validations: { required: true }
  - type: textarea
    id: out_of_scope
    attributes: { label: Out of scope }
  - type: input
    id: apps
    attributes: { label: Affected apps }
  - type: input
    id: modules
    attributes: { label: Affected modules }
  - type: textarea
    id: dependencies
    attributes: { label: Dependencies }
  - type: textarea
    id: acceptance
    attributes: { label: Acceptance criteria }
    validations: { required: true }
  - type: textarea
    id: api
    attributes: { label: API changes }
  - type: textarea
    id: db
    attributes: { label: DB changes }
  - type: textarea
    id: permissions
    attributes: { label: Permission rules }
  - type: textarea
    id: tests
    attributes: { label: Tests required }
    validations: { required: true }
  - type: input
    id: design
    attributes: { label: Design reference }
  - type: textarea
    id: ui_placement
    attributes:
      label: UI placement decision (required when business-facing UI changes)
      description: "Use UI_PLACEMENT_SCREEN_PATTERN_CONTRACT.md. Include domain, entity, role, user_goal, workflow_type, frequency, data_density, existing_parent/canonical route, placement_type, pattern, Reuse/Extend/Compose/New Screen decision, navigation_impact, permissions and states. If New Screen, justify why the first three options are insufficient."
  - type: textarea
    id: ui_responsive_evidence
    attributes:
      label: UI responsive + locale evidence plan (required when business-facing UI changes)
      description: "Desktop, Tablet, Mobile, Arabic/RTL and English/LTR evidence. The Issue title is intent, not route authority."
  - type: input
    id: branch
    attributes: { label: Branch name }
    validations: { required: true }
  - type: input
    id: owner
    attributes: { label: Owner }
    validations: { required: true }
  - type: input
    id: lease_start
    attributes: { label: Lease start }
    validations: { required: true }
  - type: input
    id: lease_expiry
    attributes: { label: Lease expiry }
    validations: { required: true }
  - type: textarea
    id: takeover
    attributes: { label: Takeover history }
  - type: textarea
    id: dod
    attributes: { label: Definition of done }
    validations: { required: true }
